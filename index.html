  const padroesOrdenados = Object.entries(padroes).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // ---------- Funil de Leads (coleção "leads" — status: negociando/convertido/perdido) ----------
  const leadsRecebidos = state.leads.length;
  const leadsNegociando = state.leads.filter(l=>!["convertido","perdido"].includes(l.status||"negociando")).length;
  const leadsConvertidos = state.leads.filter(l=>l.status==="convertido").length;
  const leadsPerdidos = state.leads.filter(l=>l.status==="perdido").length;
  const taxaConversaoLeads = leadsRecebidos>0 ? (leadsConvertidos/leadsRecebidos*100) : 0;

  // ---------- Motivos de perda — Leads ----------
  const motivosPerda = ["outro_fotografo","achou_caro","cancelou_festa","nao_respondeu","outro"];
  const motivosLabel = {outro_fotografo:"Fechou com outro fotógrafo", achou_caro:"Achou caro", cancelou_festa:"Cancelou a festa", nao_respondeu:"Não respondeu", outro:"Outro motivo"};
  const porMotivoLeads = motivosPerda.map(m=>({
    motivo:m,
    n: state.leads.filter(l=>l.status==="perdido" && l.motivoPerda===m).length
  })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const perdidosSemMotivoLeads = state.leads.filter(l=>l.status==="perdido" && !l.motivoPerda).length;

  // ---------- Histórico de recibos ----------
  const [buscaRecibo, setBuscaRecibo] = [window._buscaRecibo||"", v=>{window._buscaRecibo=v;}];
  let recibosVisiveis = [...state.recibos].sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  if(buscaRecibo){
    const t = buscaRecibo.toLowerCase();
    recibosVisiveis = recibosVisiveis.filter(r=>{
      const c = state.clientes.find(x=>x.id===r.clienteId);
      return (r.numero||"").toLowerCase().includes(t) || (c?.nome||"").toLowerCase().includes(t);
    });

  // ---------- Conteúdo da pilha Financeiro ----------
  const conteudoFinanceiro = `
    <div class="section-title" style="margin-top:0;">Resumo histórico</div>
    <div class="card" style="padding:0;">
      <table><tbody>
        <tr><td>Total de eventos</td><td style="text-align:right;"><b>${state.eventos.length}</b></td></tr>
        <tr><td>Valor contratado (total)</td><td style="text-align:right;"><b>${money(totalContratado)}</b></td></tr>
        <tr><td>Total recebido (histórico)</td><td style="text-align:right;"><b>${money(totalRecebido)}</b></td></tr>
      </tbody></table>
    </div>
    <div style="font-size:12px; color:var(--muted-2); margin:8px 2px 18px;">
      💡 Recebido e a receber do mês/ano corrente ficam na página Financeiro — aqui é só o total acumulado.
    </div>

    <div class="section-title">Ticket médio por tipo de evento</div>
    <div class="card" style="padding:0;">
      ${porTipo.length ? `<table><thead><tr><th>Tipo</th><th>Eventos</th><th>Com valor informado</th><th>Ticket médio</th></tr></thead><tbody>
        ${porTipo.map(x=>`<tr><td>${capitalize(x.tipo.replace("_"," "))}</td><td>${x.total}</td><td>${x.comValor}</td><td>${money(x.media)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty-state">Sem eventos suficientes ainda.</div>`}
    </div>

    <div class="section-title">Descontos concedidos</div>
    <div class="card" style="padding:0;">
      <table><tbody>
        <tr><td>Total de desconto dado</td><td style="text-align:right;"><b>${money(totalDescontoDado)}</b></td></tr>
        <tr><td>Eventos com desconto</td><td style="text-align:right;"><b>${eventosComDesconto.length}</b></td></tr>
        <tr><td>Desconto médio (quando há)</td><td style="text-align:right;"><b>${money(eventosComDesconto.length ? totalDescontoDado/eventosComDesconto.length : 0)}</b></td></tr>
      </tbody></table>
    </div>
    <div class="card" style="padding:0; margin-top:14px; overflow-x:auto;">
      ${descontoPorTipo.length ? `<table><thead><tr><th>Tipo</th><th>Eventos com desconto</th><th>Total descontado</th><th>Desconto médio</th></tr></thead><tbody>
        ${descontoPorTipo.map(x=>`<tr><td>${capitalize(x.tipo.replace("_"," "))}</td><td>${x.n}</td><td>${money(x.soma)}</td><td>${money(x.media)}</td></tr>`).join("")}

/* ---------- DASHBOARD ---------- */
function parseValorConfig(raw){
  // aceita número puro (3000) ou string formatada BR ("3.000,00" / "3000,00")
  if(raw===undefined || raw===null || raw==="") return 0;
  if(typeof raw === "number") return raw;
  const limpo = String(raw).trim().replace(/\./g,"").replace(",",".");
  const n = parseFloat(limpo);
  return isNaN(n) ? 0 : n;
}
function renderCardMeta(){
  const meta = parseValorConfig(state.config?.metaMensal);
  if(!meta) return `
    <div class="card stat-card">
      <div class="label">🎯 Meta do mês</div>
      <div style="font-size:13px; color:var(--muted-2); margin-top:6px;">Não definida</div>
      <div style="margin-top:8px;"><button class="sm ghost" onclick="renderPage('configuracoes')">Definir meta →</button></div>
    </div>`;

  const hoje = new Date();
  const anoMes = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
  const recebidoMes = state.pagamentos
    .filter(p=>(p.data||"").startsWith(anoMes))
    .reduce((s,p)=>s+(Number(p.valor)||0),0);

  const pct = Math.min(Math.round(recebidoMes/meta*100), 100);
  const falta = Math.max(meta - recebidoMes, 0);
  const r = 44, circ = 2*Math.PI*r;
  const arco = circ*(1 - pct/100);
  const cor = pct>=100 ? "#22c55e" : pct>=70 ? "#3b82f6" : pct>=40 ? "#eab308" : "#ef4444";

  return `
    <div class="card">
      <div class="label" style="margin-bottom:12px;">🎯 Meta do mês</div>
      <div class="meta-ring-wrap">
        <div class="meta-ring">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--border-solid)" stroke-width="9"/>
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="${cor}" stroke-width="9"
              stroke-dasharray="${circ}" stroke-dashoffset="${arco}"
              stroke-linecap="round" style="transition:.6s ease;"/>
          </svg>
          <div class="meta-ring-label">
            <span class="meta-ring-pct" style="color:${cor}">${pct}%</span>
            <span class="meta-ring-sub">${pct>=100?"✓ batida!":"da meta"}</span>
          </div>
        </div>
        <div class="meta-info">
          <div class="meta-row"><span>Recebido</span><b style="color:#22c55e">${money(recebidoMes)}</b></div>
          <div class="meta-row"><span>Meta</span><b>${money(meta)}</b></div>
          <div class="meta-row"><span>${pct>=100?"Excedente":"Faltam"}</span><b style="color:${pct>=100?"#22c55e":"#ef4444"}">${pct>=100?money(recebidoMes-meta):money(falta)}</b></div>
        </div>
      </div>
    </div>`;
}

function renderFinanceiroPage(main){

  pagamentosEventos.forEach(p=>{
    if(!p.data) return;
    const ano = p.data.slice(0,4);
    if(!porAno[ano]) porAno[ano] = [];
    porAno[ano].push(p);

  const anos = Object.keys(porAno).sort().reverse();

/* ---- FATURAMENTO POR MÊS (pilhas por ano) ---- */
const fatExpandido = new Set([String(new Date().getFullYear())]);

function renderFaturamentoPorMes(){
  const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const mesesMap = {};
  state.eventos.forEach(e=>{
    if(!e.data) return;
    const chave = e.data.slice(0,7);
    if(!mesesMap[chave]) mesesMap[chave] = {eventos:0, contratado:0, recebido:0};
    mesesMap[chave].eventos++;
    mesesMap[chave].contratado += Number(e.valorContratado)||0;
  });
  state.pagamentos.forEach(p=>{
    if(!p.data) return;
    const chave = p.data.slice(0,7);
    if(!mesesMap[chave]) mesesMap[chave] = {eventos:0, contratado:0, recebido:0};
    mesesMap[chave].recebido += Number(p.valor)||0;
  });

  const anosMap = {};
  Object.entries(mesesMap).forEach(([chave, dados])=>{
    const ano = chave.slice(0,4);
    if(!anosMap[ano]) anosMap[ano] = {};
    anosMap[ano][chave] = dados;
  });
  const anos = Object.keys(anosMap).sort().reverse();

  return `
    <div class="section-title">Faturamento por mês</div>
    ${anos.map(ano=>{
      const isOpen = fatExpandido.has(ano);
      const meses = Object.keys(anosMap[ano]).sort().reverse();
      const totalAno = meses.reduce((s,m)=>s+(anosMap[ano][m].recebido||0),0);
      return `
        <div class="card" style="padding:0; margin-bottom:10px; overflow:hidden;">
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 18px; cursor:pointer;"
               onclick="fatExpandido.has('${ano}')?fatExpandido.delete('${ano}'):fatExpandido.add('${ano}'); renderPage('pagamentos')">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-family:'Fraunces',serif; font-size:17px;">${isOpen?"▾":"▸"} ${ano}</span>
              <span style="font-size:12px; color:var(--muted);">Recebido: ${money(totalAno)}</span>
            </div>
            <span style="font-size:12px; color:var(--muted-2);">${isOpen?"recolher":"expandir"}</span>
          </div>
          ${isOpen ? `
            <div style="border-top:1px solid var(--border-solid); overflow-x:auto;">
              <table><thead><tr><th>Mês</th><th>Eventos</th><th>Contratado</th><th>Recebido</th><th>Ticket médio</th><th>Vs. ano ant.</th></tr></thead><tbody>
                ${meses.map(chave=>{
                  const [y,m] = chave.split("-");
                  const d = anosMap[ano][chave];
                  const ticket = d.eventos ? d.contratado/d.eventos : 0;
                  const chaveAnt = `${Number(y)-1}-${m}`;
                  const ant = mesesMap[chaveAnt];
                  let vs = "—";
                  if(ant && ant.contratado>0){
                    const v = ((d.contratado-ant.contratado)/ant.contratado)*100;
                    vs = `${v>=0?"+":""}${v.toFixed(0)}%`;
                  }
                  return `<tr>
                    <td>${nomesMes[Number(m)-1]}</td>
                    <td>${d.eventos}</td>
                    <td>${money(d.contratado)}</td>
                    <td>${money(d.recebido)}</td>
                    <td>${money(ticket)}</td>
                    <td>${vs}</td>
                  </tr>`;
                }).join("")}
              </tbody></table>
            </div>
          ` : ""}
        </div>
      `;
    }).join("")}
  `;
}

function renderCollectionList(col){
  const container = document.getElementById(`collection-list-${col}`);
  if(!container) return;
  const schema = SCHEMAS[col];
  const termo = (collectionSearch[col]||"").trim().toLowerCase();

  let items = [...state[col]];
  if(termo){
    items = items.filter(item => Object.values(item).some(v=>{
      if(v==null) return false;
      if(Array.isArray(v)) return v.join(" ").toLowerCase().includes(termo);
      return String(v).toLowerCase().includes(termo);
    }));
  }
  const sortState = collectionSort[col] || { key: schema.columns[0].key, dir: 1 };
  const colOrdenada = schema.columns.find(c=>c.key===sortState.key);
  items.sort((a,b)=>{
    const va = colOrdenada?.sortValue ? colOrdenada.sortValue(a) : (a[sortState.key] ?? "");
    const vb = colOrdenada?.sortValue ? colOrdenada.sortValue(b) : (b[sortState.key] ?? "");
    return compararValores(va, vb) * sortState.dir;
  });

  container.innerHTML = `
    <div class="card" style="padding:0; overflow-x:auto;">
      ${items.length ? `
      <table>
        <thead><tr>${schema.columns.map(c=>{
          const ativa = sortState.key===c.key;
          const seta = ativa ? (sortState.dir===1?" ▲":" ▼") : "";
          return `<th style="cursor:pointer; user-select:none;" onclick="toggleOrdenacaoColuna('${col}','${c.key}')" title="Ordenar por ${c.label}">${c.label}${seta}</th>`;
        }).join("")}<th></th></tr></thead>
        <tbody>
          ${items.map(item=>`
            <tr>
              ${schema.columns.map(c=>`<td>${c.format ? c.format(item[c.key],item) : (item[c.key] ?? "—")}</td>`).join("")}
              <td class="row-actions">
                ${(col==="leads" && !item.clienteId) ? `<button class="sm" onclick="converterLeadEmCliente('${item.id}')">Converter</button>` : ""}
                <button class="sm" onclick="openView('${col}','${item.id}')">Ver</button>
                <button class="sm" onclick="openForm('${col}','${item.id}')">Editar</button>
                <button class="sm danger" onclick="deleteDoc('${col}','${item.id}')">Excluir</button>
              </td>
            </tr>
          `).join("")}

    </div>
  `;
}

/* =========================================================
   GOOGLE CALENDAR
   ========================================================= */
function buildGCalUrl(ev){
  const titulo = ev.nomeEvento || capitalize((ev.tipo||"evento").replace("_"," ")) + " — " + nomeRef("clientes",ev.clienteId);
  const dataBase = (ev.data||"").replace(/-/g,"");
  let datas;
  if(ev.horario){
    const [h,m] = ev.horario.split(":");
    const inicio = dataBase+"T"+h.padStart(2,"0")+(m||"00").padStart(2,"0")+"00";
    const horaFim = String(Number(h)+2).padStart(2,"0");
    const fim = dataBase+"T"+horaFim+(m||"00").padStart(2,"0")+"00";
    datas = inicio+"/"+fim;
  } else {
    datas = dataBase+"/"+dataBase;
  }
  const descricao = `Cliente: ${nomeRef("clientes",ev.clienteId)}\nValor: ${money(ev.valorContratado)}\nSaldo: ${money(Math.max(0,(Number(ev.valorContratado)||0)-totalPago(ev.id)))}`;
  const params = new URLSearchParams({
    action:"TEMPLATE", text:titulo, dates:datas,
    details:descricao, location:ev.endereco||""
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function gerarMsgConfirmacao(ev){
  const cliente = state.clientes.find(c=>c.id===ev.clienteId);
  const nomeCliente = cliente ? cliente.nome : "Cliente";
  const saldo = (Number(ev.valorContratado)||0) - totalPago(ev.id);
  const pago = totalPago(ev.id);
  const tipo = ev.tipo||"outro";
  const emojis = {aniversario:"🎂",batizado:"✝️",casamento_civil:"💍",casamento_religioso:"⛪",ensaio:"📸",outro:"📸"};
  const prefixos = {
    aniversario:`${emojis.aniversario} Festinha de aniversário${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    batizado:`${emojis.batizado} Batizado${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    casamento_civil:`${emojis.casamento_civil} Casamento Civil${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    casamento_religioso:`${emojis.casamento_religioso} Casamento Religioso${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    ensaio:`${emojis.ensaio} Ensaio fotográfico${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    outro:`📸 ${ev.nomeEvento||"Evento"}`
  };
  const linhas = [
    prefixos[tipo]||prefixos.outro,
    tipo==="aniversario"||tipo==="batizado" ? `${tipo==="aniversario"?"🎉":"✨"} ${nomeCliente}` : `${emojis[tipo]||"📸"} ${nomeCliente}`,
    `📅 Data: ${formatDate(ev.data)}`,
    ev.horario ? `🕓 Horário: ${ev.horario}h` : null,
    ev.endereco ? `📍 Endereço: ${ev.endereco}` : null,
    pago>0 ? `💰 Sinal recebido: ${money(pago)}` : null,
    saldo>0 ? `💵 Restante: ${money(saldo)} no dia do evento.` : "✅ Pagamento quitado.",
    "",
    "Nos vemos em breve! 🙂"
  ].filter(l=>l!==null);
  return linhas.join("\n");
}
function copiarMsgConfirmacao(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  const msg = gerarMsgConfirmacao(ev);
  const cliente = state.clientes.find(c=>c.id===ev.clienteId);
  const wa = cliente ? whatsappLink(cliente.telefone) : null;
  document.getElementById("modal-content").innerHTML = `

}

async function proximoNumeroRecibo(){
  const ano = new Date().getFullYear();
  const deste = state.recibos.filter(r=>r.numero?.startsWith(String(ano)+"-"));
  if(!deste.length) return `${ano}-100`;
  const numeros = deste.map(r=>Number(r.numero?.split("-")[1]||0));
  return `${ano}-${Math.max(...numeros)+1}`;
}
async function abrirGerarRecibo(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  const cliente = state.clientes.find(c=>c.id===ev.clienteId);
  const pago = totalPago(ev.id);
  const saldo = (Number(ev.valorContratado)||0) - pago;
  const ultimoPag = [...state.pagamentos].filter(p=>p.eventoId===eventoId).sort((a,b)=>(b.data||"").localeCompare(a.data||""))[0];
  const numSugerido = await proximoNumeroRecibo();
  // verifica se já tem recibo pra esse evento
  const reciboExistente = state.recibos.find(r=>r.eventoId===eventoId);

  document.getElementById("modal-content").innerHTML = `
    <h3>🧾 Gerar recibo</h3>
    <div class="field"><label>Número do recibo</label>

      </select>

    </div>

      <button class="primary" onclick="confirmarGerarRecibo('${eventoId}')">Gerar</button>
    </div>
  `;
  document.getElementById("modal-backdrop").classList.add("active");
}
async function confirmarGerarRecibo(eventoId){
  const numero = document.getElementById("recibo-num")?.value.trim();
  const forma = document.getElementById("recibo-forma")?.value;
  const valorTipo = document.getElementById("recibo-valor-tipo")?.value;
  if(!numero){toast("Informe o número do recibo.");return;}
  // verifica duplicata
  const existe = state.recibos.find(r=>r.numero===numero && r.eventoId!==eventoId);
  if(existe){toast(`Já existe um recibo com o número ${numero}. Altere antes de continuar.`);return;}
  const ev = state.eventos.find(e=>e.id===eventoId);
  const pago = totalPago(eventoId);
  const saldo = (Number(ev.valorContratado)||0) - pago;
  const valorRecibo = valorTipo==="total" ? Number(ev.valorContratado)||0 : pago;
  // salva ou atualiza o recibo no Firestore
  const reciboExistente = state.recibos.find(r=>r.eventoId===eventoId);
  const dadosRecibo = { eventoId, clienteId:ev.clienteId||"", numero, forma, valor:valorRecibo, quitado:saldo<=0, criadoEm:new Date().toISOString() };
  if(reciboExistente){
    await db.collection("recibos").doc(reciboExistente.id).update(dadosRecibo);
  } else {
    await db.collection("recibos").add(dadosRecibo);
  }
  const recibo = { ...dadosRecibo, id: reciboExistente?.id||"" };
  exibirRecibo(ev, recibo);
}

/* =========================================================
   LEITURA DE FOTO DA FESTA (IA)
   ========================================================= */
// lê a data real gravada pela câmera no momento da foto (metadado EXIF),
// muito mais confiável do que pedir pra IA "adivinhar" a data olhando a imagem.
// retorna "AAAA-MM-DD" ou null se a foto não tiver esse metadado (ex: print de tela, foto sem EXIF).
async function extrairDataExif(file){
  if(typeof exifr === "undefined"){
    console.warn("[exif] lib exifr não carregou (CDN indisponível?). Seguindo sem data do EXIF.");
    return null;
  }
  try{
    const dados = await exifr.parse(file, { pick:["DateTimeOriginal","CreateDate"] });
    const dt = dados?.DateTimeOriginal || dados?.CreateDate;
    if(!dt) return null;
    const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,"0"), d = String(dt.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }catch(err){
    console.warn("[exif] não foi possível ler metadados da foto:", err);
    return null;
  }
}

/* =========================================================
   CRIAR EVENTOS EM LOTE A PARTIR DE VÁRIAS FOTOS
   Só usa o EXIF (sem IA): lê a data real da câmera de cada foto,
   agrupa por data (fotos do mesmo dia = candidatas ao mesmo evento)
   e apresenta um card de revisão por grupo — nada é salvo sem
   confirmação explícita, e nenhuma foto é enviada ao Firestore.
   ========================================================= */
let loteFotosGrupos = [];
let _loteGrupoIdSeq = 1;

function triggerLoteFotosUpload(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.multiple = true;
  input.onchange = (e)=> processarFotosLote(Array.from(e.target.files||[]));
  input.click();
}

async function processarFotosLote(files){
  if(!files.length) return;
  toast(`📸 Lendo metadados de ${files.length} foto${files.length===1?"":"s"}...`, 4000);

  const porData = {}; // "AAAA-MM-DD" (ou "sem-data") -> quantidade de fotos
  for(const file of files){
    const dataExif = await extrairDataExif(file);
    const chave = dataExif || "sem-data";
    porData[chave] = (porData[chave]||0) + 1;
  }

  const chaves = Object.keys(porData).sort((a,b)=>{
    if(a==="sem-data") return 1;
    if(b==="sem-data") return -1;
    return a.localeCompare(b);
  });

  loteFotosGrupos = chaves.map(chave=>({
    id: "loteGrupo"+(_loteGrupoIdSeq++),
    data: chave==="sem-data" ? "" : chave,
    qtdFotos: porData[chave],
    tipo: "",
    clienteId: "",
    _quickNovoCliente: {}
  }));

  abrirModalLoteFotos();
}

function abrirModalLoteFotos(){
  document.getElementById("modal-content").innerHTML = `
    <h3>📸 Criar eventos em lote</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.5;">
      Agrupei as fotos por data (metadado EXIF da câmera — fotos do mesmo dia caem no mesmo grupo). Confira o tipo e o cliente de cada grupo antes de criar os eventos. Nenhuma foto é enviada ou salva — só a data é usada.
    </div>
    <div id="lote-fotos-lista">${renderListaGruposLote()}</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Fechar</button>
      <button class="primary" onclick="criarTodosGruposLote()">Criar todos os prontos</button>
    </div>
  `;
  document.getElementById("modal-backdrop").classList.add("active");
}

function renderListaGruposLote(){
  if(!loteFotosGrupos.length) return `<div class="empty-state">Nenhum grupo pendente.</div>`;
  return loteFotosGrupos.map(renderGrupoLoteFoto).join("");
}

function renderGrupoLoteFoto(grupo){
  const todosOsTipos = ["aniversario","batizado","casamento_civil","casamento_religioso","ensaio","outro"];
  const clientesOrdenados = [...state.clientes].sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
  const isNovoCliente = grupo.clienteId === "__new__";
  return `
    <div class="card" style="margin-bottom:10px; padding:14px 16px;">
      <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">
        📷 ${grupo.qtdFotos} foto${grupo.qtdFotos===1?"":"s"} ${grupo.data ? "· mesmo dia" : "· sem data no EXIF (preencha manualmente)"}
      </div>
      <div class="field-row">
        <div class="field"><label>Data</label>
          <input type="date" value="${grupo.data}" onchange="onLoteGrupoCampo('${grupo.id}','data',this.value)">
        </div>
        <div class="field"><label>Tipo</label>
          <select onchange="onLoteGrupoCampo('${grupo.id}','tipo',this.value)">
            <option value="">—</option>
            ${todosOsTipos.map(t=>`<option value="${t}" ${grupo.tipo===t?"selected":""}>${capitalize(t.replace("_"," "))}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Cliente</label>
        <select onchange="onLoteGrupoCliente('${grupo.id}',this.value)">
          <option value="">—</option>
          <option value="__new__" ${isNovoCliente?"selected":""}>+ Cadastrar novo cliente</option>
          ${clientesOrdenados.map(c=>`<option value="${c.id}" ${grupo.clienteId===c.id?"selected":""}>${c.nomeConjuge ? c.nome+" & "+c.nomeConjuge : c.nome}</option>`).join("")}
        </select>
      </div>
      ${isNovoCliente ? `
        <div class="field"><label>Nome do novo cliente</label>
          <input type="text" value="${grupo._quickNovoCliente?.nome||""}" oninput="onLoteGrupoNovoClienteCampo('${grupo.id}','nome',this.value)">
        </div>
        <div class="field"><label>Telefone (opcional)</label>
          <input type="tel" value="${grupo._quickNovoCliente?.telefone||""}" oninput="onLoteGrupoNovoClienteCampo('${grupo.id}','telefone',this.value)">
        </div>
      ` : ""}
      <div class="modal-actions" style="border-top:1px solid var(--border); margin-top:12px; padding-top:12px;">
        <button class="ghost sm" onclick="removerGrupoLote('${grupo.id}')">Ignorar este grupo</button>
        <button class="primary sm" onclick="criarEventoDoGrupoLote('${grupo.id}')">Criar este evento</button>
      </div>
    </div>
  `;
}

function onLoteGrupoCampo(id, campo, valor){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(g) g[campo] = valor;
}
function onLoteGrupoCliente(id, clienteId){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(!g) return;
  g.clienteId = clienteId;
  if(clienteId==="__new__" && !g._quickNovoCliente) g._quickNovoCliente = {};
  rerenderListaLote();
}
function onLoteGrupoNovoClienteCampo(id, campo, valor){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(g){ g._quickNovoCliente = g._quickNovoCliente||{}; g._quickNovoCliente[campo] = valor; }
}
function rerenderListaLote(){
  const container = document.getElementById("lote-fotos-lista");
  if(container) container.innerHTML = renderListaGruposLote();
}
function removerGrupoLote(id){
  loteFotosGrupos = loteFotosGrupos.filter(g=>g.id!==id);
  rerenderListaLote();
  if(!loteFotosGrupos.length) toast("Nenhum grupo restante.");
}

async function criarEventoDoGrupoLote(id, opcoes={}){
  const { silencioso=false } = opcoes;
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(!g) return false;
  if(!g.data){ if(!silencioso) toast("Informe a data deste grupo."); return false; }
  if(!g.tipo){ if(!silencioso) toast("Selecione o tipo de evento deste grupo."); return false; }
  if(!g.clienteId){ if(!silencioso) toast("Selecione o cliente deste grupo."); return false; }
  if(g.clienteId==="__new__" && !g._quickNovoCliente?.nome){ if(!silencioso) toast("Informe o nome do novo cliente."); return false; }

  try{
    let clienteId = g.clienteId;
    if(clienteId==="__new__"){
      const ref = await db.collection("clientes").add({
        nome: g._quickNovoCliente.nome,
        telefone: g._quickNovoCliente.telefone||"",
        criadoEm: new Date().toISOString()
      });
      clienteId = ref.id;
    }
    await db.collection("eventos").add({
      tipo: g.tipo, data: g.data, clienteId, status:"confirmado",
      fotoLida: true, criadoEm: new Date().toISOString()
    });
    loteFotosGrupos = loteFotosGrupos.filter(x=>x.id!==id);
    if(!silencioso){
      toast("Evento criado.");
      if(loteFotosGrupos.length) rerenderListaLote(); else closeModal();
    }
    return true;
  }catch(err){
    console.error(err);
    if(!silencioso) toast("Erro ao criar o evento. Veja o console.");
    return false;
  }
}

async function criarTodosGruposLote(){
  const idsPendentes = loteFotosGrupos.map(g=>g.id);
  let criados = 0, pulados = 0;
  for(const id of idsPendentes){
    const ok = await criarEventoDoGrupoLote(id, {silencioso:true});
    if(ok) criados++; else pulados++;
  }
  if(criados) toast(`${criados} evento${criados===1?"":"s"} criado${criados===1?"":"s"}.${pulados?` ${pulados} grupo${pulados===1?"":"s"} incompleto${pulados===1?"":"s"} ficou${pulados===1?"":"aram"} pendente — preencha e crie individualmente.`:""}`, 5000);
  else toast("Nenhum grupo estava completo. Preencha tipo, cliente e data antes de criar.");
  if(loteFotosGrupos.length) rerenderListaLote(); else closeModal();
}

async function processarFotoFestaNovoEvento(file){
  if(!file) return;
  // só faz sentido preencher algo se o formulário de "novo evento" ainda estiver aberto
  if(formState._col !== "eventos" || formState._id){
    toast("Abra o formulário de novo evento antes de enviar a foto.");
    return;
  }

  const t = document.getElementById("toast");
  if(t){ t.textContent = "📸 Analisando a foto..."; t.style.display="block"; }

  // lê a data real da câmera (EXIF) antes de tudo — é mais confiável que a IA "chutando" pela imagem.
  // aplica no formulário JÁ AQUI: mesmo que o Gemini falhe depois, a data fica correta.
  const dataExif = await extrairDataExif(file);
  if(dataExif){
    formState.data = dataExif;
    refreshFormFields();
  }

  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler a imagem.");
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type || "image/jpeg";
    const hoje = new Date().toISOString().slice(0,10);

    const prompt = `Você é um assistente de um fotógrafo brasileiro que está CADASTRANDO UM NOVO EVENTO a partir de uma foto de uma festa ou sessão já fotografada. A data de hoje é ${hoje}. Analise a imagem e extraia todas as informações visíveis. Retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{
  "tipo": "aniversario|batizado|casamento_civil|casamento_religioso|ensaio|outro",
  "dataCapturaExif": "",
  "nomeHomenageado": "",
  "idadeCrianca": null,
  "temaFesta": "",
  "tags": [],
  "observacoes": ""
}

Instruções por campo:
- "tipo": tipo de evento sugerido pelo contexto visual da foto (bolo/decoração infantil = aniversario; roupa/cerimônia de batismo = batizado; noivos, aliança ou cerimônia de casamento = casamento_civil ou casamento_religioso; ensaio fotográfico solo/casal/gestante sem festa = ensaio; se não conseguir identificar, use "outro").
- "dataCapturaExif": deixe vazio — a data já é obtida por outro meio, não é necessário estimar.
- "nomeHomenageado": nome da criança, aniversariante, noivos ou pessoa homenageada, se aparecer escrito em bolo, topper, faixa, convite, balão ou decoração. Deixe vazio se não aparecer.
- "idadeCrianca": número inteiro da idade que a criança completou (somente se for aniversário infantil), lendo velas, número em balões, topper ou texto da decoração ("2 aninhos" = 2). Null se não for possível identificar ou não se aplicar.
- "temaFesta": tema decorativo identificado (ex: "Dinossauro", "Princesa", "Safari", "Homem-Aranha", "Fazendinha"). Deixe vazio se não identificar.
- "tags": array de strings com características visuais úteis para busca futura (ex: ["azul","balões","mesa de doces"]). Máximo 6 tags.
- "observacoes": qualquer outra informação relevante visível na foto (nome do buffet/local se aparecer, decoração especial, etc).`;

    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){
      const prefixoData = dataExif ? "✅ Data do evento já preenchida pelo EXIF da câmera. " : "";
      toast(`${prefixoData}Não consegui ler o restante da foto (tipo, tema, tags etc.) — ${mensagemErroIA(resultado, "analisar a foto")}`, resultado.sobrecarregado ? 8000 : 6000);
      return;
    }
    let dados;
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      dados = JSON.parse(limpo);
    }catch(err){
      console.error("[foto-festa-novo-evento] parse error:", err, resultado.texto);
      const prefixoData = dataExif ? " A data do evento já foi preenchida pelo EXIF da câmera." : "";
      toast("Não consegui interpretar os dados da foto." + prefixoData + " Veja o console.");
      return;
    }

    if(dados.tipo) formState.tipo = dados.tipo;
    // a data do EXIF (metadado real da câmera) tem prioridade sobre qualquer estimativa da IA
    const dataFinal = dataExif || dados.dataCapturaExif;
    if(dataFinal) formState.data = dataFinal;

    const tagsDetectadas = [...(dados.tags||[])];
    if(dados.temaFesta && !tagsDetectadas.includes(dados.temaFesta)) tagsDetectadas.push(dados.temaFesta);
    if(tagsDetectadas.length){
      const tagsAtuais = Array.isArray(formState.tags) ? formState.tags : [];
      formState.tags = [...new Set([...tagsAtuais, ...tagsDetectadas])];
    }
    if(dados.observacoes && !formState.nomeEvento) formState.nomeEvento = dados.observacoes;

    // tenta casar o nome homenageado com uma criança ou cliente já cadastrado
    if(dados.nomeHomenageado){
      const ehCasamento = ["casamento_civil","casamento_religioso"].includes(dados.tipo);
      if(!ehCasamento){
        const criancaExistente = state.criancas.find(c=> similaridadeNome(c.nome, dados.nomeHomenageado) >= 0.82);
        if(criancaExistente){
          formState.criancaId = criancaExistente.id;
          const respId = criancaExistente.clientePaiId || criancaExistente.clienteMaeId;
          if(respId) formState.clienteId = respId;
        } else {
          formState.criancaId = "__new__";
          formState._quickNew_criancaId = { nome: dados.nomeHomenageado };
          if(dados.idadeCrianca!==null && dados.idadeCrianca!==undefined && formState.data){
            const dataEv = new Date(formState.data+"T00:00:00");
            const anoNasc = dataEv.getFullYear() - dados.idadeCrianca;
            formState._quickNew_criancaId.dataNascimento = `${anoNasc}-${String(dataEv.getMonth()+1).padStart(2,"0")}-${String(dataEv.getDate()).padStart(2,"0")}`;
            formState._quickNew_criancaId.nascimentoAproximado = true;
          }
        }
      }
      if(!formState.clienteId){
        const clienteExistente = state.clientes.find(c=>
          similaridadeNome(c.nome, dados.nomeHomenageado) >= 0.82 ||
          (c.nomeConjuge && similaridadeNome(c.nomeConjuge, dados.nomeHomenageado) >= 0.82)
        );
        if(clienteExistente) formState.clienteId = clienteExistente.id;
      }
    }

    formState.iaVerificado = true;
    formState.fotoLida = true;
    refreshFormFields();
    const avisoData = dataExif ? "Data confirmada pelo EXIF da câmera."
      : (dados.dataCapturaExif ? "Data estimada pela IA (sem EXIF na foto) — confira!" : "Não foi possível identificar a data — confira!");
    toast(`Campos preenchidos a partir da foto. ${avisoData} Confira cliente/criança e complete o que faltar antes de salvar.`, 5000);
  };
  reader.readAsDataURL(file);
}

async function processarFotoFesta(eventoId, file){
  if(!file) return;
  const t = document.getElementById("toast");
  if(t){ t.textContent = "📸 Analisando a foto..."; t.style.display="block"; }

  // lê a data real da câmera (EXIF) antes de tudo — é mais confiável que a IA "chutando" pela imagem
  const dataExif = await extrairDataExif(file);

  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler a imagem.");
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type || "image/jpeg";
    const ev = state.eventos.find(e=>e.id===eventoId);
    const dataAtual = ev?.data || "";

    const prompt = `Você é um assistente de um fotógrafo brasileiro. Analise esta foto de uma festa ou evento fotográfico e extraia todas as informações visíveis. Retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{
  "dataCapturaExif": "",
  "nomeNaFoto": "",
  "idadeCrianca": null,
  "temaFesta": "",
  "tags": [],
  "observacoes": ""
}

Instruções por campo:
- "dataCapturaExif": deixe vazio — a data já é obtida por outro meio, não é necessário estimar.
- "nomeNaFoto": nome da criança ou pessoa homenageada, se aparecer escrito em bolo, topper, faixa, balão ou decoração. Deixe vazio se não aparecer.
- "idadeCrianca": número inteiro da idade que a criança completou, lendo velas, número em balões, topper ou texto da decoração ("2 aninhos" = 2). Null se não for possível identificar.
- "temaFesta": tema decorativo identificado (ex: "Dinossauro", "Princesa", "Safari", "Homem-Aranha", "Fazendinha"). Deixe vazio se não identificar.
- "tags": array de strings com características visuais úteis para busca futura (ex: ["azul","balões","mesa de doces","bolo florido"]). Máximo 6 tags.
- "observacoes": qualquer outra informação relevante visível na foto (nome do buffet se aparecer, decoração especial, etc).`;

    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){
      if(dataExif){
        toast("✅ Data identificada pelo EXIF da câmera. Não consegui ler o restante da foto (tema, tags etc.) — confirme a atualização da data.", 6000);
        abrirConfirmacaoFotoFesta(eventoId, { dataCapturaExif: dataExif, idadeCrianca: null, nomeNaFoto: "", temaFesta: "", tags: [], observacoes: "", _dataFonte: "exif" });
      } else {
        toast(mensagemErroIA(resultado, "analisar a foto"), resultado.sobrecarregado ? 7000 : undefined);
      }
      return;
    }
    let dados;
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      dados = JSON.parse(limpo);
    }catch(err){
      console.error("[foto-festa] parse error:", err, resultado.texto);
      toast("Não consegui interpretar os dados da foto. Veja o console.");
      return;
    }
    // a data do EXIF (metadado real da câmera) tem prioridade sobre qualquer estimativa da IA
    if(dataExif) dados.dataCapturaExif = dataExif;
    dados._dataFonte = dataExif ? "exif" : (dados.dataCapturaExif ? "ia" : null);
    abrirConfirmacaoFotoFesta(eventoId, dados);
  };
  reader.readAsDataURL(file);
}

async function confirmarFotoFesta(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  const updates = {};

  const data = document.getElementById("ff-data")?.value;
  if(data && data !== ev.data) updates.data = data;

  const tagsStr = document.getElementById("ff-tags")?.value;
  if(tagsStr!==undefined){
    const tags = tagsStr.split(",").map(t=>t.trim()).filter(Boolean);
    if(JSON.stringify(tags) !== JSON.stringify(ev.tags||[])) updates.tags = tags;
  }

  const obs = document.getElementById("ff-obs")?.value;
  if(obs) updates.nomeEvento = updates.nomeEvento || obs;

  try{
    if(Object.keys(updates).length || document.getElementById("ff-data")?.value){
      updates.fotoLida = true;
      updates.iaVerificado = true;
    }
    if(Object.keys(updates).length) await db.collection("eventos").doc(eventoId).update(updates);

    // atualiza a criança se tiver dados
    const crianca = ev.criancaId ? state.criancas.find(c=>c.id===ev.criancaId) : null;
    if(crianca){
      const criancaUpdates = {};
      const nome = document.getElementById("ff-nome")?.value;
      if(nome && nome !== crianca.nome) criancaUpdates.nome = nome;
      const nasc = document.getElementById("ff-nasc")?.value;
      if(nasc && nasc !== crianca.dataNascimento){
        criancaUpdates.dataNascimento = nasc;
        criancaUpdates.nascimentoAproximado = true;
      }
      if(Object.keys(criancaUpdates).length) await db.collection("criancas").doc(crianca.id).update(criancaUpdates);
    }

    toast("Evento atualizado com sucesso!");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}

   IA — GEMINI
   ========================================================= */
/* =========================================================
   DETECÇÃO DE DUPLICIDADE (heurística local + reforço opcional de IA)
   ========================================================= */
function normalizarTexto(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function similaridadeNome(a,b){
  const na = normalizarTexto(a), nb = normalizarTexto(b);
  if(!na || !nb) return 0;
  if(na===nb) return 1;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length, nb.length);
  return 1 - (dist/maxLen);
}
function telefoneNormalizado(t){
  const d = (t||"").replace(/\D/g,"");
  return d.slice(-8); // últimos 8 dígitos, ignora DDI/DDD pra comparar
}

async function verificarDuplicados(){
  const clientes = state.clientes;
  const pares = [];
  for(let i=0;i<clientes.length;i++){
    for(let j=i+1;j<clientes.length;j++){
      const a = clientes[i], b = clientes[j];
      const simNome = similaridadeNome(a.nome, b.nome);
      const telA = telefoneNormalizado(a.telefone), telB = telefoneNormalizado(b.telefone);
      const mesmoTelefone = telA && telB && telA===telB;
      if(simNome>=0.78 || mesmoTelefone){
        pares.push({ a, b, simNome, mesmoTelefone });
      }
    }
  }
  pares.sort((x,y)=> (y.mesmoTelefone-x.mesmoTelefone) || (y.simNome-x.simNome));

function parseRetryAfter(mensagemErro){
  // extrai o número de segundos do texto de erro de rate limit do Gemini
  const match = (mensagemErro||"").match(/retry in ([\d.]+)\s*s/i);
  return match ? Math.ceil(parseFloat(match[1])) : null;
}
function ehErroSobrecarga(mensagemErro){
  // identifica o erro "modelo sobrecarregado" (503 / UNAVAILABLE), diferente do rate limit (429)
  return /overloaded|high demand|unavailable|servidores?\s+sobrecarregados?/i.test(mensagemErro||"");
}
// tenta de novo automaticamente quando o Gemini está sobrecarregado, com espera crescente entre as tentativas
const RETRY_SOBRECARGA_SEGUNDOS = [5, 12];
function mensagemErroIA(resultado, acao="processar"){
  if(resultado?.sobrecarregado){
    return `Os servidores do Gemini estão com alta demanda no momento. Já tentei de novo automaticamente algumas vezes, mas ainda sem sucesso — espere alguns minutos e tente ${acao} de novo.`;
  }
  return `Erro ao ${acao}: ${resultado?.erro || "tente novamente."}`;
}
function mostrarErroGemini(erro, elementoId){
  const segundos = parseRetryAfter(erro);
  if(segundos){
    // rate limit — mostra contagem regressiva e retenta automaticamente
    const el = document.getElementById(elementoId);
    let restante = segundos;
    const atualizar = ()=>{
      if(el) el.textContent = `Limite de requisições atingido. Tentando novamente em ${restante}s...`;
      else toast(`Limite atingido. Aguardando ${restante}s...`);
    };
    atualizar();
    const intervalo = setInterval(()=>{
      restante--;
      if(restante<=0){ clearInterval(intervalo); return; }
      atualizar();
    }, 1000);
    return { rateLimited: true, segundos, intervalo };
  }
  // erro genérico — mostra mensagem amigável
  const amigavel = (()=>{
    if(!erro) return "Erro desconhecido.";
    if(erro.includes("API_KEY") || erro.includes("API key")) return "Chave Gemini inválida. Verifique em Configurações.";
    if(erro.includes("quota") || erro.includes("Quota")) return "Cota do Gemini esgotada. Tente novamente mais tarde.";
    if(erro.includes("404") || erro.includes("not found")) return "Modelo Gemini não encontrado. Verifique se a chave é válida.";
    return erro;
  })();
  toast(amigavel);
  return { rateLimited: false };
}

const GEMINI_MODEL_PADRAO = "gemini-3.5-flash";        // briefing, resumo, duplicados, leitura de fotos/prints
const GEMINI_MODEL_CHAT = "gemini-3.1-flash-lite";     // chat "Conversar" — perguntas diretas de consulta, prioriza velocidade

async function callGemini(prompt, tentativa=0, modelo=GEMINI_MODEL_PADRAO){
  const key = state.config?.geminiKey || "";
  if(!key) return { erro: "Nenhuma chave Gemini configurada." };
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    const data = await res.json();
    if(!res.ok){
      const msg = data?.error?.message || `Erro HTTP ${res.status}`;
      console.error("[gemini] erro da API:", msg, data);
      const segundos = parseRetryAfter(msg);
      if(segundos && tentativa===0){
        toast(`Limite de requisições atingido. Retentando em ${segundos}s automaticamente...`, (segundos+3)*1000);
        await new Promise(r=>setTimeout(r, segundos*1000));
        return callGemini(prompt, 1, modelo);
      }
      if(ehErroSobrecarga(msg) && tentativa<RETRY_SOBRECARGA_SEGUNDOS.length){
        const espera = RETRY_SOBRECARGA_SEGUNDOS[tentativa];
        toast(`Os servidores do Gemini estão com alta demanda no momento. Tentando de novo em ${espera}s (tentativa ${tentativa+1}/${RETRY_SOBRECARGA_SEGUNDOS.length})...`, (espera+3)*1000);
        await new Promise(r=>setTimeout(r, espera*1000));
        return callGemini(prompt, tentativa+1, modelo);
      }
      return { erro: msg, segundosRetry: segundos, sobrecarregado: ehErroSobrecarga(msg) };
    }
    const texto = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!texto){
      console.error("[gemini] resposta sem texto:", data);
      return { erro: "A IA não retornou texto. Veja o console para detalhes." };
    }
    return { texto };
  }catch(err){
    console.error("[gemini] erro de rede:", err);
    return { erro: "Falha de conexão com o Gemini. Verifique sua internet." };
  }
}
function temIA(){ return !!(state.config?.geminiKey); }

   ALERTAS PROATIVOS
   ========================================================= */
// um item fica "adormecido" pra um tipo de alerta específico até a data guardada em alertaSnoozeAte
// (guardamos o tipo junto porque, em tese, o mesmo documento poderia futuramente disparar mais de um tipo de alerta)
function alertaAdormecido(item, tipo, hoje){
  return !!(item.alertaSnoozeTipo===tipo && item.alertaSnoozeAte && item.alertaSnoozeAte>=hoje);
}

function calcularAlertas(){
  const alertas = [];
  const agora = new Date();
  const hoje = agora.toISOString().slice(0,10);

  // Leads sem atualização há 7+ dias
  state.leads.filter(l=>l.status!=="convertido"&&l.status!=="perdido").forEach(l=>{
    const ults = (l.comentarios||[]).map(c=>c.criadoEm||"").sort().reverse()[0];
    const ref = ults ? new Date(ults) : new Date(l.criadoEm||agora);
    const dias = Math.floor((agora-ref)/86400000);
    if(dias>=7 && !alertaAdormecido(l,"lead_parado",hoje)) alertas.push({tipo:"lead_parado", texto:`Lead <b>${l.nome}</b> sem atualização há ${dias} dias.`, id:l.id, col:"leads"});
  });

  // Eventos realizados sem entrega há 30+ dias
  state.eventos.filter(e=>e.status==="realizado"&&!e.dataEntregaReal).forEach(e=>{
    const ref = new Date(e.data||agora);
    const dias = Math.floor((agora-ref)/86400000);
    if(dias>=30 && !alertaAdormecido(e,"entrega_atrasada",hoje)){
      const cli = nomeRef("clientes",e.clienteId);
      alertas.push({tipo:"entrega_atrasada", texto:`Evento de <b>${cli}</b> realizado há ${dias} dias ainda sem entrega.`, id:e.id, col:"eventos"});
    }
  });

  // Saldo a receber em eventos entregues
  state.eventos.filter(e=>e.status==="entregue").forEach(e=>{
    const saldo = (Number(e.valorContratado)||0)-totalPago(e.id);
    if(saldo>0 && !alertaAdormecido(e,"saldo_pendente",hoje)){
      const cli = nomeRef("clientes",e.clienteId);
      alertas.push({tipo:"saldo_pendente", texto:`Evento entregue de <b>${cli}</b> ainda tem ${money(saldo)} a receber.`, id:e.id, col:"eventos"});
    }
  });

  // Prazos de prévia de produtos vencendo ou vencidos
  state.produtos.filter(p=>(p.etapa||"encomendado")!=="entregue" && p.prazoPrevia).forEach(p=>{
    const prazo = new Date(p.prazoPrevia+"T00:00:00");
    const dias = Math.floor((agora-prazo)/86400000)*-1;
    if(dias<=3 && !alertaAdormecido(p,"prazo_previa_produto",hoje)){
      const cli = nomeRef("clientes",p.clienteId);
      const nomeProd = p.produtoNome||"produto";
      const texto = dias<0 ? `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> venceu há ${Math.abs(dias)} dia${Math.abs(dias)===1?"":"s"}.`
        : dias===0 ? `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> é hoje!`
        : `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> vence em ${dias} dia${dias===1?"":"s"}.`;
      alertas.push({tipo:"prazo_previa_produto", texto, id:p.id, col:"produtos"});
    }
  });

  return alertas;
}

async function callGeminiVision(base64Data, mimeType, prompt, tentativa=0){
  const key = state.config?.geminiKey || "";
  if(!key) return { erro: "Nenhuma chave Gemini configurada." };
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL_PADRAO}:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ parts:[
        { inline_data:{ mime_type: mimeType, data: base64Data } },
        { text: prompt }
      ]}]})
    });
    const data = await res.json();
    if(!res.ok){
      const msg = data?.error?.message || `Erro HTTP ${res.status}`;
      console.error("[gemini-vision] erro da API:", msg, data);
      const segundos = parseRetryAfter(msg);
      if(segundos && tentativa===0){
        toast(`Limite de requisições atingido. Retentando em ${segundos}s automaticamente...`, (segundos+3)*1000);
        await new Promise(r=>setTimeout(r, segundos*1000));
        return callGeminiVision(base64Data, mimeType, prompt, 1);
      }
      if(ehErroSobrecarga(msg) && tentativa<RETRY_SOBRECARGA_SEGUNDOS.length){
        const espera = RETRY_SOBRECARGA_SEGUNDOS[tentativa];
        toast(`Os servidores do Gemini estão com alta demanda no momento. Tentando ler a imagem de novo em ${espera}s (tentativa ${tentativa+1}/${RETRY_SOBRECARGA_SEGUNDOS.length})...`, (espera+3)*1000);
        await new Promise(r=>setTimeout(r, espera*1000));
        return callGeminiVision(base64Data, mimeType, prompt, tentativa+1);
      }
      return { erro: msg, segundosRetry: segundos, sobrecarregado: ehErroSobrecarga(msg) };
    }
    const texto = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!texto){
      console.error("[gemini-vision] resposta sem texto:", data);
      return { erro: "A IA não retornou texto." };
    }
    return { texto };
  }catch(err){
    console.error("[gemini-vision] erro de rede:", err);
    return { erro: "Falha de conexão com o Gemini." };
  }
}

async function processarVcfCliente(clienteId, file){
  toast("Lendo contato (.vcf)...");
  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler o arquivo.");
  reader.onload = (e)=>{
    const texto = e.target.result || "";
    const dados = {};
    // parse básico de vCard
    const linhas = texto.replace(/\r\n|\r/g,"\n").split("\n");
    for(const linha of linhas){
      if(linha.startsWith("FN:")) dados.nome = linha.slice(3).trim();
      if(linha.startsWith("N:") && !dados.nome){
        const partes = linha.slice(2).split(";").filter(Boolean);
        dados.nome = partes.reverse().join(" ").trim();
      }
      const telMatch = linha.match(/^TEL[^:]*:(.*)/);
      if(telMatch && !dados.telefone) dados.telefone = telMatch[1].replace(/[^\d+]/g,"");
      const emailMatch = linha.match(/^EMAIL[^:]*:(.*)/);
      if(emailMatch && !dados.email) dados.email = emailMatch[1].trim();
    }
    if(!dados.nome && !dados.telefone){ toast("Não encontrei dados no arquivo .vcf."); return; }
    abrirConfirmacaoPrintCliente(clienteId, dados);
  };
  reader.readAsText(file, "utf-8");
}

async function processarPrintCliente(clienteId, file){
  if(!file) return;
  const t = document.getElementById("toast");
  if(t){ t.textContent = "📷 Lendo a imagem..."; t.style.display="block"; }
  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler a imagem.");
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type || "image/png";
    const prompt = `Você está ajudando um fotógrafo brasileiro a atualizar o cadastro de um cliente a partir de um print (conversa, agenda de contatos, cartão de visita etc). Extraia as informações visíveis e retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{"nome": "", "telefone": "", "cidade": "", "origem": "instagram|indicacao|google|igreja|outro"}
Se não conseguir identificar um campo com confiança, deixe vazio (string vazia). Não invente dados.`;

    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){
      toast(mensagemErroIA(resultado, "ler a imagem"), resultado.sobrecarregado ? 7000 : undefined);
      return;
    }
    let dados;
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      dados = JSON.parse(limpo);
    }catch(err){
      console.error("[print-cliente] erro ao parsear JSON:", err, resultado.texto);
      toast("Não consegui interpretar os dados extraídos. Veja o console.");
      return;
    }
    abrirConfirmacaoPrintCliente(clienteId, dados);
  };
  reader.readAsDataURL(file);
}

  if(!cliente) return;

async function confirmarAtualizacaoCliente(clienteId){

async function processarPrint(col, file){
  if(!file) return;
  const t = document.getElementById("toast");
  if(t){ t.textContent = "📷 Lendo a imagem..."; t.style.display="block"; }
  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler o arquivo de imagem.");
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type || "image/png";
    const hoje = new Date().toISOString().slice(0,10);

    let prompt;
    if(col==="leads"){
      prompt = `Você está ajudando um fotógrafo brasileiro a cadastrar um lead a partir de um print de conversa (WhatsApp, Instagram, etc). Extraia as informações visíveis na imagem e retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{"nome": "", "telefone": "", "origem": "instagram|indicacao|google|igreja|outro", "interesseTipo": "aniversario|batizado|casamento_civil|casamento_religioso|ensaio|outro", "observacoes": ""}
Se não conseguir identificar um campo com confiança, deixe vazio. Em "observacoes", resuma o que a pessoa pediu/perguntou.`;
    } else {
      prompt = `Você está ajudando um fotógrafo brasileiro a cadastrar um evento a partir de um print de conversa. A data de hoje é ${hoje}. Extraia as informações e retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{"nomeCliente": "", "telefoneCliente": "", "tipo": "aniversario|batizado|casamento_civil|casamento_religioso|ensaio|outro", "data": "AAAA-MM-DD", "horario": "HH:MM", "valorContratado": ""}
Se a data mencionada não tiver ano, assuma o próximo ano em que essa data ainda não passou a partir de hoje. Se não conseguir identificar um campo com confiança, deixe vazio.`;
    }

    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){
      toast(mensagemErroIA(resultado, "ler a imagem"), resultado.sobrecarregado ? 7000 : undefined);
      return;
    }
    let dados;
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      dados = JSON.parse(limpo);
    }catch(err){
      console.error("[print] erro ao parsear JSON:", err, resultado.texto);
      toast("Não consegui interpretar os dados extraídos. Veja o console.");
      return;
    }

    if(col==="leads"){
      if(dados.nome) formState.nome = dados.nome;
      if(dados.telefone) formState.telefone = dados.telefone;
      if(dados.origem) formState.origem = dados.origem;
      if(dados.interesseTipo) formState.interesseTipo = dados.interesseTipo;
      if(dados.observacoes) formState.observacoes = dados.observacoes;
      refreshFormFields();
      toast("Campos preenchidos a partir do print. Confira antes de salvar.");
    } else {
      if(dados.tipo) formState.tipo = dados.tipo;
      if(dados.data) formState.data = dados.data;
      if(dados.horario) formState.horario = dados.horario;
      if(dados.valorContratado) formState.valorContratado = dados.valorContratado;

      // tenta casar o nome do cliente extraído com um cliente já existente
      if(dados.nomeCliente){
        const existente = state.clientes.find(c=> similaridadeNome(c.nome, dados.nomeCliente) >= 0.85);
        if(existente){
          formState.clienteId = existente.id;
        } else {
          formState.clienteId = "__new__";
          formState._quickNew_clienteId = { nome: dados.nomeCliente, telefone: dados.telefoneCliente||"" };
        }
      }
      refreshFormFields();
      formState.iaVerificado = true;
      toast("Campos preenchidos a partir do print. Confira antes de salvar.");
    }
  };
  reader.readAsDataURL(file);
}

function openForm(col, id){
  const schema = SCHEMAS[col];
  const existing = id ? state[col].find(i=>i.id===id) : null;
  formState = existing ? { ...existing } : {};
  formState._col = col; formState._id = id || null;
  if(!existing && col==="eventos") formState.status = "confirmado"; // deixa explícito em vez de só "parecer" confirmado na tela
  if(!existing && col==="negociacoes") formState.status = "negociacao";
  if(!existing && col==="leads") formState.status = "negociando";
  if(!existing && col==="produtos"){
    formState.etapa = "encomendado";
    formState.dataPedido = new Date().toISOString().slice(0,10);
  }

  const showMarkPaid = col==="eventos" && existing && (Number(existing.valorContratado)||0) > totalPago(id);

  const podeUsarPrint = !existing && (col==="leads" || col==="eventos") && temIA();

  // bloqueia edição se o evento estiver com cadeado
  if(col==="eventos" && existing && existing.bloqueado){
    document.getElementById("modal-content").innerHTML = `
      <h3>🔒 Evento bloqueado</h3>
      <div style="font-size:14px; color:var(--muted); margin-bottom:18px;">Este evento está bloqueado e não pode ser editado. Desbloqueie primeiro pelo botão "Ver".</div>
      <div class="modal-actions"><button class="ghost" onclick="closeModal()">Fechar</button></div>
    `;
    document.getElementById("modal-backdrop").classList.add("active");
    return;
  }

  document.getElementById("modal-content").innerHTML = `
    <h3>${existing ? "Editar" : "Novo"} ${schema.singular}</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:${podeUsarPrint?"14px":"0"};">
      ${podeUsarPrint ? `<button class="ghost" onclick="triggerPrintUpload('${col}')">📷 Preencher com print de conversa (IA)</button>` : ""}
      ${(col==="eventos" && !existing && temIA()) ? `<button class="ghost" onclick="triggerFotoFestaUpload()">📸 Preencher com foto da festa (IA)</button>` : ""}
    </div>
    <div id="form-fields">${camposVisiveis(schema).map(f=>renderField(f, formState[f.key])).join("")}</div>
    ${showMarkPaid ? `
      <div class="card" style="margin-top:4px; padding:12px 14px;">
        <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
          Saldo pendente neste evento: ${money((Number(existing.valorContratado)||0) - totalPago(id))}. Cadastrando evento antigo? Marque como já recebido em vez de deixar pendente no financeiro.
        </div>
        <button class="sm" onclick="marcarComoRecebido('${id}')">Marcar valor total como já recebido</button>
      </div>
    ` : ""}
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="saveDoc()">Salvar</button>
    </div>
  `;
  document.getElementById("modal-backdrop").classList.add("active");
}
function camposVisiveis(schema){
  return schema.fields.filter(f=> !f.visibleIf || f.visibleIf(formState));
}
function aplicarValorTabela(tipo){
  if(formState._col !== "eventos") return;
  const precos = state.config?.precos || {};
  const valorPadrao = precos[tipo];
  if(valorPadrao===undefined || valorPadrao==="" || valorPadrao==null) return;
  if(!formState._id){ // só auto-preenche em eventos novos, pra não sobrescrever edição
    formState.valorTabela = valorPadrao;
    if(!formState.valorContratado) formState.valorContratado = valorPadrao;
  }
}
function aplicarProdutoCatalogo(nome){
  if(formState._col !== "produtos") return;
  const catalogo = state.config?.catalogoProdutos || [];
  const item = catalogo.find(p=>p.nome===nome);
  if(!item) return;
  if(!formState._id){ // só auto-preenche em pedidos novos, pra não sobrescrever edição
    formState.fornecedor = item.fornecedor || "";
    formState.valorCusto = item.custo || "";
    formState.valorVenda = item.venda || "";
    if(item.descricao && !formState.observacoes) formState.observacoes = item.descricao;
    refreshFormFields();
  }
}
function refreshFormFields(){
  const schema = SCHEMAS[formState._col];
  document.getElementById("form-fields").innerHTML = camposVisiveis(schema).map(f=>renderField(f, formState[f.key])).join("");
}
async function marcarComoRecebido(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  const saldo = (Number(ev.valorContratado)||0) - totalPago(eventoId);
  if(saldo<=0) return;
  try{
    await db.collection("pagamentos").add({
      eventoId, clienteId: ev.clienteId||"", valor: saldo,
      data: ev.data || new Date().toISOString().slice(0,10),
      forma: "outro", tipo: "saldo",
      criadoEm: new Date().toISOString()
    });
    toast("Evento marcado como totalmente recebido.");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao registrar o recebimento.");
  }
}

let _modalHistoryPushed = false;
function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("active");
  formState = {};
  // se esse modal tinha entrada própria no histórico (aberto normalmente, não via botão voltar),
  // consome essa entrada agora pra não deixar "lixo" no histórico do navegador
  if(_modalHistoryPushed){
    _modalHistoryPushed = false;
    history.back();
  }
}

/* ---------- Fechar modal: Esc, clique fora, e botão voltar (mobile) ---------- */
(function(){
  const backdrop = document.getElementById("modal-backdrop");

  // detecta quando o modal é aberto (por qualquer uma das dezenas de chamadas .classList.add("active") no código)
  // e empilha uma entrada no histórico, pra que o botão "voltar" feche o modal em vez de sair do app
  new MutationObserver(()=>{
    if(backdrop.classList.contains("active") && !_modalHistoryPushed){
      history.pushState({ modalAberto:true }, "");
      _modalHistoryPushed = true;
    }
  }).observe(backdrop, { attributes:true, attributeFilter:["class"] });

  // botão/gesto de voltar do navegador (inclui o botão voltar do Android)
  window.addEventListener("popstate", ()=>{
    if(backdrop.classList.contains("active")){
      _modalHistoryPushed = false; // essa entrada do histórico já foi consumida pelo próprio "voltar"
      closeModal();
    }
  });

  // clique fora da caixa do modal (no fundo escurecido)
  backdrop.addEventListener("click", (e)=>{
    if(e.target === backdrop) closeModal();
  });

  // tecla Esc
  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && backdrop.classList.contains("active")) closeModal();
  });
})();

function renderField(f, value){
  const id = `field-${f.key}`;
  if(f.type==="textarea"){
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" oninput="formState['${f.key}']=this.value">${value||""}</textarea></div>`;
  }
  if(f.type==="select"){
    const extraOnchange = f.key==="tipo" ? "aplicarValorTabela(this.value);" : "";
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="formState['${f.key}']=this.value;${extraOnchange}${f.triggersRefresh?' refreshFormFields();':''}" style="width:100%">
        <option value="">—</option>
        ${f.options.map(o=>`<option value="${o}" ${value===o?"selected":""}>${f.key==="status" ? statusLabel(o) : f.key==="etapa" ? (ETAPA_PRODUTO_LABEL[o]||capitalize(o)) : capitalize(o.replace("_"," "))}</option>`).join("")}
      </select></div>`;
  }
  if(f.type==="catalogo"){
    const catalogo = state.config?.catalogoProdutos || [];
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="formState['${f.key}']=this.value; aplicarProdutoCatalogo(this.value);" style="width:100%">
        <option value="">—</option>
        ${catalogo.filter(p=>p.nome).map(p=>`<option value="${p.nome}" ${value===p.nome?"selected":""}>${p.nome}</option>`).join("")}
      </select>
      ${!catalogo.filter(p=>p.nome).length ? `<div style="font-size:11px;color:var(--muted-2);margin-top:4px;">Nenhum produto cadastrado ainda — vá em Configurações → Catálogo de Produtos.</div>` : ""}
      </div>`;
  }
  if(f.type==="ref"){
    const opts = [...(state[f.ref] || [])].sort((a,b)=>{
      if(f.key==="criancaId" && formState.clienteId){
        const aLinked = (a.clientePaiId===formState.clienteId || a.clienteMaeId===formState.clienteId) ? 0 : 1;
        const bLinked = (b.clientePaiId===formState.clienteId || b.clienteMaeId===formState.clienteId) ? 0 : 1;
        if(aLinked !== bLinked) return aLinked - bLinked;
      }
      return (a.nome||a.nomeCasal||"").localeCompare(b.nome||b.nomeCasal||"", "pt-BR");
    });
    const isNew = value === "__new__";
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="onRefChange('${f.key}','${f.ref}',this.value)" style="width:100%">
        <option value="">—</option>
        <option value="__new__" ${isNew?"selected":""}>+ Cadastrar novo${f.ref==='criancas'?'a':''} ${SCHEMAS[f.ref].singular.toLowerCase()}</option>
        ${opts.map(o=>`<option value="${o.id}" ${value===o.id?"selected":""}>${o.nome ? (o.nomeConjuge ? `${o.nome} & ${o.nomeConjuge}` : o.nome) : labelEvento(o.id)}</option>`).join("")}
      </select>
      <div id="quick-new-${f.key}">${isNew ? renderQuickNew(f.key, f.ref) : ""}</div>
      </div>`;
  }
  if(f.type==="checkbox"){
    return `<div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="${id}" ${value?"checked":""} onchange="formState['${f.key}']=this.checked" style="width:18px; height:18px;">
      <label for="${id}" style="margin:0;">${f.label}</label>
      </div>`;
  }
  if(f.type==="tags"){
    const str = Array.isArray(value) ? value.join(", ") : (value||"");
    return `<div class="field"><label>${f.label}</label>
      <input id="${id}" type="text" value="${str}" oninput="formState['${f.key}']=this.value.split(',').map(s=>s.trim()).filter(Boolean)">
      </div>`;
  }
  return `<div class="field"><label>${f.label}</label><input id="${id}" type="${f.type}" value="${value||""}" oninput="formState['${f.key}']=this.value"></div>`;
}

function autoSelecionarCriancaVinculada(clienteId){
  // ao escolher o responsável num evento, se ele já tiver uma única criança vinculada,
  // seleciona ela automaticamente no campo "Criança" (evita repetir o trabalho manual)
  if(!clienteId || clienteId === "__new__") return;
  const filhos = state.criancas.filter(c=>c.clientePaiId===clienteId || c.clienteMaeId===clienteId);
  if(filhos.length === 1){
    formState.criancaId = filhos[0].id;
  } else if(filhos.length > 1){
    // mais de uma criança vinculada: não escolhe sozinho pra evitar erro, deixa o usuário decidir
    formState.criancaId = "";
  }
}
function onRefChange(fKey, ref, val){
  formState[fKey] = val;
  if(val === "__new__"){
    if(!formState[`_quickNew_${fKey}`]) formState[`_quickNew_${fKey}`] = {};
  } else {
    delete formState[`_quickNew_${fKey}`];
  }
  if(fKey==="clienteId"){
    if(formState._col === "eventos") autoSelecionarCriancaVinculada(val);
    refreshFormFields();
    return;
  }
  const container = document.getElementById(`quick-new-${fKey}`);
  if(val === "__new__"){
    container.innerHTML = renderQuickNew(fKey, ref);
  } else {
    container.innerHTML = "";
  }
}
function renderQuickNew(fKey, ref){
  const qf = QUICK_FIELDS[ref];
  if(!qf) return "";
  const quick = formState[`_quickNew_${fKey}`] || {};
  return `<div class="quick-new-box">
    <div style="font-size:12px;color:var(--muted);margin:10px 0 8px;">Dados d${ref==='criancas'?'a nova criança':'o novo cliente'}:</div>
    ${qf.map(q=>`<div class="field"><label>${q.label}</label><input type="${q.type}" value="${quick[q.key]||""}" oninput="formState['_quickNew_${fKey}']['${q.key}']=this.value"></div>`).join("")}
  </div>`;
}


async function saveDoc(){
  const col = formState._col;
  const id = formState._id;
  const schema = SCHEMAS[col];
  const existing = id ? state[col].find(i=>i.id===id) : null;
  const data = {};

  for(const f of camposVisiveis(schema)){
    let val = formState[f.key];

    if(val === "__new__"){
      const ref = f.ref;
      const quick = formState[`_quickNew_${f.key}`] || {};
      const qFields = QUICK_FIELDS[ref] || [];
      const missingQuick = qFields.filter(q=>q.required && !quick[q.key]);
      if(missingQuick.length){
        toast(`Preencha: ${missingQuick.map(q=>q.label).join(", ")}`);
        return;
      }
      const quickData = {};
      qFields.forEach(q=> quickData[q.key] = quick[q.key] || "");
      if(quick.nascimentoAproximado) quickData.nascimentoAproximado = true;

      if(ref === "criancas"){
        if(!quickData.dataNascimento && quickData.idadeCompletada && data.data){
          const dataFestaObj = new Date(data.data+"T00:00:00");
          const anoNasc = dataFestaObj.getFullYear() - Number(quickData.idadeCompletada);
          quickData.dataNascimento = `${anoNasc}-${String(dataFestaObj.getMonth()+1).padStart(2,"0")}-${String(dataFestaObj.getDate()).padStart(2,"0")}`;
          quickData.nascimentoAproximado = true;
        }
        if(!quickData.dataNascimento){
          toast("Informe a data de nascimento da criança ou a idade que ela completou nesta festa.");
          return;
        }
      }

      if(ref === "criancas" && data.clienteId){
        quickData.clientePaiId = data.clienteId; // já vincula a criança ao cliente do evento
      }
      quickData.criadoEm = new Date().toISOString();
      try{
        const newDocRef = await db.collection(ref).add(quickData);
        val = newDocRef.id;
      }catch(err){
        console.error(err);
        toast(`Erro ao cadastrar ${SCHEMAS[ref].singular.toLowerCase()} automaticamente.`);
        return;
      }
    }

    data[f.key] = val ?? (f.type==="tags" ? [] : f.type==="checkbox" ? false : "");
  }

  // atualiza o cônjuge do cliente, se informado no evento de casamento
  if(col === "eventos" && data.clienteId && data.conjugeEvento){
    try{ await db.collection("clientes").doc(data.clienteId).update({ nomeConjuge: data.conjugeEvento }); }
    catch(err){ console.error("[clientes] erro ao atualizar cônjuge:", err); }
  }

  // vincula/cria automaticamente o registro em "Casamentos" para eventos de casamento
  if(col === "eventos" && (data.tipo==="casamento_civil" || data.tipo==="casamento_religioso") && data.clienteId){
    const cliente = state.clientes.find(c=>c.id===data.clienteId);
    const conjugeFinal = data.conjugeEvento || cliente?.nomeConjuge || "";
    const existente = state.casamentos.find(c=>c.clienteId===data.clienteId);
    if(existente){
      data.casamentoId = existente.id;
      if(conjugeFinal && !existente.conjuge){
        try{ await db.collection("casamentos").doc(existente.id).update({ conjuge: conjugeFinal }); }
        catch(err){ console.error(err); }
      }
    } else {
      try{
        const novoCasamento = await db.collection("casamentos").add({
          nomeCasal: cliente ? cliente.nome : "Casal", conjuge: conjugeFinal,
          dataCasamento: data.data || "", clienteId: data.clienteId,
          observacoes: "", criadoEm: new Date().toISOString()
        });
        data.casamentoId = novoCasamento.id;
      }catch(err){
        console.error("[casamentos] erro ao criar automaticamente:", err);
        // não bloqueia o salvamento do evento por causa disso
      }
    }
  }

  if(col === "criancas"){
    if(!data.dataNascimento && data.idadeCompletada && data.dataFesta){
      const dataFestaObj = new Date(data.dataFesta+"T00:00:00");
      const anoNasc = dataFestaObj.getFullYear() - Number(data.idadeCompletada);
      data.dataNascimento = `${anoNasc}-${String(dataFestaObj.getMonth()+1).padStart(2,"0")}-${String(dataFestaObj.getDate()).padStart(2,"0")}`;
      data.nascimentoAproximado = true;
    } else if(data.dataNascimento){
      data.nascimentoAproximado = false;
    }
    if(!data.dataNascimento){
      toast("Informe a data de nascimento, ou a idade que ela completou + a data da festa.");
      return;
    }
  }

  // registra automaticamente a data de cada mudança de status da negociação
  if(col === "negociacoes"){
    const statusAnterior = existing ? (existing.status||"negociacao") : null;
    const statusNovo = data.status || "negociacao";
    const historico = existing && Array.isArray(existing.historicoStatus) ? [...existing.historicoStatus] : [];
    if(!existing || statusAnterior !== statusNovo){
      historico.push({ status: statusNovo, data: new Date().toISOString() });
    }
    data.historicoStatus = historico;
  }

  // registra automaticamente a data de cada mudança de etapa do pedido de produto
  if(col === "produtos"){
    const etapaAnterior = existing ? (existing.etapa||"encomendado") : null;
    const etapaNova = data.etapa || "encomendado";
    const historico = existing && Array.isArray(existing.historicoEtapas) ? [...existing.historicoEtapas] : [];
    if(!existing || etapaAnterior !== etapaNova){
      historico.push({ etapa: etapaNova, data: new Date().toISOString() });
    }
    data.historicoEtapas = historico;
  }

  const missing = camposVisiveis(schema).filter(f=>f.required && !data[f.key]);
  if(missing.length){
    toast(`Preencha: ${missing.map(f=>f.label).join(", ")}`);
    return;
  }

  try{
    if(id){
      await db.collection(col).doc(id).update(data);
      toast(`${schema.singular} atualizado.`);
    } else {
      data.criadoEm = new Date().toISOString();
      const novoRef = await db.collection(col).add(data);
      if(col === "eventos" && formState._negociacaoId){
        try{ await db.collection("negociacoes").doc(formState._negociacaoId).update({ eventoId: novoRef.id }); }
        catch(err){ console.error("[negociacoes] erro ao vincular evento:", err); }
      }
      toast(`${schema.singular} criado.`);
    }
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}

async function deleteDoc(col, id){
  if(!confirm("Tem certeza que deseja excluir?")) return;
  await db.collection(col).doc(id).delete();
  toast("Excluído.");
}
</script>
