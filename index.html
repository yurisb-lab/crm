function renderChatHistory(){
  return chatHistory.map(m=>`
    <div class="chat-bubble ${m.role}">
      ${m.role==="ai" ? '<div class="ai-label">CRM Assistant</div>' : ""}
      ${escapeHtml(m.content).replace(/\n/g,"<br>")}
    </div>
  `).join("");
}

function usarSugestao(texto){
  const input = document.getElementById("chat-input");
  if(input){ input.value = texto; input.focus(); }
}

function chatKeyDown(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); enviarMensagemChat(); }
}

async function enviarMensagemChat(){
  const input = document.getElementById("chat-input");
  const texto = input ? input.value.trim() : "";
  if(!texto) return;
  if(input) input.value = "";

  // Trava o botão de envio enquanto a IA responde — mesmo padrão já usado em
  // outras ações da IA no app (briefing, resumo, variações). Sem isso, dava
  // pra clicar "Enviar" várias vezes seguidas e mandar a mesma mensagem
  // repetida enquanto a resposta anterior ainda não tinha voltado.
  const btnEnviar = document.querySelector(".chat-input-row button");
  if(btnEnviar){ btnEnviar.disabled = true; btnEnviar.textContent = "Enviando..."; }

  chatHistory.push({ role:"user", content:texto });

  const msgs = document.getElementById("chat-messages");
  if(msgs){
    msgs.innerHTML = renderChatHistory() + `<div class="chat-bubble ai thinking"><div class="ai-label">CRM Assistant</div>Pensando...</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }

  const contexto = getCrmContext();
  // envia as últimas 15 perguntas (30 mensagens) pra IA ter o contexto completo da conversa salva
  const historico = chatHistory.slice(-30).map(m=>`${m.role==="user"?"Yuri":"Assistente"}: ${m.content}`).join("\n");
  const prompt = `${contexto}

=== CONVERSA ===
${historico}

Além de responder à última mensagem de Yuri, identifique se ela contém informações novas que deveriam ser salvas no CRM (dados de cliente, dados de evento, preferências/observações, mudanças de data/valor/status/endereço, etc). NUNCA identifique ações sobre pagamentos — pagamentos são sempre lançados manualmente no sistema, nunca pela IA.

Responda APENAS um JSON válido, sem markdown, sem texto fora do JSON, exatamente neste formato:
{
  "resposta": "sua resposta em texto normal para a última mensagem de Yuri",
  "acoes": [
    {
      "colecao": "clientes ou eventos",
      "operacao": "criar ou atualizar",
      "nomeMencionado": "nome do cliente mencionado (obrigatório quando colecao=clientes)",
      "clienteMencionado": "nome do cliente responsável (obrigatório quando colecao=eventos, mesmo pra atualização de evento)",
      "tipo": "campo ou comentario",
      "campo": "obrigatório se tipo=campo. clientes: nome|telefone|cidade|origem|indicadoPor|nomeConjuge. eventos: tipo|data|horario|endereco|valorContratado|valorTabela|status|nomeEvento|tags|dataEntregaPrevista|dataEntregaReal",
      "valorNovo": "valor sugerido (datas em AAAA-MM-DD, valores monetários apenas número, sem R$)",
      "resumoHumano": "frase curta em português explicando a ação, pra Yuri confirmar"
    }
  ]
}
Regras importantes:
- Se a mensagem for só uma pergunta ou não tiver informação nova a salvar, retorne "acoes": [].
- Preferências, observações, elogios ou reclamações sobre alguém são sempre tipo:"comentario" na colecao "clientes" (nunca em "eventos").
- Se a mensagem tiver várias informações distintas, retorne uma ação para cada uma — todas aparecerão juntas numa única confirmação por cliente/evento.
- Nunca invente dados que não estejam explícitos na mensagem.`;

  const resultado = await callGemini(prompt, 0, GEMINI_MODEL_CHAT);

  let respostaTexto;
  if(resultado.texto){
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      const dados = JSON.parse(limpo);
      respostaTexto = dados.resposta || "Certo.";
      processarAcoesDetectadas(dados.acoes);
    }catch(err){
      console.error("[chat-ia] resposta não veio em JSON válido, mostrando texto cru:", err, resultado.texto);
      respostaTexto = resultado.texto;
    }
  } else {
    respostaTexto = `Erro: ${resultado.erro || "não foi possível processar."}`;
  }
  chatHistory.push({ role:"ai", content:respostaTexto });

  if(msgs){
    msgs.innerHTML = renderChatHistory();
    msgs.scrollTop = msgs.scrollHeight;
  }
  rerenderAcoesPendentesIA();
  if(btnEnviar){ btnEnviar.disabled = false; btnEnviar.textContent = "Enviar"; }

  salvarChatHistoricoRemoto();
}

async function gerarAniversariosBodasIA(tipo, id){
  let v, cliente;
  if(tipo==="crianca"){
    const c = state.criancas.find(x=>x.id===id);
    if(!c) return;
    cliente = state.clientes.find(x=>x.id===(c.clientePaiId||c.clienteMaeId));
    v = { tipo:"crianca", nome:c.nome, idade:idadeAtual(c.dataNascimento)+1, vinculo:cliente?.nome, observacoes:cliente?.observacoes||"" };
  } else {
    const c = state.casamentos.find(x=>x.id===id);
    if(!c) return;
    cliente = state.clientes.find(x=>x.id===c.clienteId);
    v = { tipo:"casamento", nome:c.nomeCasal, idade:idadeAtual(c.dataCasamento)+1, vinculo:cliente?.nome, observacoes:cliente?.observacoes||"" };
  }
  const btn = document.querySelector(`.aniv-item[data-key="${tipo}:${id}"]`);
  const container = document.getElementById("resultado-ia-container");
  if(!container) return;
  if(btn){ btn.disabled = true; }
  container.innerHTML = `<div class="ai-box">Gerando mensagens...</div>`;
  const resultado = await callGemini(SKILLS_IA.aniversarios_bodas.montarPrompt(v));
  if(btn){ btn.disabled = false; }
  if(!resultado.texto){
    container.innerHTML = `<div class="ai-box">Erro: ${escapeHtml(mensagemErroIA(resultado, "gerar as mensagens"))}</div>`;
    return;
  }
  const wa = cliente ? whatsappLink(cliente.telefone) : null;
  const versoes = resultado.texto.split(/\n(?=\d[\)\.])/).map(b=>b.replace(/^\d[\)\.]\s*/,"").trim()).filter(Boolean);
  window._aniversariosVersoes = versoes;
  container.innerHTML = versoes.map((texto,i)=>`
    <div class="ai-box" style="margin-bottom:8px;">
      <div class="ai-label">Versão ${i+1}</div>
      <div style="white-space:pre-wrap;">${escapeHtml(texto)}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="ghost sm" onclick="copiarVersaoAniversario(${i})">Copiar</button>

      </div>
    </div>
  `).join("");
}
function copiarVersaoAniversario(i){

function enviarVersaoAniversario(i, wa){

      </div>

function renderAgendaLista(){
  const hoje = new Date().toISOString().slice(0,10);

  // só eventos futuros (incluindo hoje)
  const porMes = {};
  state.eventos.filter(e=>e.data && e.data>=hoje).forEach(e=>{
    const chave = e.data.slice(0,7);
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"evento", item:e});
  });

  // bloqueios futuros (incluindo hoje)
  state.bloqueios.filter(b=>b.data && b.data>=hoje).forEach(b=>{
    const chave = b.data.slice(0,7);
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"bloqueio", item:b});
  });

  // pré-reservas futuras (incluindo hoje) — interessados avulsos e negociações com data definida
  state.prereservas.filter(p=>p.data && p.data>=hoje).forEach(p=>{
    const chave = p.data.slice(0,7);
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"prereserva", item:p});
  });

  // negociações com mês previsto (sem data exata ainda) e sem evento vinculado —
  // fica visível mesmo que o mês previsto já tenha passado, pra não perder o registro de que a consulta existe
  state.negociacoes.filter(n=>n.mesPrevisto && !n.eventoId && n.status!=="perdido" && (n.tipoData||"mes")!=="data").forEach(n=>{
    const chave = n.mesPrevisto;
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"negociacaoSemData", item:n});
  });

  const mesesOrdenados = Object.keys(porMes).sort();
  if(!mesesOrdenados.length) return `<div class="card"><div class="empty-state">Nenhum evento, bloqueio ou negociação sem data cadastrado.</div></div>`;

  return mesesOrdenados.map(chave=>{
    const [ano, mes] = chave.split("-");
    const titulo = `${MESES[Number(mes)-1]} ${ano}`;
    const isOpen = agendaListaExpandida.has(chave);
    const itens = porMes[chave].sort((a,b)=>{
      const keyOf = (x)=> x.tipo==="negociacaoSemData" ? "9999" : (x.item.data||"")+(x.item.horario||"");
      return keyOf(a).localeCompare(keyOf(b));
    });
    const evs = itens.filter(i=>i.tipo==="evento");

const agendaListaExpandida = new Set();

  const hoje = new Date();
  agendaListaExpandida.add(`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`);
  const prox = new Date(hoje.getFullYear(), hoje.getMonth()+1, 1);
  agendaListaExpandida.add(`${prox.getFullYear()}-${String(prox.getMonth()+1).padStart(2,"0")}`);
})();
function toggleAgendaMes(chave){
  if(agendaListaExpandida.has(chave)) agendaListaExpandida.delete(chave);
  else agendaListaExpandida.add(chave);
  renderPage("agenda");
}

function navCal(dir){
  calMes += dir;
  if(calMes>11){calMes=0;calAno++;}
  if(calMes<0){calMes=11;calAno--;}
  renderPage("agenda");
}
function renderGridCal(){
  const primeiroDia = new Date(calAno, calMes, 1).getDay();
  const ultimoDia = new Date(calAno, calMes+1, 0).getDate();
  const hoje = new Date().toISOString().slice(0,10);
  let cells = [];
  for(let i=0;i<primeiroDia;i++){
    const d = new Date(calAno, calMes, i-primeiroDia+1);
    cells.push(renderDiaCal(d,true));
  }
  for(let d=1;d<=ultimoDia;d++) cells.push(renderDiaCal(new Date(calAno,calMes,d),false));
  while(cells.length%7!==0) cells.push(renderDiaCal(new Date(calAno,calMes+1,cells.length-primeiroDia-ultimoDia+1),true));
  return cells.join("");
}
function isoFromDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function renderDiaCal(data, outromes){
  const iso = isoFromDate(data);
  const hoje = new Date().toISOString().slice(0,10);
  const evsDia = state.eventos.filter(e=>e.data===iso);
  const bloqDia = state.bloqueios.find(b=>b.data===iso);
  const preDia = state.prereservas.filter(p=>p.data===iso);
  const classes = ["cal-day", outromes?"other-month":"", iso===hoje?"today":"", bloqDia?"blocked":"", evsDia.length?"has-events":"", preDia.length?"prereservado":""].filter(Boolean).join(" ");
  return `<div class="${classes}" onclick="abrirDiaCal('${iso}')">
    <div class="cal-day-num">${data.getDate()}</div>
    <div class="cal-day-events">
      ${evsDia.slice(0,3).map(e=>`<div class="cal-ev ${corClasseTipo(e)}">${e.horario?e.horario.slice(0,5)+" ":""}${nomeEventoCurto(e)}</div>`).join("")}
      ${evsDia.length>3?`<div style="font-size:10px;color:var(--muted)">+${evsDia.length-3} mais</div>`:""}
      ${preDia.length && !evsDia.length ? (()=>{
        const temNeg = preDia.some(p=>p.negociacaoId);
        return `<div class="cal-ev" style="background:#eab308;color:#000;">${temNeg?"🤝":"🕓"} ${preDia.length} ${temNeg?"negociação":"interessado"}${preDia.length>1?"s":""}</div>`;
      })() : ""}
    </div>
    ${bloqDia?`<div style="font-size:9px;color:var(--muted-2);margin-top:2px;">${bloqDia.motivo||"Bloqueado"}</div>`:""}
  </div>`;
}
function corClasseTipo(e){
  return e.tipo||"outro";
}
function corHexTipo(tipo){ return {aniversario:"#f97316",batizado:"#06b6d4",casamento_civil:"#a855f7",casamento_religioso:"#a855f7",ensaio:"#3b82f6"}[tipo]||"#6b7280"; }
function nomeEventoCurto(e){
  if(e.nomeEvento) return e.nomeEvento.split(" ").slice(0,3).join(" ");
  const c = state.clientes.find(x=>x.id===e.clienteId);
  return c ? c.nome.split(" ")[0] : capitalize((e.tipo||"outro").replace("_"," "));
}
function calcDisponibilidade(iso){
  const bloq = state.bloqueios.find(b=>b.data===iso);
  if(bloq) return {label:"Bloqueada 🚫", cor:"#6b7280"};
  const evs = state.eventos.filter(e=>e.data===iso);
  if(!evs.length) return {label:"Livre ✓", cor:"#22c55e"};
  return {label:"Ocupada ●", cor:"#ef4444"};
}

function exportarBloqueioGCal(){
  const data = document.getElementById("bloq-data")?.value;
  const motivo = document.getElementById("bloq-motivo")?.value||"Bloqueio";
  const apenasHorario = document.getElementById("bloq-apenas-horario")?.checked;
  const horaInicio = document.getElementById("bloq-hora-inicio")?.value;
  const horaFim = document.getElementById("bloq-hora-fim")?.value;
  if(!data) return;
  const dataBase = data.replace(/-/g,"");
  let datas;
  if(apenasHorario && horaInicio && horaFim){
    datas = dataBase+"T"+horaInicio.replace(":","")+"00/"+dataBase+"T"+horaFim.replace(":","")+"00";
  } else {
    datas = dataBase+"/"+dataBase;
  }
  const params = new URLSearchParams({ action:"TEMPLATE", text:motivo, dates:datas, details:"Bloqueado no CRM Yuri Silva Fotografias" });
  window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, "_blank");
}

async function atualizarBloqueio(id){
  const data = document.getElementById("bloq-data")?.value;
  const motivo = document.getElementById("bloq-motivo")?.value.trim();
  const apenasHorario = document.getElementById("bloq-apenas-horario")?.checked;
  const horaInicio = document.getElementById("bloq-hora-inicio")?.value;
  const horaFim = document.getElementById("bloq-hora-fim")?.value;
  if(!data){ toast("Informe a data."); return; }
  try{
    await db.collection("bloqueios").doc(id).update({
      data, motivo:motivo||"", apenasHorario:apenasHorario||false,
      horario: apenasHorario ? {inicio:horaInicio||"",fim:horaFim||""} : null
    });

  const horaFim = document.getElementById("bloq-hora-fim")?.value;

/* ---------- Pré-reserva automática vinculada a uma negociação com "Data definida" ----------
   Regras: existe enquanto tipoData==="data" e a negociação não estiver perdida, e some
   assim que a negociação for perdida OU fechada com um evento já criado (o evento real
   já ocupa a data). Se voltar pra "Só o mês", também é removida. */
async function sincronizarPreReservaNegociacao(negId, neg){
  const deveExistir = neg.tipoData==="data" && !!neg.dataDefinida && neg.status!=="perdido" && !(neg.status==="fechado" && neg.eventoId);
  const existente = state.prereservas.find(p=>p.negociacaoId===negId);
  try{
    if(deveExistir){
      const cliente = state.clientes.find(c=>c.id===neg.clienteId);
      const payload = {
        data: neg.dataDefinida,
        leadId: "",
        nome: cliente ? (cliente.nomeConjuge ? `${cliente.nome} & ${cliente.nomeConjuge}` : cliente.nome) : "",
        telefone: cliente?.telefone || "",
        observacoes: `Negociação em andamento${neg.tipoInteresse ? " · "+capitalize(neg.tipoInteresse.replace("_"," ")) : ""}`,
        negociacaoId: negId
      };
      if(existente){
        await db.collection("prereservas").doc(existente.id).update(payload);
      } else {
        await db.collection("prereservas").add({ ...payload, criadoEm: new Date().toISOString() });
      }
    } else if(existente){
      await db.collection("prereservas").doc(existente.id).delete();
    }
  }catch(err){
    console.error("[prereserva-negociacao] erro ao sincronizar:", err);
  }
}

];
function etapaFunilNegociacao(n){ return n.etapaFunil || "contato"; }
function diasSemContatoNegociacao(n){
  const comentarios = n.comentarios||[];
  const ultimo = comentarios.length ? [...comentarios].sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""))[0].criadoEm : n.criadoEm;
  if(!ultimo) return null;
  return Math.floor((new Date()-new Date(ultimo))/86400000);
}
function negociacaoEmAtencao(n){
  const dias = diasSemContatoNegociacao(n);
  return typeof dias==="number" && dias>=4;
}
function negociacaoDataLabel(n){
  if(n.tipoData==="data" && n.dataDefinida) return formatDate(n.dataDefinida);
  if(n.mesPrevisto) return formatarMesAno(n.mesPrevisto);
  return "sem data";
}

}

function abrirBaixaRapidaProduto(produtoId){
  const p = state.produtos.find(x=>x.id===produtoId);
  if(!p) return;
  const saldo = (Number(p.valorVenda)||0) - totalPagoProduto(produtoId);
  formState = { _baixaProdutoId: produtoId, valor: saldo, data: new Date().toISOString().slice(0,10), forma: "pix", tipo: saldo===(Number(p.valorVenda)||0) ? "saldo" : "parcela" };

  document.getElementById("modal-content").innerHTML = `
    <h3>Dar baixa — ${p.produtoNome||"Produto"} · ${nomeRef("clientes",p.clienteId)}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Saldo pendente: ${money(saldo)}</div>
    <div class="field"><label>Valor recebido (R$)</label>
      <input type="number" value="${saldo}" oninput="formState.valor=this.value">
    </div>
    <div class="field"><label>Data</label>
      <input type="date" value="${formState.data}" oninput="formState.data=this.value">
    </div>
    <div class="field-row">
      <div class="field"><label>Forma de pagamento</label>
        <select onchange="formState.forma=this.value" style="width:100%">
          ${["pix","cartao","dinheiro","transferencia"].map(o=>`<option value="${o}" ${formState.forma===o?"selected":""}>${capitalize(o)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Tipo</label>
        <select onchange="formState.tipo=this.value" style="width:100%">
          ${["entrada","parcela","saldo"].map(o=>`<option value="${o}" ${formState.tipo===o?"selected":""}>${capitalize(o)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmarBaixaRapidaProduto()">Registrar pagamento</button>
    </div>
  `;
  document.getElementById("modal-backdrop").classList.add("active");
}

async function confirmarBaixaRapidaProduto(){
  const p = state.produtos.find(x=>x.id===formState._baixaProdutoId);
  if(!p) return;
  const valor = Number(formState.valor);
  if(!valor || valor<=0){ toast("Informe um valor válido."); return; }
  try{
    await db.collection("pagamentos").add({
      produtoId: p.id, clienteId: p.clienteId||"", valor,
      data: formState.data, forma: formState.forma, tipo: formState.tipo,
      criadoEm: new Date().toISOString()
    });
    toast("Pagamento registrado.");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao registrar o pagamento.");
  }
}

    ${viewRow("Etapa", `<span class="badge">${ETAPA_PRODUTO_LABEL[p.etapa||"encomendado"]}</span>`)}
    ${viewRow("Valor de custo", money(p.valorCusto))}

function renderRelatorios(main){
  const anoAtual = new Date().getFullYear();
  const anoStr = String(anoAtual);
  const todosOsTipos = ["aniversario","batizado","casamento_civil","casamento_religioso","ensaio","outro"];

  // ---------- Resumo do ano corrente ----------
  const eventosAno = state.eventos.filter(e=>(e.data||"").startsWith(anoStr));
  const pagamentosAno = state.pagamentos.filter(p=>(p.data||"").startsWith(anoStr));
  const recebidoAno = pagamentosAno.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const contratadoAno = eventosAno.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const pendenteAno = eventosAno.reduce((s,e)=>s+Math.max((Number(e.valorContratado)||0)-totalPago(e.id),0),0);
  const clientesNovosAno = state.clientes.filter(c=>(c.criadoEm||"").startsWith(anoStr)).length;
  const eventosEntreguesAno = eventosAno.filter(e=>e.status==="entregue").length;
  const eventosFechadosAno = eventosAno.filter(e=>(e.status||"confirmado")!=="perdido").length;
  const ticketMedioAno = eventosFechadosAno ? contratadoAno / eventosFechadosAno : 0;
  const tipoMaisComumAno = (()=>{
    const count = {};
    eventosAno.forEach(e=>{ count[e.tipo||"outro"]=(count[e.tipo||"outro"]||0)+1; });
    const top = Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
    return top ? capitalize(top[0].replace("_"," ")) : "—";

  const porTipo = todosOsTipos.map(t=>{
    const todosDoTipo = state.eventos.filter(e=>e.tipo===t);
    const comValor = todosDoTipo.filter(e=>Number(e.valorContratado)>0);
    const soma = comValor.reduce((s,e)=>s+Number(e.valorContratado),0);
    return { tipo:t, total: todosDoTipo.length, comValor: comValor.length, media: comValor.length ? soma/comValor.length : 0, soma };
  }).filter(x=>x.total>0);

  const origens = ["instagram","indicacao","google","igreja","outro"];
  const totalClientes = state.clientes.length;
  const semOrigem = state.clientes.filter(c=>!c.origem).length;
  const porOrigem = origens.map(o=>{

  const totalContratado = state.eventos.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const totalRecebido = state.pagamentos.reduce((s,p)=>s+(Number(p.valor)||0),0);

  const eventosComDesconto = state.eventos

    .filter(x=> x.desconto>0 && Number(x.e.valorTabela)>0);
  const totalDescontoDado = eventosComDesconto.reduce((s,x)=>s+x.desconto,0);
  const descontoPorTipo = todosOsTipos.map(t=>{
    const doTipo = eventosComDesconto.filter(x=>x.e.tipo===t);
    const soma = doTipo.reduce((s,x)=>s+x.desconto,0);
    return { tipo:t, n: doTipo.length, soma, media: doTipo.length ? soma/doTipo.length : 0 };

  // ---------- Taxa de retorno de clientes ----------

function parseValorConfig(raw){
  // aceita número puro (3000) ou string formatada BR ("3.000,00" / "3000,00")
  if(raw===undefined || raw===null || raw==="") return 0;
  if(typeof raw === "number") return raw;
  const limpo = String(raw).trim().replace(/\./g,"").replace(",",".");
  const n = parseFloat(limpo);
  return isNaN(n) ? 0 : n;
}
function renderCardMeta(){

/* =========================================================
   REATIVACAO DE CLIENTES
   ========================================================= */
function ultimoContatoCliente(clienteId){
  const cli = state.clientes.find(c=>c.id===clienteId);
  if(!cli || !Array.isArray(cli.historicoContatos) || !cli.historicoContatos.length) return null;
  return [...cli.historicoContatos].sort((a,b)=>(b.data||"").localeCompare(a.data||""))[0];
}

// valor total já gerado por um cliente (soma de todos os eventos) — usado pra priorizar quem reativar primeiro
function valorTotalCliente(clienteId){
  return state.eventos.filter(e=>e.clienteId===clienteId).reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
}

// "gancho" natural pra puxar assunto: aniversário de filho ou bodas de casamento nos próximos 60 dias
function proximoGanchoCliente(clienteId){
  const candidatos = [];
  state.criancas.filter(c=>c.clientePaiId===clienteId || c.clienteMaeId===clienteId).forEach(f=>{
    const dias = diasParaAniversario(f.dataNascimento);
    if(typeof dias==="number" && dias<=60){
      candidatos.push({ dias, texto:`🎂 ${f.nome} completa ${idadeAtual(f.dataNascimento)+1} anos em ${dias===0?"hoje":dias+" dias"}` });
    }
  });
  const casamento = state.casamentos.find(c=>c.clienteId===clienteId);
  if(casamento){
    const dias = diasParaAniversario(casamento.dataCasamento);
    if(typeof dias==="number" && dias<=60){
      candidatos.push({ dias, texto:`💍 Bodas de ${idadeAtual(casamento.dataCasamento)+1} anos em ${dias===0?"hoje":dias+" dias"}` });
    }
  }
  candidatos.sort((a,b)=>a.dias-b.dias);
  return candidatos[0] || null;
}

function clientesParaReativar(){
  const hoje = new Date().toISOString().slice(0,10);
  const limite12m = new Date(); limite12m.setMonth(limite12m.getMonth()-12);
  const limite12mStr = limite12m.toISOString().slice(0,10);
  const limite90d = new Date(); limite90d.setDate(limite90d.getDate()-90);
  const limite90dStr = limite90d.toISOString().slice(0,10);
  return state.clientes.filter(cli=>{
    if(cli.hibernado) return false; // hibernado manualmente — nunca aparece aqui
    if(alertaAdormecido(cli, "reativacao_cliente", hoje)) return false; // adiado manualmente pelo botão "Adiar"
    const temFuturo = state.eventos.some(e=>e.clienteId===cli.id && e.data>=hoje);
    if(temFuturo) return false;
    const uc = ultimoContatoCliente(cli.id);
    if(uc && uc.data >= limite90dStr) return false;
    const evs = state.eventos.filter(e=>e.clienteId===cli.id && e.data);
    if(!evs.length) return false;
    const ultimoEv = evs.sort((a,b)=>(b.data||"").localeCompare(a.data||""))[0];
    return ultimoEv.data <= limite12mStr;
  }).sort((a,b)=>{
    // prioriza quem já gerou mais receita; em empate, quem está há mais tempo sem contato primeiro
    const diffValor = valorTotalCliente(b.id) - valorTotalCliente(a.id);
    if(diffValor !== 0) return diffValor;
    const ua = ultimoContatoCliente(a.id);
    const ub = ultimoContatoCliente(b.id);
    if(!ua && !ub) return 0;
    if(!ua) return -1;
    if(!ub) return 1;
    return (ua.data||"").localeCompare(ub.data||"");
  });
}

function montarMensagensReativacaoDisponiveis(clienteId){

  const templates = (state.config.protocoloReativacao||[]).filter(t=>t && t.trim());
  return templates.map(t=> t.replaceAll("{nome}", cli?.nome||""));

function triggerContatoPrintUpload(clienteId){

async function processarContatoConversaTxt(clienteId, file){
  if(!file) return;
  toast("Lendo conversa...");
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let conversa = (e.target.result||"").replace(/^\uFEFF/,"").trim().slice(0,12000);
    if(!conversa){ toast("Arquivo vazio."); return; }
    toast("Analisando com IA...");
    const prompt = "Voce e assistente de um fotografo brasileiro. Leia essa conversa com um cliente e escreva em 2-3 linhas o que aconteceu nesse contato: o cliente demonstrou interesse? perguntou algo? ficou de pensar? respondeu frio? Seja direto e objetivo, sem copiar trechos.\n\nConversa:\n"+conversa;
    const resultado = await callGemini(prompt);
    if(!resultado.texto){ toast("Erro ao analisar."); return; }
    const obs = document.getElementById("contato-obs");
    if(obs) obs.value = resultado.texto.trim();
    toast("Resumo gerado. Confira e salve.");
  };
  reader.onerror=()=>toast("Erro ao ler o arquivo.");
  reader.readAsText(file,"utf-8");
}
async function processarContatoPrint(clienteId, file){
  if(!file) return;
  const t = document.getElementById("toast");
  if(t){ t.textContent="Analisando print..."; t.style.display="block"; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type||"image/png";
    const prompt = "Voce e assistente de um fotografo brasileiro. Analise esse print de conversa com um cliente e escreva em 2-3 linhas o que aconteceu nesse contato: o cliente demonstrou interesse? perguntou algo? ficou de pensar? respondeu frio? Seja direto e objetivo, sem copiar trechos.";
    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){ toast(mensagemErroIA(resultado,"analisar o print")); return; }
    const obs = document.getElementById("contato-obs");
    if(obs) obs.value = resultado.texto.trim();
    toast("Resumo gerado. Confira e salve.");
  };
  reader.onerror=()=>toast("Erro ao ler a imagem.");
  reader.readAsDataURL(file);
}
async function confirmarContatado(clienteId){
  const data = document.getElementById("contato-data")?.value;
  const observacao = document.getElementById("contato-obs")?.value.trim()||"";
  if(!data){ toast("Informe a data."); return; }
  const cli = state.clientes.find(c=>c.id===clienteId);
  if(!cli) return;
  const historico = Array.isArray(cli.historicoContatos) ? [...cli.historicoContatos] : [];
  historico.push({ data, observacao, criadoEm: new Date().toISOString() });
  try{
    await db.collection("clientes").doc(clienteId).update({ historicoContatos: historico });
    toast("Contato registrado.");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}
async function excluirRegistroContato(clienteId, criadoEm){
  if(!confirm("Excluir este registro de contato?")) return;
  const cli = state.clientes.find(c=>c.id===clienteId);
  if(!cli) return;
  const novos = (cli.historicoContatos||[]).filter(c=>c.criadoEm!==criadoEm);
  try{
    await db.collection("clientes").doc(clienteId).update({ historicoContatos: novos });
    toast("Registro excluido.");
    openView("clientes", clienteId);
  }catch(err){
    console.error(err);
    toast("Erro ao excluir.");
  }
}
function renderHistoricoContatos(cli){
  const historico = [...(cli.historicoContatos||[])].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const uc = ultimoContatoCliente(cli.id);
  let html = "<div class=\"view-section-title\" style=\"margin-top:18px;\">Contatos registrados"
    +(uc ? " <span style=\"font-size:11px; color:var(--muted-2); font-weight:400; margin-left:8px;\">ultimo: "+formatDate(uc.data)+"</span>" : "")
    +"</div>";
  if(historico.length){
    html += historico.map(c=>
      "<div class=\"comentario-item\">"
      +"<div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:8px;\">"
      +"<div style=\"flex:1; min-width:0;\">"
      +"<div class=\"comentario-data\">"+formatDate(c.data)+(c.criadoEm?" - registrado em "+formatarDataHora(c.criadoEm):"")+"</div>"
      +(c.observacao ? "<div class=\"comentario-texto\">"+escapeHtml(c.observacao)+"</div>" : "<div style=\"font-size:12px;color:var(--muted-2);\">Sem observacao</div>")
      +"</div>"
      +"<button class=\"ghost sm\" onclick=\"excluirRegistroContato('"+cli.id+"','"+c.criadoEm+"')\">x</button>"
      +"</div></div>"
    ).join("");
  } else {
    html += "<div style=\"font-size:13px;color:var(--muted-2);\">Nenhum contato registrado ainda.</div>";
  }
  html += "<div style=\"margin-top:10px;\"><button class=\"ghost sm\" onclick=\"abrirMarcarContatado('"+cli.id+"')\">+ Registrar contato</button></div>";
  return html;
}

/* =========================================================
   AVISO DE EVENTO PRÓXIMO (hoje / amanhã)
   Banner fixo no topo do Dashboard, visível por ~24h antes do
   evento e durante todo o dia do evento. Some sozinho no dia
   seguinte, pois passa a não bater mais com "hoje" nem "amanhã".
   O botão "Preparado" só esconde aquele card específico (guardado
   no localStorage do aparelho — não é dado do negócio, é só uma
   preferência de tela, por isso não vai pro Firestore).
   ========================================================= */
function avisoEventoDispensado(eventoId, dataEvento){
  return localStorage.getItem(`aviso-evento-dispensado-${eventoId}-${dataEvento}`) === "1";
}
function dispensarAvisoEvento(eventoId, dataEvento){
  localStorage.setItem(`aviso-evento-dispensado-${eventoId}-${dataEvento}`, "1");
  renderPage("dashboard");
}
function desdispensarAvisoEvento(eventoId, dataEvento){
  localStorage.removeItem(`aviso-evento-dispensado-${eventoId}-${dataEvento}`);
  renderPage("dashboard");
}
function renderCardAvisoEvento(e, quando, emoji, urgente){
  const cli = nomeRef("clientes", e.clienteId);
  const tipoLabel = e.tipo==="outro" && e.outroDescricao ? e.outroDescricao : capitalize((e.tipo||"outro").replace("_"," "));
  const enderecoHtml = e.endereco
    ? `<a href="#" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.endereco)}','_blank');return false;" style="color:inherit; text-decoration:underline; text-decoration-style:dotted;">📍 ${e.endereco}</a>`
    : "";
  const detalhes = [tipoLabel, cli, e.horario?("🕓 "+e.horario):"", enderecoHtml].filter(Boolean).join(" · ");
  const preparado = avisoEventoDispensado(e.id, e.data);
  return `
    <div class="aviso-evento-card ${urgente?"urgente":""}" style="${preparado?"opacity:.55;":""}">
      <div>
        <div class="aviso-evento-titulo">${emoji} Você tem evento ${quando}! ${preparado ? "✓ Já marcado como concluído" : "Tudo concluído?"}</div>
        <div class="aviso-evento-detalhe">${detalhes}</div>
      </div>
      <div class="aviso-evento-acoes">
        <button class="sm" onclick="openView('eventos','${e.id}')">Ver evento</button>
        <button class="sm ghost" onclick="${preparado ? `desdispensarAvisoEvento('${e.id}','${e.data}')` : `abrirConfirmacaoConcluido('${e.id}','${e.data}')`}">${preparado ? "↩ Desmarcar" : "✓ Concluído"}</button>
      </div>
    </div>`;
}

function abrirConfirmacaoConcluido(eventoId, dataEvento){
  document.getElementById("modal-content").innerHTML = `
    <h3>Marcar evento como concluído</h3>
    <div style="font-size:13px; color:var(--muted); margin-bottom:16px;">Isso só esconde o aviso deste evento no Dashboard — não altera o status do evento em si.</div>
    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="confirm-concluido-check" style="width:18px; height:18px;">

    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmarConcluido('${eventoId}','${dataEvento}')">Confirmar</button>

function confirmarConcluido(eventoId, dataEvento){
  const check = document.getElementById("confirm-concluido-check");

}
function renderAvisosEventoProximo(){
  const hojeStr = new Date().toISOString().slice(0,10);
  const amanhaDate = new Date(); amanhaDate.setDate(amanhaDate.getDate()+1);
  const amanhaStr = amanhaDate.toISOString().slice(0,10);

  const naoCancelado = e => (e.status||"confirmado") !== "cancelado";
  const eventosHoje = state.eventos.filter(e=>e.data===hojeStr && naoCancelado(e));
  const eventosAmanha = state.eventos.filter(e=>e.data===amanhaStr && naoCancelado(e));

  if(!eventosHoje.length && !eventosAmanha.length) return "";

  const html = [
    ...eventosHoje.map(e=>renderCardAvisoEvento(e, "hoje", "🔴", true)),
    ...eventosAmanha.map(e=>renderCardAvisoEvento(e, "amanhã", "🟡", false))
  ].join("");

  return `<div class="avisos-evento-wrap">${html}</div>`;
}

            <input type="checkbox" id="export-col-${c.key}" ${cfg.colunas.has(c.key)?"checked":""}
              onchange="this.checked ? exportEventosConfig.colunas.add('${c.key}') : exportEventosConfig.colunas.delete('${c.key}')"
              style="width:16px; height:16px;">
            <label for="export-col-${c.key}" style="margin:0; font-size:13px;">${c.label}</label>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="gerarPdfEventos()">Gerar PDF</button>

  `;

function gerarPdfEventos(){
  const cfg = exportEventosConfig;
  const colunas = EXPORT_EVENTOS_CAMPOS.filter(c=>cfg.colunas.has(c.key));
  if(!colunas.length){ toast("Selecione ao menos uma coluna."); return; }
  if(!window.jspdf){ toast("Não foi possível carregar o gerador de PDF. Verifique sua conexão."); return; }

  let items = [...state.eventos];
  if(cfg.filtroAno) items = items.filter(e=>(e.data||"").startsWith(cfg.filtroAno));
  if(cfg.filtroStatus) items = items.filter(e=>(e.status||"confirmado")===cfg.filtroStatus);
  if(!items.length){ toast("Nenhum evento encontrado com esses filtros."); return; }

  const ordenacao = EXPORT_EVENTOS_ORDENACAO.find(o=>o.key===cfg.ordenarPor) || EXPORT_EVENTOS_ORDENACAO[0];
  items.sort((a,b)=> compararValores(ordenacao.value(a), ordenacao.value(b)) * cfg.direcao);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: colunas.length>5 ? "landscape" : "portrait", unit:"pt" });

  const subtitulo = [
    cfg.filtroAno ? `Ano: ${cfg.filtroAno}` : "Todos os anos",
    cfg.filtroStatus ? `Status: ${statusLabel(cfg.filtroStatus)}` : null,
    `Ordenado por ${ordenacao.label.toLowerCase()} (${cfg.direcao===1?"crescente":"decrescente"})`,
    `Gerado em ${formatDate(new Date().toISOString().slice(0,10))}`
  ].filter(Boolean).join("  ·  ");

  doc.setFontSize(16);
  doc.text("Lista de eventos", 40, 40);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(subtitulo, 40, 58);

  doc.autoTable({
    startY: 72,
    head: [colunas.map(c=>c.label)],
    body: items.map(e=> colunas.map(c=> String(c.get(e)))),
    styles: { fontSize: 8, cellPadding: 5 },
    headStyles: { fillColor: [201,138,63] },
    margin: { left: 40, right: 40 }
  });

  doc.save(`eventos-${new Date().toISOString().slice(0,10)}.pdf`);
  toast("PDF gerado.");
  closeModal();
}

/* =========================================================
   FINANCEIRO — RELATÓRIO DO MÊS (destaque) + AVALIAÇÃO COM IA
   ========================================================= */
function statsFinanceiroMes(anoMes){
  const eventosMes = state.eventos.filter(e=>(e.data||"").startsWith(anoMes));
  const pagamentosMes = state.pagamentos.filter(p=>(p.data||"").startsWith(anoMes));
  const recebido = pagamentosMes.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const contratado = eventosMes.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const pendente = eventosMes.reduce((s,e)=>s+Math.max((Number(e.valorContratado)||0)-totalPago(e.id),0),0);
  return {
    anoMes, eventos: eventosMes.length, recebido, contratado, pendente,
    ticketMedio: eventosMes.length ? contratado/eventosMes.length : 0,
  };
}
function refMes(offsetMeses){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+offsetMeses);
  return { chave: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, mes: d.getMonth(), ano: d.getFullYear() };
}

function analiseFinanceiraSalva(anoMes){

}

function renderAvaliacaoMesIA(ref, stats, meta, pct){
  const bateuMeta = meta ? stats.recebido >= meta : null;
  const salva = analiseFinanceiraSalva(ref.chave);
  return `

                : `${MESES[ref.mes]} ficou ${money(meta-stats.recebido)} abaixo da meta (${pct}%). Peça pra IA uma análise dos possíveis motivos e ideias práticas pra melhorar.`)

async function salvarComentarioAvaliacaoMes(anoMes){
  const input = document.getElementById(`novo-comentario-avaliacao-${anoMes}`);
  const texto = input ? input.value.trim() : "";
  if(!texto){ toast("Escreva algo antes de salvar."); return; }
  const existente = state.config?.avaliacoesFinanceiras?.[anoMes] || {};
  const novos = [...(existente.comentarios||[]), { texto, criadoEm: new Date().toISOString() }];
  try{
    await db.collection("config").doc("settings").set({
      avaliacoesFinanceiras: { ...(state.config?.avaliacoesFinanceiras||{}), [anoMes]: { ...existente, comentarios: novos } }
    }, { merge:true });
    toast("Comentário salvo.");
  }catch(err){ console.error(err); toast("Erro ao salvar comentário."); }

async function excluirComentarioAvaliacaoMes(anoMes, criadoEm){
  const existente = state.config?.avaliacoesFinanceiras?.[anoMes] || {};
  const novos = (existente.comentarios||[]).filter(c=>c.criadoEm!==criadoEm);
  try{

      avaliacoesFinanceiras: { ...(state.config?.avaliacoesFinanceiras||{}), [anoMes]: { ...existente, comentarios: novos } }
    }, { merge:true });
    toast("Comentário excluído.");

async function avaliarMesComIA(anoMes){
  const btn = document.getElementById("btn-avaliar-mes");
  const box = document.getElementById("ai-avaliacao-mes");
  if(!box) return;
  if(!temIA()){ toast("Configure a chave Gemini em Configurações para usar a IA."); return; }
  if(btn){ btn.disabled = true; btn.textContent = "Analisando..."; }
  box.style.display = "block";
  box.innerHTML = `<div class="ai-label">Analisando o mês...</div>`;

  const meta = parseValorConfig(state.config?.metaMensal);
  const [ano, mes] = anoMes.split("-");
  const nomeMes = `${MESES[Number(mes)-1]} de ${ano}`;

  const eventosMes = state.eventos.filter(e=>(e.data||"").startsWith(anoMes));
  const recebido = state.pagamentos.filter(p=>(p.data||"").startsWith(anoMes)).reduce((s,p)=>s+(Number(p.valor)||0),0);
  const contratado = eventosMes.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);

  // recebido dos últimos 6 meses (até o mês avaliado), pra IA enxergar a tendência
  const tendencia = [];
  for(let i=5;i>=0;i--){
    const d = new Date(Number(ano), Number(mes)-1-i, 1);
    const chave = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const v = state.pagamentos.filter(p=>(p.data||"").startsWith(chave)).reduce((s,p)=>s+(Number(p.valor)||0),0);
    tendencia.push(`${MESES[d.getMonth()]}/${d.getFullYear()}: ${money(v)}`);
  }

  const eventosCtx = eventosMes.map(e=>
    `${capitalize((e.tipo||"outro").replace("_"," "))} · ${formatDate(e.data)} · status:${statusLabel(e.status||"confirmado")} · valor:${money(e.valorContratado)} · cliente:${nomeRef("clientes",e.clienteId)}`
  ).join("\n");

  const motivosPerdaMes = {};
  state.leads.filter(l=>l.status==="perdido").forEach(l=>{
    const chave = l.motivoPerda || "não informado";
    motivosPerdaMes[chave] = (motivosPerdaMes[chave]||0)+1;
  });
  const motivosLabel = {outro_fotografo:"Fechou com outro fotógrafo", achou_caro:"Achou caro", cancelou_festa:"Cancelou a festa", nao_respondeu:"Não respondeu", outro:"Outro motivo", "não informado":"Não informado"};
  const motivosCtx = Object.entries(motivosPerdaMes).map(([m,n])=>`${motivosLabel[m]||m}: ${n}`).join(", ");

  const prompt = `Você é um consultor de negócios especializado em fotografia de eventos sociais, ajudando o fotógrafo Yuri Silva (Yuri Silva Fotografias, Pacatuba/CE, Brasil) a entender o resultado financeiro do mês.

MÊS AVALIADO: ${nomeMes}
META MENSAL: ${meta ? money(meta) : "não definida"}
RECEBIDO NO MÊS: ${money(recebido)}
CONTRATADO (novos eventos fechados no mês): ${money(contratado)}
RESULTADO: ${meta ? (recebido>=meta ? `bateu a meta (excedente de ${money(recebido-meta)})` : `NÃO bateu a meta — faltaram ${money(meta-recebido)}`) : "sem meta definida"}

EVENTOS DO MÊS (${eventosMes.length}):
${eventosCtx || "Nenhum evento neste mês."}

TENDÊNCIA DE RECEBIMENTO DOS ÚLTIMOS 6 MESES:
${tendencia.join("\n")}

MOTIVOS DE PERDA DE LEADS NO HISTÓRICO GERAL (${state.leads.filter(l=>l.status==="perdido").length} leads perdidos): ${motivosCtx || "nenhum registrado"}

Escreva uma análise curta e direta (6 a 8 linhas) sobre prováveis motivos do resultado do mês (bom ou ruim) com base nos dados acima. Depois liste de 3 a 5 sugestões práticas e específicas — nada genérico — pra melhorar o faturamento nos próximos meses (pense em ações reais pra um fotógrafo de eventos sociais: reativação de clientes parados, promoções pontuais, upsell de produtos/álbuns, sazonalidade, follow-up de leads parados, etc). Linguagem direta e informal, sem enrolação, sem markdown.`;

  const resultado = await callGemini(prompt);
  if(resultado.texto){
    box.innerHTML = `<div class="ai-label">📊 Avaliação de ${nomeMes}</div>${escapeHtml(resultado.texto).replace(/\n/g,"<br>")}`;
    const existente = state.config?.avaliacoesFinanceiras?.[anoMes] || {};
    try{
      await db.collection("config").doc("settings").set({
        avaliacoesFinanceiras: {
          ...(state.config?.avaliacoesFinanceiras||{}),
          [anoMes]: { texto: resultado.texto, criadoEm: new Date().toISOString(), comentarios: existente.comentarios||[] }
        }
      }, { merge:true });
    }catch(err){
      console.error(err);
      toast("Avaliação gerada, mas houve erro ao salvar. Veja o console.");
    }
  } else {
    box.innerHTML = `<div class="ai-label">Erro</div>${mensagemErroIA(resultado, "avaliar o mês")}`;
  }

  if(btn){ btn.disabled = false; btn.textContent = "✦ Avaliar o mês com IA"; }
}

/* ---- FATURAMENTO POR MÊS (pilhas por ano) ---- */
const fatExpandido = new Set([String(new Date().getFullYear())]);

function renderFaturamentoPorMes(){
  const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const mesesMap = {};
  state.eventos.forEach(e=>{
    if(!e.data) return;
    const chave = e.data.slice(0,7);
    if(!mesesMap[chave]) mesesMap[chave] = {eventos:0, contratado:0, recebido:0};
    mesesMap[chave].eventos++;
    mesesMap[chave].contratado += Number(e.valorContratado)||0;
  });
  state.pagamentos.forEach(p=>{
    if(!p.data) return;
    const chave = p.data.slice(0,7);
    if(!mesesMap[chave]) mesesMap[chave] = {eventos:0, contratado:0, recebido:0};
    mesesMap[chave].recebido += Number(p.valor)||0;
  });

  const anosMap = {};
  Object.entries(mesesMap).forEach(([chave, dados])=>{
    const ano = chave.slice(0,4);
    if(!anosMap[ano]) anosMap[ano] = {};
    anosMap[ano][chave] = dados;
  });
  const anos = Object.keys(anosMap).sort().reverse();

  return `
    ${anos.map(ano=>{
      const isOpen = fatExpandido.has(ano);
      const meses = Object.keys(anosMap[ano]).sort().reverse();
      const totalAno = meses.reduce((s,m)=>s+(anosMap[ano][m].recebido||0),0);
      return `
        <div class="card" style="padding:0; margin-bottom:10px; overflow:hidden;">
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 18px; cursor:pointer;"
               onclick="fatExpandido.has('${ano}')?fatExpandido.delete('${ano}'):fatExpandido.add('${ano}'); renderPage('pagamentos')">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-family:'Fraunces',serif; font-size:17px;">${isOpen?"▾":"▸"} ${ano}</span>
              <span style="font-size:12px; color:var(--muted);">Recebido: ${money(totalAno)}</span>
            </div>
            <span style="font-size:12px; color:var(--muted-2);">${isOpen?"recolher":"expandir"}</span>
          </div>
          ${isOpen ? `
            <div style="border-top:1px solid var(--border-solid); overflow-x:auto;">
              <table><thead><tr><th>Mês</th><th>Eventos</th><th>Contratado</th><th>Recebido</th><th>Ticket médio</th><th>Vs. ano ant.</th></tr></thead><tbody>
                ${meses.map(chave=>{
                  const [y,m] = chave.split("-");
                  const d = anosMap[ano][chave];
                  const ticket = d.eventos ? d.contratado/d.eventos : 0;
                  const chaveAnt = `${Number(y)-1}-${m}`;
                  const ant = mesesMap[chaveAnt];
                  let vs = "—";
                  if(ant && ant.contratado>0){
                    const v = ((d.contratado-ant.contratado)/ant.contratado)*100;
                    vs = `${v>=0?"+":""}${v.toFixed(0)}%`;
                  }
                  return `<tr>
                    <td>${nomesMes[Number(m)-1]}</td>
                    <td>${d.eventos}</td>
                    <td>${money(d.contratado)}</td>
                    <td>${money(d.recebido)}</td>
                    <td>${money(ticket)}</td>
                    <td>${vs}</td>
                  </tr>`;
                }).join("")}
              </tbody></table>
            </div>
          ` : ""}
        </div>
      `;
    }).join("")}
  `;
}

function renderCollectionList(col){
  const container = document.getElementById(`collection-list-${col}`);

  const termo = (collectionSearch[col]||"").trim().toLowerCase();

  let items = [...state[col]];
  if(col==="clientes") items = items.filter(c=>!c.hibernado); // some da lista principal — vive na pilha separada

    items = items.filter(item => Object.values(item).some(v=>{
      if(v==null) return false;
      if(Array.isArray(v)) return v.join(" ").toLowerCase().includes(termo);
      return String(v).toLowerCase().includes(termo);
    }));
  }
  const sortState = collectionSort[col] || { key: schema.columns[0].key, dir: 1 };
  const colOrdenada = schema.columns.find(c=>c.key===sortState.key);
  items.sort((a,b)=>{
    const va = colOrdenada?.sortValue ? colOrdenada.sortValue(a) : (a[sortState.key] ?? "");
    const vb = colOrdenada?.sortValue ? colOrdenada.sortValue(b) : (b[sortState.key] ?? "");
    return compararValores(va, vb) * sortState.dir;
  });

  container.innerHTML = `
    <div class="card" style="padding:0; overflow-x:auto;">
      ${items.length ? `
      <table>
        <thead><tr>${schema.columns.map(c=>{
          const ativa = sortState.key===c.key;
          const seta = ativa ? (sortState.dir===1?" ▲":" ▼") : "";
          return `<th style="cursor:pointer; user-select:none;" onclick="toggleOrdenacaoColuna('${col}','${c.key}')" title="Ordenar por ${c.label}">${c.label}${seta}</th>`;
        }).join("")}<th></th></tr></thead>
        <tbody>
          ${items.map(item=>`
            <tr>
              ${schema.columns.map(c=>`<td>${c.format ? c.format(item[c.key],item) : (item[c.key] ?? "—")}</td>`).join("")}

                <button class="sm" onclick="openForm('${col}','${item.id}')">Editar</button>

/* =========================================================
   GOOGLE CALENDAR
   ========================================================= */
function buildGCalUrl(ev){
  const titulo = ev.nomeEvento || capitalize((ev.tipo||"evento").replace("_"," ")) + " — " + nomeRef("clientes",ev.clienteId);
  const dataBase = (ev.data||"").replace(/-/g,"");
  let datas;
  if(ev.horario){
    const [h,m] = ev.horario.split(":");
    const inicio = dataBase+"T"+h.padStart(2,"0")+(m||"00").padStart(2,"0")+"00";
    const horaFim = String(Number(h)+2).padStart(2,"0");
    const fim = dataBase+"T"+horaFim+(m||"00").padStart(2,"0")+"00";
    datas = inicio+"/"+fim;
  } else {
    datas = dataBase+"/"+dataBase;
  }
  const descricao = `Cliente: ${nomeRef("clientes",ev.clienteId)}\nValor: ${money(ev.valorContratado)}\nSaldo: ${money(Math.max(0,(Number(ev.valorContratado)||0)-totalPago(ev.id)))}`;
  const params = new URLSearchParams({
    action:"TEMPLATE", text:titulo, dates:datas,
    details:descricao, location:ev.endereco||""
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function gerarMsgConfirmacao(ev){
  const cliente = state.clientes.find(c=>c.id===ev.clienteId);
  const nomeCliente = cliente ? cliente.nome : "Cliente";
  const saldo = (Number(ev.valorContratado)||0) - totalPago(ev.id);
  const pago = totalPago(ev.id);
  const tipo = ev.tipo||"outro";
  const emojis = {aniversario:"🎂",batizado:"✝️",casamento_civil:"💍",casamento_religioso:"⛪",ensaio:"📸",outro:"📸"};
  const prefixos = {
    aniversario:`${emojis.aniversario} Festinha de aniversário${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    batizado:`${emojis.batizado} Batizado${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    casamento_civil:`${emojis.casamento_civil} Casamento Civil${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    casamento_religioso:`${emojis.casamento_religioso} Casamento Religioso${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    ensaio:`${emojis.ensaio} Ensaio fotográfico${ev.nomeEvento?" — "+ev.nomeEvento:""}`,
    outro:`📸 ${ev.nomeEvento||"Evento"}`
  };
  const linhas = [
    prefixos[tipo]||prefixos.outro,
    tipo==="aniversario"||tipo==="batizado" ? `${tipo==="aniversario"?"🎉":"✨"} ${nomeCliente}` : `${emojis[tipo]||"📸"} ${nomeCliente}`,
    `📅 Data: ${formatDate(ev.data)}`,
    ev.horario ? `🕓 Horário: ${ev.horario}h` : null,
    ev.endereco ? `📍 Endereço: ${ev.endereco}` : null,
    pago>0 ? `💰 Sinal recebido: ${money(pago)}` : null,
    saldo>0 ? `💵 Restante: ${money(saldo)} no dia do evento.` : "✅ Pagamento quitado.",
    "",
    "Nos vemos em breve! 🙂"
  ].filter(l=>l!==null);
  return linhas.join("\n");
}
function copiarMsgConfirmacao(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);

  const msg = gerarMsgConfirmacao(ev);

async function proximoNumeroRecibo(){
  const ano = new Date().getFullYear();
  const deste = state.recibos.filter(r=>r.numero?.startsWith(String(ano)+"-"));
  if(!deste.length) return `${ano}-100`;
  const numeros = deste.map(r=>Number(r.numero?.split("-")[1]||0));
  return `${ano}-${Math.max(...numeros)+1}`;
}

async function confirmarGerarRecibo(eventoId){
  const numero = document.getElementById("recibo-num")?.value.trim();
  const forma = document.getElementById("recibo-forma")?.value;
  const valorTipo = document.getElementById("recibo-valor-tipo")?.value;
  if(!numero){toast("Informe o número do recibo.");return;}
  // verifica duplicata
  const existe = state.recibos.find(r=>r.numero===numero && r.eventoId!==eventoId);
  if(existe){toast(`Já existe um recibo com o número ${numero}. Altere antes de continuar.`);return;}
  const ev = state.eventos.find(e=>e.id===eventoId);
  const pago = totalPago(eventoId);
  const saldo = (Number(ev.valorContratado)||0) - pago;
  const valorRecibo = valorTipo==="total" ? Number(ev.valorContratado)||0 : pago;
  // salva ou atualiza o recibo no Firestore
  const reciboExistente = state.recibos.find(r=>r.eventoId===eventoId);
  const dadosRecibo = { eventoId, clienteId:ev.clienteId||"", numero, forma, valor:valorRecibo, quitado:saldo<=0, criadoEm:new Date().toISOString() };
  if(reciboExistente){
    await db.collection("recibos").doc(reciboExistente.id).update(dadosRecibo);
  } else {
    await db.collection("recibos").add(dadosRecibo);
  }
  const recibo = { ...dadosRecibo, id: reciboExistente?.id||"" };
  exibirRecibo(ev, recibo);
}

/* =========================================================
   LEITURA DE FOTO DA FESTA (IA)
   ========================================================= */
// lê a data real gravada pela câmera no momento da foto (metadado EXIF),
// muito mais confiável do que pedir pra IA "adivinhar" a data olhando a imagem.
// retorna "AAAA-MM-DD" ou null se a foto não tiver esse metadado (ex: print de tela, foto sem EXIF).
async function extrairDataExif(file){
  if(typeof exifr === "undefined"){
    console.warn("[exif] lib exifr não carregou (CDN indisponível?). Seguindo sem data do EXIF.");
    return null;
  }
  try{
    const dados = await exifr.parse(file, { pick:["DateTimeOriginal","CreateDate"] });
    const dt = dados?.DateTimeOriginal || dados?.CreateDate;
    if(!dt) return null;
    const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,"0"), d = String(dt.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }catch(err){
    console.warn("[exif] não foi possível ler metadados da foto:", err);
    return null;
  }
}

/* =========================================================
   CRIAR EVENTOS EM LOTE A PARTIR DE VÁRIAS FOTOS
   Só usa o EXIF (sem IA): lê a data real da câmera de cada foto,
   agrupa por data (fotos do mesmo dia = candidatas ao mesmo evento)
   e apresenta um card de revisão por grupo — nada é salvo sem
   confirmação explícita, e nenhuma foto é enviada ao Firestore.
   ========================================================= */
let loteFotosGrupos = [];
let _loteGrupoIdSeq = 1;

function triggerLoteFotosUpload(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.multiple = true;
  input.onchange = (e)=> processarFotosLote(Array.from(e.target.files||[]));
  input.click();
}

async function processarFotosLote(files){
  if(!files.length) return;
  toast(`📸 Lendo metadados de ${files.length} foto${files.length===1?"":"s"}...`, 4000);

  const porData = {}; // "AAAA-MM-DD" (ou "sem-data") -> quantidade de fotos
  for(const file of files){
    const dataExif = await extrairDataExif(file);
    const chave = dataExif || "sem-data";
    porData[chave] = (porData[chave]||0) + 1;
  }

  const chaves = Object.keys(porData).sort((a,b)=>{
    if(a==="sem-data") return 1;
    if(b==="sem-data") return -1;
    return a.localeCompare(b);
  });

  loteFotosGrupos = chaves.map(chave=>({
    id: "loteGrupo"+(_loteGrupoIdSeq++),
    data: chave==="sem-data" ? "" : chave,
    qtdFotos: porData[chave],
    tipo: "",
    clienteId: "",
    _quickNovoCliente: {}
  }));

  abrirModalLoteFotos();
}

      Agrupei as fotos por data (metadado EXIF da câmera — fotos do mesmo dia caem no mesmo grupo). Confira o tipo e o cliente de cada grupo antes de criar os eventos. Nenhuma foto é enviada ou salva — só a data é usada.

}

}

function renderGrupoLoteFoto(grupo){
  const todosOsTipos = ["aniversario","batizado","casamento_civil","casamento_religioso","ensaio","outro"];
  const clientesOrdenados = [...state.clientes].sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
  const isNovoCliente = grupo.clienteId === "__new__";
  return `
    <div class="card" style="margin-bottom:10px; padding:14px 16px;">
      <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">
        📷 ${grupo.qtdFotos} foto${grupo.qtdFotos===1?"":"s"} ${grupo.data ? "· mesmo dia" : "· sem data no EXIF (preencha manualmente)"}
      </div>
      <div class="field-row">
        <div class="field"><label>Data</label>
          <input type="date" value="${grupo.data}" onchange="onLoteGrupoCampo('${grupo.id}','data',this.value)">
        </div>
        <div class="field"><label>Tipo</label>
          <select onchange="onLoteGrupoCampo('${grupo.id}','tipo',this.value)">

          </select>
        </div>
      </div>
      <div class="field">
        <label>Cliente</label>
        <select onchange="onLoteGrupoCliente('${grupo.id}',this.value)">
          <option value="">—</option>
          <option value="__new__" ${isNovoCliente?"selected":""}>+ Cadastrar novo cliente</option>
          ${clientesOrdenados.map(c=>`<option value="${c.id}" ${grupo.clienteId===c.id?"selected":""}>${c.nomeConjuge ? c.nome+" & "+c.nomeConjuge : c.nome}</option>`).join("")}
        </select>
      </div>
      ${isNovoCliente ? `
        <div class="field"><label>Nome do novo cliente</label>
          <input type="text" value="${grupo._quickNovoCliente?.nome||""}" oninput="onLoteGrupoNovoClienteCampo('${grupo.id}','nome',this.value)">
        </div>
        <div class="field"><label>Telefone (opcional)</label>
          <input type="tel" value="${grupo._quickNovoCliente?.telefone||""}" oninput="onLoteGrupoNovoClienteCampo('${grupo.id}','telefone',this.value)">
        </div>
      ` : ""}
      <div class="modal-actions" style="border-top:1px solid var(--border); margin-top:12px; padding-top:12px;">
        <button class="ghost sm" onclick="removerGrupoLote('${grupo.id}')">Ignorar este grupo</button>
        <button class="primary sm" onclick="criarEventoDoGrupoLote('${grupo.id}')">Criar este evento</button>
      </div>
    </div>
  `;
}

function onLoteGrupoCampo(id, campo, valor){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(g) g[campo] = valor;
}
function onLoteGrupoCliente(id, clienteId){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(!g) return;
  g.clienteId = clienteId;
  if(clienteId==="__new__" && !g._quickNovoCliente) g._quickNovoCliente = {};
  rerenderListaLote();
}
function onLoteGrupoNovoClienteCampo(id, campo, valor){
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(g){ g._quickNovoCliente = g._quickNovoCliente||{}; g._quickNovoCliente[campo] = valor; }
}
function rerenderListaLote(){
  const container = document.getElementById("lote-fotos-lista");
  if(container) container.innerHTML = renderListaGruposLote();
}
function removerGrupoLote(id){
  loteFotosGrupos = loteFotosGrupos.filter(g=>g.id!==id);
  rerenderListaLote();
  if(!loteFotosGrupos.length) toast("Nenhum grupo restante.");
}

async function criarEventoDoGrupoLote(id, opcoes={}){
  const { silencioso=false } = opcoes;
  const g = loteFotosGrupos.find(x=>x.id===id);
  if(!g) return false;
  if(!g.data){ if(!silencioso) toast("Informe a data deste grupo."); return false; }
  if(!g.tipo){ if(!silencioso) toast("Selecione o tipo de evento deste grupo."); return false; }
  if(!g.clienteId){ if(!silencioso) toast("Selecione o cliente deste grupo."); return false; }
  if(g.clienteId==="__new__" && !g._quickNovoCliente?.nome){ if(!silencioso) toast("Informe o nome do novo cliente."); return false; }

  try{
    let clienteId = g.clienteId;
    if(clienteId==="__new__"){
      const ref = await db.collection("clientes").add({
        nome: g._quickNovoCliente.nome,
        telefone: g._quickNovoCliente.telefone||"",
        criadoEm: new Date().toISOString()
      });
      clienteId = ref.id;
    }
    await db.collection("eventos").add({
      tipo: g.tipo, data: g.data, clienteId, status:"confirmado",
      fotoLida: true, criadoEm: new Date().toISOString()
    });
    loteFotosGrupos = loteFotosGrupos.filter(x=>x.id!==id);
    if(!silencioso){
      toast("Evento criado.");
      if(loteFotosGrupos.length) rerenderListaLote(); else closeModal();
    }
    return true;
  }catch(err){
    console.error(err);
    if(!silencioso) toast("Erro ao criar o evento. Veja o console.");
    return false;
  }
}

async function criarTodosGruposLote(){
  const idsPendentes = loteFotosGrupos.map(g=>g.id);
  let criados = 0, pulados = 0;
  for(const id of idsPendentes){
    const ok = await criarEventoDoGrupoLote(id, {silencioso:true});
    if(ok) criados++; else pulados++;
  }
  if(criados) toast(`${criados} evento${criados===1?"":"s"} criado${criados===1?"":"s"}.${pulados?` ${pulados} grupo${pulados===1?"":"s"} incompleto${pulados===1?"":"s"} ficou${pulados===1?"":"aram"} pendente — preencha e crie individualmente.`:""}`, 5000);
  else toast("Nenhum grupo estava completo. Preencha tipo, cliente e data antes de criar.");
  if(loteFotosGrupos.length) rerenderListaLote(); else closeModal();
}

async function processarFotoFestaNovoEvento(file){
  if(!file) return;
  // só faz sentido preencher algo se o formulário de "novo evento" ainda estiver aberto
  if(formState._col !== "eventos" || formState._id){
    toast("Abra o formulário de novo evento antes de enviar a foto.");
    return;
  }

  const t = document.getElementById("toast");
  if(t){ t.textContent = "📸 Analisando a foto..."; t.style.display="block"; }

  // lê a data real da câmera (EXIF) antes de tudo — é mais confiável que a IA "chutando" pela imagem.
  // aplica no formulário JÁ AQUI: mesmo que o Gemini falhe depois, a data fica correta.
  const dataExif = await extrairDataExif(file);
  if(dataExif){
    formState.data = dataExif;
    refreshFormFields();
  }

  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler a imagem.");
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const mimeType = file.type || "image/jpeg";
    const hoje = new Date().toISOString().slice(0,10);

    const prompt = `Você é um assistente de um fotógrafo brasileiro que está CADASTRANDO UM NOVO EVENTO a partir de uma foto de uma festa ou sessão já fotografada. A data de hoje é ${hoje}. Analise a imagem e extraia todas as informações visíveis. Retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{
  "tipo": "aniversario|batizado|casamento_civil|casamento_religioso|ensaio|outro",
  "dataCapturaExif": "",
  "nomeHomenageado": "",
  "idadeCrianca": null,
  "temaFesta": "",
  "tags": [],
  "observacoes": ""
}

Instruções por campo:
- "tipo": tipo de evento sugerido pelo contexto visual da foto (bolo/decoração infantil = aniversario; roupa/cerimônia de batismo = batizado; noivos, aliança ou cerimônia de casamento = casamento_civil ou casamento_religioso; ensaio fotográfico solo/casal/gestante sem festa = ensaio; se não conseguir identificar, use "outro").
- "dataCapturaExif": deixe vazio — a data já é obtida por outro meio, não é necessário estimar.
- "nomeHomenageado": nome da criança, aniversariante, noivos ou pessoa homenageada, se aparecer escrito em bolo, topper, faixa, convite, balão ou decoração. Deixe vazio se não aparecer.
- "idadeCrianca": número inteiro da idade que a criança completou (somente se for aniversário infantil), lendo velas, número em balões, topper ou texto da decoração ("2 aninhos" = 2). Null se não for possível identificar ou não se aplicar.
- "temaFesta": tema decorativo identificado (ex: "Dinossauro", "Princesa", "Safari", "Homem-Aranha", "Fazendinha"). Deixe vazio se não identificar.
- "tags": array de strings com características visuais úteis para busca futura (ex: ["azul","balões","mesa de doces"]). Máximo 6 tags.
- "observacoes": qualquer outra informação relevante visível na foto (nome do buffet/local se aparecer, decoração especial, etc).`;

    const resultado = await callGeminiVision(base64, mimeType, prompt);
    if(!resultado.texto){
      const prefixoData = dataExif ? "✅ Data do evento já preenchida pelo EXIF da câmera. " : "";
      toast(`${prefixoData}Não consegui ler o restante da foto (tipo, tema, tags etc.) — ${mensagemErroIA(resultado, "analisar a foto")}`, resultado.sobrecarregado ? 8000 : 6000);
      return;
    }
    let dados;
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      dados = JSON.parse(limpo);
    }catch(err){
      console.error("[foto-festa-novo-evento] parse error:", err, resultado.texto);
      const prefixoData = dataExif ? " A data do evento já foi preenchida pelo EXIF da câmera." : "";
      toast("Não consegui interpretar os dados da foto." + prefixoData + " Veja o console.");
      return;
    }

    if(dados.tipo) formState.tipo = dados.tipo;
    // a data do EXIF (metadado real da câmera) tem prioridade sobre qualquer estimativa da IA
    const dataFinal = dataExif || dados.dataCapturaExif;
    if(dataFinal) formState.data = dataFinal;

    const tagsDetectadas = [...(dados.tags||[])];
    if(dados.temaFesta && !tagsDetectadas.includes(dados.temaFesta)) tagsDetectadas.push(dados.temaFesta);
    if(tagsDetectadas.length){
      const tagsAtuais = Array.isArray(formState.tags) ? formState.tags : [];
      formState.tags = [...new Set([...tagsAtuais, ...tagsDetectadas])];
    }
    if(dados.observacoes && !formState.nomeEvento) formState.nomeEvento = dados.observacoes;

    // tenta casar o nome homenageado com uma criança ou cliente já cadastrado
    if(dados.nomeHomenageado){
      const ehCasamento = ["casamento_civil","casamento_religioso"].includes(dados.tipo);
      if(!ehCasamento){
        const criancaExistente = state.criancas.find(c=> similaridadeNome(c.nome, dados.nomeHomenageado) >= 0.82);
        if(criancaExistente){
          formState.criancaId = criancaExistente.id;
          const respId = criancaExistente.clientePaiId || criancaExistente.clienteMaeId;
          if(respId) formState.clienteId = respId;
        } else {
          formState.criancaId = "__new__";
          formState._quickNew_criancaId = { nome: dados.nomeHomenageado };
          if(dados.idadeCrianca!==null && dados.idadeCrianca!==undefined && formState.data){
            const dataEv = new Date(formState.data+"T00:00:00");
            const anoNasc = dataEv.getFullYear() - dados.idadeCrianca;
            formState._quickNew_criancaId.dataNascimento = `${anoNasc}-${String(dataEv.getMonth()+1).padStart(2,"0")}-${String(dataEv.getDate()).padStart(2,"0")}`;
            formState._quickNew_criancaId.nascimentoAproximado = true;
          }
        }
      }
      if(!formState.clienteId){
        const clienteExistente = state.clientes.find(c=>
          similaridadeNome(c.nome, dados.nomeHomenageado) >= 0.82 ||
          (c.nomeConjuge && similaridadeNome(c.nomeConjuge, dados.nomeHomenageado) >= 0.82)
        );
        if(clienteExistente) formState.clienteId = clienteExistente.id;
      }
    }

    formState.iaVerificado = true;
    formState.fotoLida = true;
    refreshFormFields();
    const avisoData = dataExif ? "Data confirmada pelo EXIF da câmera."
      : (dados.dataCapturaExif ? "Data estimada pela IA (sem EXIF na foto) — confira!" : "Não foi possível identificar a data — confira!");
    toast(`Campos preenchidos a partir da foto. ${avisoData} Confira cliente/criança e complete o que faltar antes de salvar.`, 5000);
  };
  reader.readAsDataURL(file);
}

async function confirmarFotoFesta(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  const updates = {};

  const data = document.getElementById("ff-data")?.value;
  if(data && data !== ev.data) updates.data = data;

  const tagsStr = document.getElementById("ff-tags")?.value;
  if(tagsStr!==undefined){
    const tags = tagsStr.split(",").map(t=>t.trim()).filter(Boolean);
    if(JSON.stringify(tags) !== JSON.stringify(ev.tags||[])) updates.tags = tags;
  }

  const obs = document.getElementById("ff-obs")?.value;
  if(obs) updates.nomeEvento = updates.nomeEvento || obs;

  try{
    if(Object.keys(updates).length || document.getElementById("ff-data")?.value){
      updates.fotoLida = true;
      updates.iaVerificado = true;
    }
    if(Object.keys(updates).length) await db.collection("eventos").doc(eventoId).update(updates);

    // atualiza a criança se tiver dados
    const crianca = ev.criancaId ? state.criancas.find(c=>c.id===ev.criancaId) : null;
    if(crianca){
      const criancaUpdates = {};
      const nome = document.getElementById("ff-nome")?.value;
      if(nome && nome !== crianca.nome) criancaUpdates.nome = nome;
      const nasc = document.getElementById("ff-nasc")?.value;
      if(nasc && nasc !== crianca.dataNascimento){
        criancaUpdates.dataNascimento = nasc;
        criancaUpdates.nascimentoAproximado = true;
      }
      if(Object.keys(criancaUpdates).length) await db.collection("criancas").doc(crianca.id).update(criancaUpdates);
    }

    toast("Evento atualizado com sucesso!");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}

function escapeHtml(s){ return s ? s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }
function formatarDataHora(iso){

   IA — GEMINI
   ========================================================= */
/* =========================================================
   DETECÇÃO DE DUPLICIDADE (heurística local + reforço opcional de IA)
   ========================================================= */
function normalizarTexto(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function similaridadeNome(a,b){
  const na = normalizarTexto(a), nb = normalizarTexto(b);
  if(!na || !nb) return 0;
  if(na===nb) return 1;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length, nb.length);
  return 1 - (dist/maxLen);
}
function telefoneNormalizado(t){
  const d = (t||"").replace(/\D/g,"");
  return d.slice(-8); // últimos 8 dígitos, ignora DDI/DDD pra comparar
}

/* =========================================================
   DUPLICIDADE — pontuação de completude, mesclagem de clientes
   e detecção de eventos duplicados
   ========================================================= */
function pontuacaoCompletudeCliente(clienteId){
  const cli = state.clientes.find(c=>c.id===clienteId);
  if(!cli) return 0;
  let pontos = 0;
  const evs = state.eventos.filter(e=>e.clienteId===clienteId);
  pontos += evs.length * 5;
  pontos += evs.filter(e=>["realizado","entregue"].includes(e.status||"")).length * 2;
  pontos += state.negociacoes.filter(n=>n.clienteId===clienteId).length;
  pontos += (cli.comentarios||[]).length;
  pontos += (cli.historicoContatos||[]).length;
  ["telefone","cidade","origem","indicadoPor","nomeConjuge","observacoes"].forEach(k=>{ if(cli[k]) pontos+=1; });
  if(valorTotalCliente(clienteId)>0) pontos += 2;
  return pontos;
}

function buscarPossiveisDuplicatasCliente(nome, telefone, nomeConjuge, excluirId){
  if(!nome) return [];
  return state.clientes
    .filter(c=>c.id!==excluirId)
    .map(c=>{
      const simNome = similaridadeNome(c.nome, nome);
      const simConjugeDireto = (nomeConjuge && c.nomeConjuge) ? similaridadeNome(c.nomeConjuge, nomeConjuge) : 0;
      const simCruzada = Math.max(
        nomeConjuge ? similaridadeNome(c.nome, nomeConjuge) : 0,
        c.nomeConjuge ? similaridadeNome(c.nomeConjuge, nome) : 0
      );
      const mesmoTelefone = !!(telefone && c.telefone && telefoneNormalizado(telefone) && telefoneNormalizado(telefone)===telefoneNormalizado(c.telefone));
      const score = Math.max(simNome, simConjugeDireto, simCruzada);
      return { cliente:c, score, mesmoTelefone };
    })
    .filter(x=>x.score>=0.6 || x.mesmoTelefone)
    .sort((a,b)=> (b.mesmoTelefone-a.mesmoTelefone) || (b.score-a.score));
}

function diasEntreDatas(d1,d2){
  if(!d1||!d2) return Infinity;
  return Math.abs((new Date(d1+"T00:00:00") - new Date(d2+"T00:00:00"))/86400000);
}
function buscarPossiveisEventosDuplicados(clienteId, tipo, data, excluirId){
  if(!clienteId || clienteId==="__new__" || !tipo || !data) return [];
  return state.eventos.filter(e=> e.id!==excluirId && e.clienteId===clienteId && e.tipo===tipo && diasEntreDatas(e.data,data)<=2);
}
function encontrarEventosDuplicadosGlobal(){
  const pares = [];
  const evs = state.eventos;
  for(let i=0;i<evs.length;i++){
    for(let j=i+1;j<evs.length;j++){
      const a=evs[i], b=evs[j];
      if(a.clienteId && a.clienteId===b.clienteId && a.tipo && a.tipo===b.tipo && diasEntreDatas(a.data,b.data)<=2){
        pares.push({a,b});
      }
    }
  }
  return pares;
}

async function mesclarClientesDuplicados(idManter, idRemover){
  if(idManter===idRemover) return;
  const manter = state.clientes.find(c=>c.id===idManter);
  const remover = state.clientes.find(c=>c.id===idRemover);
  if(!manter || !remover) return;
  try{
    const tarefas = [];
    state.eventos.filter(e=>e.clienteId===idRemover).forEach(e=> tarefas.push(db.collection("eventos").doc(e.id).update({clienteId:idManter})));
    state.negociacoes.filter(n=>n.clienteId===idRemover).forEach(n=> tarefas.push(db.collection("negociacoes").doc(n.id).update({clienteId:idManter})));
    state.produtos.filter(p=>p.clienteId===idRemover).forEach(p=> tarefas.push(db.collection("produtos").doc(p.id).update({clienteId:idManter})));
    state.pagamentos.filter(p=>p.clienteId===idRemover).forEach(p=> tarefas.push(db.collection("pagamentos").doc(p.id).update({clienteId:idManter})));
    state.recibos.filter(r=>r.clienteId===idRemover).forEach(r=> tarefas.push(db.collection("recibos").doc(r.id).update({clienteId:idManter})));
    state.casamentos.filter(c=>c.clienteId===idRemover).forEach(c=> tarefas.push(db.collection("casamentos").doc(c.id).update({clienteId:idManter})));
    state.leads.filter(l=>l.clienteId===idRemover).forEach(l=> tarefas.push(db.collection("leads").doc(l.id).update({clienteId:idManter})));
    state.criancas.filter(c=>c.clientePaiId===idRemover).forEach(c=> tarefas.push(db.collection("criancas").doc(c.id).update({clientePaiId:idManter})));
    state.criancas.filter(c=>c.clienteMaeId===idRemover).forEach(c=> tarefas.push(db.collection("criancas").doc(c.id).update({clienteMaeId:idManter})));
    await Promise.all(tarefas);

    const comentariosMesclados = [...(manter.comentarios||[]), ...(remover.comentarios||[])]
      .sort((a,b)=>(a.criadoEm||"").localeCompare(b.criadoEm||""));
    const contatosMesclados = [...(manter.historicoContatos||[]), ...(remover.historicoContatos||[])]
      .sort((a,b)=>(a.data||"").localeCompare(b.data||""));

    const updatesManter = { comentarios: comentariosMesclados, historicoContatos: contatosMesclados };
    ["telefone","cidade","origem","indicadoPor","nomeConjuge","observacoes"].forEach(k=>{
      if(!manter[k] && remover[k]) updatesManter[k] = remover[k];
    });

    await db.collection("clientes").doc(idManter).update(updatesManter);
    await db.collection("clientes").doc(idRemover).delete();
    toast(`Clientes mesclados. "${remover.nome}" foi excluído.`);
  }catch(err){
    console.error(err);
    toast("Erro ao mesclar clientes. Veja o console.");
  }
}
