function parseRetryAfter(mensagemErro){
  // extrai o número de segundos do texto de erro de rate limit do Gemini
  const match = (mensagemErro||"").match(/retry in ([\d.]+)\s*s/i);
  return match ? Math.ceil(parseFloat(match[1])) : null;
}
function ehErroSobrecarga(mensagemErro){
  // identifica o erro "modelo sobrecarregado" (503 / UNAVAILABLE), diferente do rate limit (429)
  return /overloaded|high demand|unavailable|servidores?\s+sobrecarregados?/i.test(mensagemErro||"");
}
// tenta de novo automaticamente quando o Gemini está sobrecarregado, com espera crescente entre as tentativas
const RETRY_SOBRECARGA_SEGUNDOS = [5, 12];
function mensagemErroIA(resultado, acao="processar"){
  if(resultado?.sobrecarregado){
    return `Os servidores do Gemini estão com alta demanda no momento. Já tentei de novo automaticamente algumas vezes, mas ainda sem sucesso — espere alguns minutos e tente ${acao} de novo.`;
  }
  return `Erro ao ${acao}: ${resultado?.erro || "tente novamente."}`;
}
function mostrarErroGemini(erro, elementoId){
  const segundos = parseRetryAfter(erro);
  if(segundos){
    // rate limit — mostra contagem regressiva e retenta automaticamente
    const el = document.getElementById(elementoId);
    let restante = segundos;
    const atualizar = ()=>{
      if(el) el.textContent = `Limite de requisições atingido. Tentando novamente em ${restante}s...`;
      else toast(`Limite atingido. Aguardando ${restante}s...`);
    };
    atualizar();
    const intervalo = setInterval(()=>{
      restante--;
      if(restante<=0){ clearInterval(intervalo); return; }
      atualizar();
    }, 1000);
    return { rateLimited: true, segundos, intervalo };
  }
  // erro genérico — mostra mensagem amigável
  const amigavel = (()=>{
    if(!erro) return "Erro desconhecido.";
    if(erro.includes("API_KEY") || erro.includes("API key")) return "Chave Gemini inválida. Verifique em Configurações.";
    if(erro.includes("quota") || erro.includes("Quota")) return "Cota do Gemini esgotada. Tente novamente mais tarde.";
    if(erro.includes("404") || erro.includes("not found")) return "Modelo Gemini não encontrado. Verifique se a chave é válida.";
    return erro;
  })();
  toast(amigavel);
  return { rateLimited: false };
}

const GEMINI_MODEL_PADRAO = "gemini-3.5-flash";        // briefing, resumo, duplicados, leitura de fotos/prints
const GEMINI_MODEL_CHAT = "gemini-3.1-flash-lite";     // chat "Conversar" — perguntas diretas de consulta, prioriza velocidade
const GEMINI_MODEL_FALLBACK = "gemini-2.5-flash";      // usado automaticamente quando o modelo padrão está sobrecarregado (503)

async function callGemini(prompt, tentativa=0, modelo=GEMINI_MODEL_PADRAO){
  const key = state.config?.geminiKey || "";
  if(!key) return { erro: "Nenhuma chave Gemini configurada." };
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    const data = await res.json();
    if(!res.ok){
      const msg = data?.error?.message || `Erro HTTP ${res.status}`;
      console.error("[gemini] erro da API:", msg, data);
      const segundos = parseRetryAfter(msg);
      if(segundos && tentativa===0){
        toast(`Limite de requisições atingido. Retentando em ${segundos}s automaticamente...`, (segundos+3)*1000);
        await new Promise(r=>setTimeout(r, segundos*1000));
        return callGemini(prompt, 1, modelo);
      }
      if(ehErroSobrecarga(msg) && tentativa<RETRY_SOBRECARGA_SEGUNDOS.length){
        const espera = RETRY_SOBRECARGA_SEGUNDOS[tentativa];
        toast(`Os servidores do Gemini estão com alta demanda no momento. Tentando de novo em ${espera}s (tentativa ${tentativa+1}/${RETRY_SOBRECARGA_SEGUNDOS.length})...`, (espera+3)*1000);
        await new Promise(r=>setTimeout(r, espera*1000));
        return callGemini(prompt, tentativa+1, modelo);
      }
      if(ehErroSobrecarga(msg) && modelo!==GEMINI_MODEL_FALLBACK){
        toast(`O modelo padrão do Gemini está sobrecarregado. Tentando com um modelo alternativo...`, 6000);
        return callGemini(prompt, 0, GEMINI_MODEL_FALLBACK);
      }
      return { erro: msg, segundosRetry: segundos, sobrecarregado: ehErroSobrecarga(msg) };
    }
    const texto = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!texto){
      console.error("[gemini] resposta sem texto:", data);
      return { erro: "A IA não retornou texto. Veja o console para detalhes." };
    }
    return { texto };
  }catch(err){
    console.error("[gemini] erro de rede:", err);
    return { erro: "Falha de conexão com o Gemini. Verifique sua internet." };
  }
}
function temIA(){ return !!(state.config?.geminiKey); }

  btn.disabled = true; btn.textContent = "Analisando...";
  const item = state[col]?.find(i=>i.id===id);
  if(!item){ btn.disabled=false; btn.textContent="Resumo IA"; return; }
  const comentarios = (item.comentarios||[]).sort((a,b)=>a.criadoEm?.localeCompare(b.criadoEm||"")||0)
    .map(c=>`[${formatarDataHora(c.criadoEm)}] ${c.texto}`).join("\n");
  const eventos = col==="clientes" ? state.eventos.filter(e=>e.clienteId===id)
    .map(e=>`${capitalize((e.tipo||"").replace("_"," "))} em ${formatDate(e.data)} — ${statusLabel(e.status||"confirmado")}`)
    .join("\n") : "";
  const prompt = `Você é um assistente de um fotógrafo brasileiro chamado Yuri. Analise as informações abaixo sobre um ${col==="leads"?"lead":"cliente"} e escreva um resumo prático em 3-5 linhas, como se fosse uma nota de briefing antes de retomar contato. Inclua pontos de atenção se houver.\n\n${col==="leads"?"LEAD":"CLIENTE"}: ${item.nome||""}\nOrigem: ${item.origem||"—"}\nStatus: ${item.status||"—"}\n${eventos?"Histórico de eventos:\n"+eventos+"\n":""}\nComentários:\n${comentarios||"(nenhum comentário ainda)"}`;
  const resultado = await callGemini(prompt);
  btn.disabled=false; btn.textContent="Resumo IA";
  if(resultado.texto){
    box.innerHTML = `<div class="ai-label">Resumo gerado por IA</div>${escapeHtml(resultado.texto).replace(/\n/g,"<br>")}`;
    box.style.display="block";
  } else {
    toast(`Erro ao gerar resumo: ${resultado.erro || "verifique a chave Gemini."}`);
  }
}

/* =========================================================
   ALERTAS PROATIVOS
   ========================================================= */
// um item fica "adormecido" pra um tipo de alerta específico até a data guardada em alertaSnoozeAte
// (guardamos o tipo junto porque, em tese, o mesmo documento poderia futuramente disparar mais de um tipo de alerta)
function alertaAdormecido(item, tipo, hoje){
  return !!(item.alertaSnoozeTipo===tipo && item.alertaSnoozeAte && item.alertaSnoozeAte>=hoje);
}

function calcularAlertas(){
  const alertas = [];
  const agora = new Date();
  const hoje = agora.toISOString().slice(0,10);

  // Leads sem atualização há 7+ dias
  state.leads.filter(l=>l.status!=="convertido"&&l.status!=="perdido").forEach(l=>{
    const ults = (l.comentarios||[]).map(c=>c.criadoEm||"").sort().reverse()[0];
    const ref = ults ? new Date(ults) : new Date(l.criadoEm||agora);
    const dias = Math.floor((agora-ref)/86400000);
    if(dias>=7 && !alertaAdormecido(l,"lead_parado",hoje)) alertas.push({tipo:"lead_parado", texto:`Lead <b>${l.nome}</b> sem atualização há ${dias} dias.`, id:l.id, col:"leads"});
  });

  // Eventos realizados sem entrega há 30+ dias
  state.eventos.filter(e=>e.status==="realizado"&&!e.dataEntregaReal).forEach(e=>{
    const ref = new Date(e.data||agora);
    const dias = Math.floor((agora-ref)/86400000);
    if(dias>=30 && !alertaAdormecido(e,"entrega_atrasada",hoje)){
      const cli = nomeRef("clientes",e.clienteId);
      alertas.push({tipo:"entrega_atrasada", texto:`Evento de <b>${cli}</b> realizado há ${dias} dias ainda sem entrega.`, id:e.id, col:"eventos"});
    }
  });

  // Saldo a receber em eventos entregues
  state.eventos.filter(e=>e.status==="entregue").forEach(e=>{
    const saldo = (Number(e.valorContratado)||0)-totalPago(e.id);
    if(saldo>0 && !alertaAdormecido(e,"saldo_pendente",hoje)){
      const cli = nomeRef("clientes",e.clienteId);
      alertas.push({tipo:"saldo_pendente", texto:`Evento entregue de <b>${cli}</b> ainda tem ${money(saldo)} a receber.`, id:e.id, col:"eventos"});
    }
  });

  // Prazos de prévia de produtos vencendo ou vencidos
  state.produtos.filter(p=>(p.etapa||"encomendado")!=="entregue" && p.prazoPrevia).forEach(p=>{
    const prazo = new Date(p.prazoPrevia+"T00:00:00");
    const dias = Math.floor((agora-prazo)/86400000)*-1;
    if(dias<=3 && !alertaAdormecido(p,"prazo_previa_produto",hoje)){
      const cli = nomeRef("clientes",p.clienteId);
      const nomeProd = p.produtoNome||"produto";
      const texto = dias<0 ? `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> venceu há ${Math.abs(dias)} dia${Math.abs(dias)===1?"":"s"}.`
        : dias===0 ? `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> é hoje!`
        : `Prazo da prévia de <b>${nomeProd}</b> para <b>${cli}</b> vence em ${dias} dia${dias===1?"":"s"}.`;
      alertas.push({tipo:"prazo_previa_produto", texto, id:p.id, col:"produtos"});
    }
  });

  return alertas;
}

/* =========================================================
   TELA DE ALERTA — mostra o motivo, contexto pra resolver,
   ações rápidas específicas do tipo, histórico de ações
   (reaproveita o padrão de comentários) e a soneca.
   ========================================================= */
function montarConteudoAlerta(tipo, item){
  const hoje = new Date().toISOString().slice(0,10);

  if(tipo==="lead_parado"){
    const ults = (item.comentarios||[]).map(c=>c.criadoEm||"").sort().reverse()[0];
    const ref = ults ? new Date(ults) : new Date(item.criadoEm||new Date());
    const dias = Math.floor((new Date()-ref)/86400000);
    const wa = whatsappLink(item.telefone);
    return {
      titulo: "Lead parado",
      motivo: `${item.nome||"Este lead"} está sem atualização há ${dias} dia${dias===1?"":"s"}.`,
      infoRows: [
        ["Interesse em", item.interesseTipo ? capitalize(item.interesseTipo.replace("_"," ")) : "—"],
        ["Origem", item.origem ? capitalize(item.origem) : "—"],
        ["Último contato", ults ? formatarDataHora(ults) : "Nenhum registrado"]
      ],
      acoesHtml: `
        ${wa?`<button onclick="window.open('${wa}','_blank')" title="WhatsApp"><i class="ti ti-brand-whatsapp" style="color:#25D366;font-size:16px;"></i></button>`:""}
        <button onclick="openForm('leads','${item.id}')">✏️ Editar lead</button>
      `
    };
  }

  if(tipo==="entrega_atrasada"){
    const cliente = state.clientes.find(c=>c.id===item.clienteId);
    const wa = cliente ? whatsappLink(cliente.telefone) : null;
    const dias = Math.floor((new Date()-new Date(item.data||new Date()))/86400000);
    return {
      titulo: "Entrega atrasada",
      motivo: `Evento de ${nomeRef("clientes",item.clienteId)} realizado há ${dias} dias ainda sem entrega.`,
      infoRows: [
        ["Tipo", item.tipo ? capitalize(item.tipo.replace("_"," ")) : "—"],
        ["Data do evento", formatDate(item.data)],
        ["Entrega prevista", item.dataEntregaPrevista ? formatDate(item.dataEntregaPrevista) : "—"]
      ],
      acoesHtml: `
        ${wa?`<button onclick="window.open('${wa}','_blank')" title="WhatsApp"><i class="ti ti-brand-whatsapp" style="color:#25D366;font-size:16px;"></i></button>`:""}
        <button onclick="marcarEventoEntregue('${item.id}')">✓ Marcar entregue</button>
      `
    };
  }

  if(tipo==="saldo_pendente"){
    const cliente = state.clientes.find(c=>c.id===item.clienteId);
    const wa = cliente ? whatsappLink(cliente.telefone) : null;
    const saldo = (Number(item.valorContratado)||0) - totalPago(item.id);
    return {
      titulo: "Saldo pendente",
      motivo: `Evento entregue de ${nomeRef("clientes",item.clienteId)} ainda tem ${money(saldo)} a receber.`,
      infoRows: [
        ["Valor contratado", money(item.valorContratado)],
        ["Recebido", money(totalPago(item.id))],
        ["Saldo", money(saldo)]
      ],
      acoesHtml: `
        ${wa?`<button onclick="window.open('${wa}','_blank')" title="WhatsApp"><i class="ti ti-brand-whatsapp" style="color:#25D366;font-size:16px;"></i></button>`:""}
        <button onclick="abrirBaixaRapida('${item.id}')">💰 Dar baixa</button>
      `
    };
  }

  if(tipo==="prazo_previa_produto"){
    return {
      titulo: "Prazo de prévia",
      motivo: `Prazo da prévia de ${item.produtoNome||"produto"} para ${nomeRef("clientes",item.clienteId)} ${item.prazoPrevia<hoje?"venceu":"está próximo"}.`,
      infoRows: [
        ["Etapa atual", ETAPA_PRODUTO_LABEL[item.etapa||"encomendado"]],
        ["Prazo da prévia", item.prazoPrevia ? formatDate(item.prazoPrevia) : "—"],
        ["Fornecedor", item.fornecedor || "—"]
      ],
      acoesHtml: `<button onclick="openForm('produtos','${item.id}')">✏️ Editar etapa</button>`
    };
  }

  return null;
}

async function snoozeAlerta(col, id, tipo, dias){
  const ate = new Date();
  ate.setDate(ate.getDate()+dias);
  const ateStr = ate.toISOString().slice(0,10);
  try{
    await db.collection(col).doc(id).update({ alertaSnoozeAte: ateStr, alertaSnoozeTipo: tipo });

    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao adiar o alerta. Veja o console.");
  }
}

// avança o status do evento pro próximo passo da sequência confirmado → realizado → entregue
async function avancarStatusEvento(eventoId){
  const ev = state.eventos.find(e=>e.id===eventoId);
  if(!ev) return;
  if(ev.bloqueado){ toast("Evento bloqueado — desbloqueie para alterar o status."); return; }
  // status de versões antigas do CRM (ex: "fechado", "orcamento") não existem mais na sequência atual —
  // trata como equivalente a "confirmado" pra não travar o avanço de eventos antigos
  const idxAtual = EVENTO_STATUS_SEQ.indexOf(ev.status||"confirmado");
  const idx = idxAtual===-1 ? 0 : idxAtual;
  if(idx>=EVENTO_STATUS_SEQ.length-1) return;
  const proximo = EVENTO_STATUS_SEQ[idx+1];
  if(!confirm(`Avançar o status deste evento para "${statusLabel(proximo)}"?`)) return;
  const updateData = { status: proximo };
  if(proximo==="entregue" && !ev.dataEntregaReal) updateData.dataEntregaReal = new Date().toISOString().slice(0,10);
  try{
    await db.collection("eventos").doc(eventoId).update(updateData);
    toast(`Status atualizado para "${statusLabel(proximo)}".`);
  }catch(err){
    console.error(err);
    toast("Erro ao atualizar o status. Veja o console.");
  }
}

    const prompt = `Você é assistente de um fotógrafo brasileiro. Veja o print de conversa abaixo (WhatsApp, Instagram etc.) entre ele e um lead. Resuma em poucas linhas o que aconteceu nesse contato: o que foi dito, pedido, combinado ou sinalizado. Seja direto e objetivo, sem repetir a conversa literalmente. Se não for possível identificar nada relevante, responda apenas "Nada relevante identificado.".`;

    if(t) t.style.display = "none";

      toast(mensagemErroIA(resultado, "ler a imagem"), resultado.sobrecarregado ? 7000 : undefined);
      return;

    await salvarComentario("leads", leadId, `📷 Print de conversa (IA):\n${resultado.texto.trim()}`);

function triggerConversaImportadaLead(leadId){

async function analisarLeadComIA(leadId){
  const lead = state.leads.find(l=>l.id===leadId);
  if(!lead || !temIA()) return;
  const comentarios = [...(lead.comentarios||[])].sort((a,b)=>(a.criadoEm||"").localeCompare(b.criadoEm||""))
    .map(c=>`[${formatarDataHora(c.criadoEm)}] ${c.texto}`).join("\n");
  const prompt = `${PERSONA_BASE_IA} Você é o Agente Comercial, especialista em qualificação de leads e vendas humanizadas.

Analise o histórico completo do lead abaixo e retorne APENAS um JSON válido, sem markdown, sem explicação, no formato:
{"temperatura": "quente|morno|frio", "justificativa": "", "pontosAtencao": "", "mensagensSugeridas": ["", ""]}

- "temperatura": classifique o nível de interesse/urgência de compra.
- "justificativa": 1-2 frases explicando a classificação.
- "pontosAtencao": o que pode travar essa venda (ou "Nenhum ponto de atenção identificado.").
- "mensagensSugeridas": 2 a 3 versões diferentes da próxima mensagem para enviar a este lead, cada uma pronta para copiar e colar no WhatsApp, tom humanizado, adequada ao interesse dele (${lead.interesseTipo || "não informado"}). Varie a abordagem entre as versões (ex: uma mais direta, outra mais pessoal/emocional, outra com senso de oportunidade) e, quando fizer sentido, use gatilhos emocionais sutis (afeto, pertencimento, memória que está sendo construída) sem soar forçado ou manipulador. Não invente dados que não foram informados.

Nome do lead: ${lead.nome || "não informado"}
Como chegou até nós: ${lead.origem || "não informado"}
Interesse em: ${lead.interesseTipo ? capitalize(lead.interesseTipo.replace("_"," ")) : "não informado"}
Status atual: ${lead.status || "negociando"}
Histórico de comentários/contatos (mais antigo primeiro):
${comentarios || "(nenhum comentário registrado ainda)"}`;

  const resultado = await callGemini(prompt);
  if(!resultado.texto){
    toast(mensagemErroIA(resultado, "analisar o lead"));
    openView("leads", leadId);
    return;
  }

  let dados;
  try{
    dados = JSON.parse(resultado.texto.replace(/```json|```/g,"").trim());
  }catch(err){
    console.error("[analisar-lead] erro ao parsear JSON:", err, resultado.texto);
    toast("Não consegui interpretar a análise da IA. Veja o console.");
    openView("leads", leadId);
    return;
  }
  if(!["quente","morno","frio"].includes(dados.temperatura)) dados.temperatura = lead.temperatura || "";
  const mensagens = Array.isArray(dados.mensagensSugeridas) ? dados.mensagensSugeridas.filter(Boolean) : [];

  try{
    const criadoEm = new Date().toISOString();
    await db.collection("leads").doc(leadId).update({
      temperatura: dados.temperatura,
      analiseIA: { temperatura: dados.temperatura, mensagensSugeridas: mensagens, criadoEm }
    });
    const textoComentario = `🎯 Análise de qualificação (IA):\nTemperatura: ${capitalize(dados.temperatura||"não identificada")}\n${dados.justificativa||""}\nPontos de atenção: ${dados.pontosAtencao||"—"}\nSugestões de mensagem:\n${mensagens.length ? mensagens.map((m,i)=>`${i+1}) ${m}`).join("\n") : "—"}`;
    await salvarComentario("leads", leadId, textoComentario);
  }catch(err){
    console.error(err);
    toast("Erro ao salvar a análise do lead. Veja o console.");
  }
  openView("leads", leadId);
}

async function callGeminiVision(base64Data, mimeType, prompt, tentativa=0, modelo=GEMINI_MODEL_PADRAO){
  const key = state.config?.geminiKey || "";
  if(!key) return { erro: "Nenhuma chave Gemini configurada." };
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ parts:[
        { inline_data:{ mime_type: mimeType, data: base64Data } },
        { text: prompt }
      ]}]})
    });
    const data = await res.json();
    if(!res.ok){
      const msg = data?.error?.message || `Erro HTTP ${res.status}`;
      console.error("[gemini-vision] erro da API:", msg, data);
      const segundos = parseRetryAfter(msg);
      if(segundos && tentativa===0){
        toast(`Limite de requisições atingido. Retentando em ${segundos}s automaticamente...`, (segundos+3)*1000);
        await new Promise(r=>setTimeout(r, segundos*1000));
        return callGeminiVision(base64Data, mimeType, prompt, 1);
      }
      if(ehErroSobrecarga(msg) && tentativa<RETRY_SOBRECARGA_SEGUNDOS.length){
        const espera = RETRY_SOBRECARGA_SEGUNDOS[tentativa];
        toast(`Os servidores do Gemini estão com alta demanda no momento. Tentando ler a imagem de novo em ${espera}s (tentativa ${tentativa+1}/${RETRY_SOBRECARGA_SEGUNDOS.length})...`, (espera+3)*1000);
        await new Promise(r=>setTimeout(r, espera*1000));
        return callGeminiVision(base64Data, mimeType, prompt, tentativa+1);
      }
      if(ehErroSobrecarga(msg) && modelo!==GEMINI_MODEL_FALLBACK){
        toast(`O modelo padrão do Gemini está sobrecarregado. Tentando ler a imagem com um modelo alternativo...`, 6000);
        return callGeminiVision(base64Data, mimeType, prompt, 0, GEMINI_MODEL_FALLBACK);
      }
      return { erro: msg, segundosRetry: segundos, sobrecarregado: ehErroSobrecarga(msg) };
    }
    const texto = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!texto){
      console.error("[gemini-vision] resposta sem texto:", data);
      return { erro: "A IA não retornou texto." };
    }
    return { texto };
  }catch(err){
    console.error("[gemini-vision] erro de rede:", err);
    return { erro: "Falha de conexão com o Gemini." };
  }
}

async function callGeminiAudio(base64Data, mimeType, prompt, tentativa=0, modelo=GEMINI_MODEL_PADRAO){
  const key = state.config?.geminiKey || "";
  if(!key) return { erro: "Nenhuma chave Gemini configurada." };
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${key}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ parts:[
        { inline_data:{ mime_type: mimeType, data: base64Data } },
        { text: prompt }
      ]}]})
    });
    const data = await res.json();
    if(!res.ok){
      const msg = data?.error?.message || `Erro HTTP ${res.status}`;
      console.error("[gemini-audio] erro da API:", msg, data);
      const segundos = parseRetryAfter(msg);
      if(segundos && tentativa===0){
        toast(`Limite de requisições atingido. Retentando em ${segundos}s automaticamente...`, (segundos+3)*1000);
        await new Promise(r=>setTimeout(r, segundos*1000));
        return callGeminiAudio(base64Data, mimeType, prompt, 1);
      }
      if(ehErroSobrecarga(msg) && tentativa<RETRY_SOBRECARGA_SEGUNDOS.length){
        const espera = RETRY_SOBRECARGA_SEGUNDOS[tentativa];
        toast(`Os servidores do Gemini estão com alta demanda no momento. Tentando de novo em ${espera}s (tentativa ${tentativa+1}/${RETRY_SOBRECARGA_SEGUNDOS.length})...`, (espera+3)*1000);
        await new Promise(r=>setTimeout(r, espera*1000));
        return callGeminiAudio(base64Data, mimeType, prompt, tentativa+1);
      }
      if(ehErroSobrecarga(msg) && modelo!==GEMINI_MODEL_FALLBACK){
        toast(`O modelo padrão do Gemini está sobrecarregado. Tentando com um modelo alternativo...`, 6000);
        return callGeminiAudio(base64Data, mimeType, prompt, 0, GEMINI_MODEL_FALLBACK);
      }
      return { erro: msg, segundosRetry: segundos, sobrecarregado: ehErroSobrecarga(msg) };
    }
    const texto = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!texto){
      console.error("[gemini-audio] resposta sem texto:", data);
      return { erro: "A IA não retornou texto." };
    }
    return { texto };
  }catch(err){
    console.error("[gemini-audio] erro de rede:", err);
    return { erro: "Falha de conexão com o Gemini." };
  }
}

async function processarVcfCliente(clienteId, file){
  toast("Lendo contato (.vcf)...");
  const reader = new FileReader();
  reader.onerror = ()=> toast("Erro ao ler o arquivo.");
  reader.onload = (e)=>{
    const texto = e.target.result || "";
    const dados = {};
    // parse básico de vCard
    const linhas = texto.replace(/\r\n|\r/g,"\n").split("\n");
    for(const linha of linhas){
      if(linha.startsWith("FN:")) dados.nome = linha.slice(3).trim();
      if(linha.startsWith("N:") && !dados.nome){
        const partes = linha.slice(2).split(";").filter(Boolean);
        dados.nome = partes.reverse().join(" ").trim();
      }
      const telMatch = linha.match(/^TEL[^:]*:(.*)/);
      if(telMatch && !dados.telefone) dados.telefone = telMatch[1].replace(/[^\d+]/g,"");
      const emailMatch = linha.match(/^EMAIL[^:]*:(.*)/);
      if(emailMatch && !dados.email) dados.email = emailMatch[1].trim();
    }
    if(!dados.nome && !dados.telefone){ toast("Não encontrei dados no arquivo .vcf."); return; }
    abrirConfirmacaoPrintCliente(clienteId, dados);
  };
  reader.readAsText(file, "utf-8");
}

function aplicarDataEntregaPrevista(dataEvento){
  if(formState._col !== "eventos" || formState._id) return; // só sugere em eventos novos
  if(!dataEvento || formState.dataEntregaPrevista) return; // não sobrescreve se já foi definida à mão
  const dataEntrega = new Date(dataEvento+"T00:00:00");
  dataEntrega.setDate(dataEntrega.getDate()+45);
  formState.dataEntregaPrevista = dataEntrega.toISOString().slice(0,10);
  refreshFormFields();
}
function aplicarValorTabela(tipo){
  if(formState._col !== "eventos") return;
  const precos = state.config?.precos || {};
  const valorPadrao = precos[tipo];
  if(valorPadrao===undefined || valorPadrao==="" || valorPadrao==null) return;
  if(!formState._id){ // só auto-preenche em eventos novos, pra não sobrescrever edição
    formState.valorTabela = valorPadrao;
    if(!formState.valorContratado) formState.valorContratado = valorPadrao;
  }
}
function aplicarProdutoCatalogo(nome){
  if(formState._col !== "produtos") return;
  const catalogo = state.config?.catalogoProdutos || [];
  const item = catalogo.find(p=>p.nome===nome);
  if(!item) return;
  if(!formState._id){ // só auto-preenche em pedidos novos, pra não sobrescrever edição
    formState.fornecedor = item.fornecedor || "";
    formState.valorCusto = item.custo || "";
    formState.valorVenda = item.venda || "";
    if(item.descricao && !formState.observacoes) formState.observacoes = item.descricao;
    refreshFormFields();
  }
}
function refreshFormFields(){
  const schema = SCHEMAS[formState._col];
  document.getElementById("form-fields").innerHTML = camposVisiveis(schema).map(f=>renderField(f, formState[f.key])).join("");
}

let _modalHistoryPushed = false;
function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("active");

  // se esse modal tinha entrada própria no histórico (aberto normalmente, não via botão voltar),
  // consome essa entrada agora pra não deixar "lixo" no histórico do navegador
  if(_modalHistoryPushed){
    _modalHistoryPushed = false;
    history.back();
  }
}

/* ---------- Fechar modal: Esc, clique fora, e botão voltar (mobile) ---------- */
(function(){
  const backdrop = document.getElementById("modal-backdrop");

  // detecta quando o modal é aberto (por qualquer uma das dezenas de chamadas .classList.add("active") no código)
  // e empilha uma entrada no histórico, pra que o botão "voltar" feche o modal em vez de sair do app
  new MutationObserver(()=>{
    if(backdrop.classList.contains("active") && !_modalHistoryPushed){
      history.pushState({ modalAberto:true }, "");
      _modalHistoryPushed = true;
    }
  }).observe(backdrop, { attributes:true, attributeFilter:["class"] });

  // botão/gesto de voltar do navegador (inclui o botão voltar do Android)
  window.addEventListener("popstate", ()=>{
    if(backdrop.classList.contains("active")){
      _modalHistoryPushed = false; // essa entrada do histórico já foi consumida pelo próprio "voltar"
      closeModal();
    }
  });

  // clique fora da caixa do modal (no fundo escurecido)
  backdrop.addEventListener("click", (e)=>{
    if(e.target === backdrop) closeModal();
  });

  // tecla Esc
  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && backdrop.classList.contains("active")) closeModal();
  });
})();

function renderField(f, value){
  const id = `field-${f.key}`;
  if(f.type==="textarea"){
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" oninput="formState['${f.key}']=this.value">${value||""}</textarea></div>`;
  }
  if(f.type==="select"){
    const extraOnchange = f.key==="tipo" ? "aplicarValorTabela(this.value);" : "";
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="formState['${f.key}']=this.value;${extraOnchange}${f.triggersRefresh?' refreshFormFields();':''}" style="width:100%">
        <option value="">—</option>
        ${f.options.map(o=>`<option value="${o}" ${value===o?"selected":""}>${f.key==="status" ? statusLabel(o) : f.key==="etapa" ? (ETAPA_PRODUTO_LABEL[o]||capitalize(o)) : f.key==="tipoData" ? (o==="mes"?"Só o mês":"Data definida") : capitalize(o.replace("_"," "))}</option>`).join("")}
      </select></div>`;
  }
  if(f.type==="catalogo"){
    const catalogo = state.config?.catalogoProdutos || [];
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="formState['${f.key}']=this.value; aplicarProdutoCatalogo(this.value);" style="width:100%">
        <option value="">—</option>
        ${catalogo.filter(p=>p.nome).map(p=>`<option value="${p.nome}" ${value===p.nome?"selected":""}>${p.nome}</option>`).join("")}
      </select>
      ${!catalogo.filter(p=>p.nome).length ? `<div style="font-size:11px;color:var(--muted-2);margin-top:4px;">Nenhum produto cadastrado ainda — vá em Configurações → Catálogo de Produtos.</div>` : ""}
      </div>`;
  }
  if(f.type==="ref"){
    const opts = [...(state[f.ref] || [])]
      .filter(o => !(f.ref==="clientes" && o.hibernado && o.id!==value)) // esconde hibernados, exceto o já selecionado
      .sort((a,b)=>{
        if(f.key==="criancaId" && formState.clienteId){
          const aLinked = (a.clientePaiId===formState.clienteId || a.clienteMaeId===formState.clienteId) ? 0 : 1;
          const bLinked = (b.clientePaiId===formState.clienteId || b.clienteMaeId===formState.clienteId) ? 0 : 1;
          if(aLinked !== bLinked) return aLinked - bLinked;
        }
        return (a.nome||a.nomeCasal||"").localeCompare(b.nome||b.nomeCasal||"", "pt-BR");
      });
    const isNew = value === "__new__";
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" onchange="onRefChange('${f.key}','${f.ref}',this.value)" style="width:100%">
        <option value="">—</option>
        <option value="__new__" ${isNew?"selected":""}>+ Cadastrar novo${f.ref==='criancas'?'a':''} ${SCHEMAS[f.ref].singular.toLowerCase()}</option>
        ${opts.map(o=>`<option value="${o.id}" ${value===o.id?"selected":""}>${o.nome ? (o.nomeConjuge ? `${o.nome} & ${o.nomeConjuge}` : o.nome) : labelEvento(o.id)}</option>`).join("")}
      </select>
      <div id="quick-new-${f.key}">${isNew ? renderQuickNew(f.key, f.ref) : ""}</div>
      </div>`;
  }
  if(f.type==="checkbox"){
    return `<div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="${id}" ${value?"checked":""} onchange="formState['${f.key}']=this.checked" style="width:18px; height:18px;">
      <label for="${id}" style="margin:0;">${f.label}</label>
      </div>`;
  }
  if(f.type==="tags"){
    const str = Array.isArray(value) ? value.join(", ") : (value||"");
    return `<div class="field"><label>${f.label}</label>
      <input id="${id}" type="text" value="${str}" oninput="formState['${f.key}']=this.value.split(',').map(s=>s.trim()).filter(Boolean)">
      </div>`;
  }
  const extraDataOn = (f.key==="data" && formState._col==="eventos") ? " aplicarDataEntregaPrevista(this.value);" : "";
  return `<div class="field"><label>${f.label}</label><input id="${id}" type="${f.type}" value="${value||""}" oninput="formState['${f.key}']=this.value;${extraDataOn}"></div>`;
}

function autoSelecionarCriancaVinculada(clienteId){
  // ao escolher o responsável num evento, se ele já tiver uma única criança vinculada,
  // seleciona ela automaticamente no campo "Criança" (evita repetir o trabalho manual)
  if(!clienteId || clienteId === "__new__") return;
  const filhos = state.criancas.filter(c=>c.clientePaiId===clienteId || c.clienteMaeId===clienteId);
  if(filhos.length === 1){
    formState.criancaId = filhos[0].id;
  } else if(filhos.length > 1){
    // mais de uma criança vinculada: não escolhe sozinho pra evitar erro, deixa o usuário decidir
    formState.criancaId = "";
  }
}
function onRefChange(fKey, ref, val){
  formState[fKey] = val;
  if(val === "__new__"){
    if(!formState[`_quickNew_${fKey}`]) formState[`_quickNew_${fKey}`] = {};
  } else {
    delete formState[`_quickNew_${fKey}`];
  }
  if(fKey==="clienteId"){
    if(formState._col === "eventos") autoSelecionarCriancaVinculada(val);
    refreshFormFields();
    return;
  }
  const container = document.getElementById(`quick-new-${fKey}`);
  if(val === "__new__"){
    container.innerHTML = renderQuickNew(fKey, ref);
  } else {
    container.innerHTML = "";
  }
}
function renderQuickNew(fKey, ref){
  const qf = QUICK_FIELDS[ref];
  if(!qf) return "";
  const quick = formState[`_quickNew_${fKey}`] || {};
  return `<div class="quick-new-box">
    <div style="font-size:12px;color:var(--muted);margin:10px 0 8px;">Dados d${ref==='criancas'?'a nova criança':'o novo cliente'}:</div>
    ${qf.map(q=>`<div class="field"><label>${q.label}</label><input type="${q.type}" value="${quick[q.key]||""}" oninput="formState['_quickNew_${fKey}']['${q.key}']=this.value"></div>`).join("")}
  </div>`;
}


async function saveDoc(ignorarDuplicatas=false){
  const col = formState._col;
  const id = formState._id;
  const schema = SCHEMAS[col];
  const existing = id ? state[col].find(i=>i.id===id) : null;

  if(!ignorarDuplicatas){
    const alertasDuplicataCliente = [];
    if(col==="clientes" && !id){
      const cands = buscarPossiveisDuplicatasCliente(formState.nome, formState.telefone, formState.nomeConjuge, null);
      if(cands.length && (cands[0].score>=0.85 || cands[0].mesmoTelefone)){
        alertasDuplicataCliente.push({ nomeNovo: formState.nome, candidatos: cands.slice(0,3) });
      }
    }
    for(const f of camposVisiveis(schema)){
      if(f.type==="ref" && f.ref==="clientes" && formState[f.key]==="__new__"){
        const quick = formState[`_quickNew_${f.key}`]||{};
        if(quick.nome){
          const cands = buscarPossiveisDuplicatasCliente(quick.nome, quick.telefone, "", null);
          if(cands.length && (cands[0].score>=0.85 || cands[0].mesmoTelefone)){
            alertasDuplicataCliente.push({ nomeNovo: quick.nome, candidatos: cands.slice(0,3) });
          }
        }
      }
    }
    if(alertasDuplicataCliente.length){
      abrirConfirmacaoDuplicataCliente(alertasDuplicataCliente);
      return;
    }

    if(col==="eventos" && formState.clienteId && formState.tipo && formState.data){
      const dupsEvento = buscarPossiveisEventosDuplicados(formState.clienteId, formState.tipo, formState.data, id);
      if(dupsEvento.length){
        abrirConfirmacaoDuplicataEvento(dupsEvento);
        return;
      }
    }
  }

  const data = {};

  for(const f of camposVisiveis(schema)){
    let val = formState[f.key];

    if(val === "__new__"){
      const ref = f.ref;
      const quick = formState[`_quickNew_${f.key}`] || {};
      const qFields = QUICK_FIELDS[ref] || [];
      const missingQuick = qFields.filter(q=>q.required && !quick[q.key]);
      if(missingQuick.length){
        toast(`Preencha: ${missingQuick.map(q=>q.label).join(", ")}`);
        return;
      }
      const quickData = {};
      qFields.forEach(q=> quickData[q.key] = quick[q.key] || "");
      if(quick.nascimentoAproximado) quickData.nascimentoAproximado = true;

      if(ref === "criancas"){
        if(!quickData.dataNascimento && quickData.idadeCompletada && data.data){
          const dataFestaObj = new Date(data.data+"T00:00:00");
          const anoNasc = dataFestaObj.getFullYear() - Number(quickData.idadeCompletada);
          quickData.dataNascimento = `${anoNasc}-${String(dataFestaObj.getMonth()+1).padStart(2,"0")}-${String(dataFestaObj.getDate()).padStart(2,"0")}`;
          quickData.nascimentoAproximado = true;
        }
        if(!quickData.dataNascimento){
          toast("Informe a data de nascimento da criança ou a idade que ela completou nesta festa.");
          return;
        }
      }

      if(ref === "criancas" && data.clienteId){
        quickData.clientePaiId = data.clienteId; // já vincula a criança ao cliente do evento
      }
      quickData.criadoEm = new Date().toISOString();
      try{
        const newDocRef = await db.collection(ref).add(quickData);
        val = newDocRef.id;
      }catch(err){
        console.error(err);
        toast(`Erro ao cadastrar ${SCHEMAS[ref].singular.toLowerCase()} automaticamente.`);
        return;
      }
    }

    data[f.key] = val ?? (f.type==="tags" ? [] : f.type==="checkbox" ? false : "");
  }

  // vincula/cria automaticamente o registro em "Casamentos" para eventos de casamento
  // (o cônjuge em si vive só no cadastro do Cliente — não é duplicado aqui)
  if(col === "eventos" && (data.tipo==="casamento_civil" || data.tipo==="casamento_religioso") && data.clienteId){
    const cliente = state.clientes.find(c=>c.id===data.clienteId);
    const conjugeFinal = cliente?.nomeConjuge || "";
    const existente = state.casamentos.find(c=>c.clienteId===data.clienteId);
    if(existente){
      data.casamentoId = existente.id;
      if(conjugeFinal && !existente.conjuge){
        try{ await db.collection("casamentos").doc(existente.id).update({ conjuge: conjugeFinal }); }
        catch(err){ console.error(err); }
      }
    } else {
      try{
        const novoCasamento = await db.collection("casamentos").add({
          nomeCasal: cliente ? cliente.nome : "Casal", conjuge: conjugeFinal,
          dataCasamento: data.data || "", clienteId: data.clienteId,
          observacoes: "", criadoEm: new Date().toISOString()
        });
        data.casamentoId = novoCasamento.id;
      }catch(err){
        console.error("[casamentos] erro ao criar automaticamente:", err);
        // não bloqueia o salvamento do evento por causa disso
      }
    }
  }

  if(col === "criancas"){
    if(!data.dataNascimento && data.idadeCompletada && data.dataFesta){
      const dataFestaObj = new Date(data.dataFesta+"T00:00:00");
      const anoNasc = dataFestaObj.getFullYear() - Number(data.idadeCompletada);
      data.dataNascimento = `${anoNasc}-${String(dataFestaObj.getMonth()+1).padStart(2,"0")}-${String(dataFestaObj.getDate()).padStart(2,"0")}`;
      data.nascimentoAproximado = true;
    } else if(data.dataNascimento){
      data.nascimentoAproximado = false;
    }
    if(!data.dataNascimento){
      toast("Informe a data de nascimento, ou a idade que ela completou + a data da festa.");
      return;
    }
  }

  // registra automaticamente a data de cada mudança de status da negociação
  if(col === "negociacoes"){
    const statusAnterior = existing ? (existing.status||"negociacao") : null;
    const statusNovo = data.status || "negociacao";
    const historico = existing && Array.isArray(existing.historicoStatus) ? [...existing.historicoStatus] : [];
    if(!existing || statusAnterior !== statusNovo){
      historico.push({ status: statusNovo, data: new Date().toISOString() });
    }
    data.historicoStatus = historico;
    // limpa o campo do tipo de data não usado, pra não sobrar lixo de uma escolha anterior
    if(data.tipoData==="data") data.mesPrevisto = "";
    else data.dataDefinida = "";
  }

  // registra automaticamente a data de cada mudança de etapa do pedido de produto
  if(col === "produtos"){
    const etapaAnterior = existing ? (existing.etapa||"encomendado") : null;
    const etapaNova = data.etapa || "encomendado";
    const historico = existing && Array.isArray(existing.historicoEtapas) ? [...existing.historicoEtapas] : [];
    if(!existing || etapaAnterior !== etapaNova){
      historico.push({ etapa: etapaNova, data: new Date().toISOString() });
    }
    data.historicoEtapas = historico;
  }

  // entrega prevista padrão: 45 dias após a data do evento (só ao criar, se não foi definida à mão)
  if(col === "eventos" && !existing && data.data && !data.dataEntregaPrevista){
    const dataEntrega = new Date(data.data+"T00:00:00");
    dataEntrega.setDate(dataEntrega.getDate()+45);
    data.dataEntregaPrevista = dataEntrega.toISOString().slice(0,10);
  }

  const missing = camposVisiveis(schema).filter(f=>f.required && !data[f.key]);
  if(missing.length){
    toast(`Preencha: ${missing.map(f=>f.label).join(", ")}`);
    return;
  }

  try{
    if(id){
      await db.collection(col).doc(id).update(data);
      if(col === "negociacoes") await sincronizarPreReservaNegociacao(id, { ...data, eventoId: existing?.eventoId||"" });
      toast(`${schema.singular} atualizado.`);
    } else {
      data.criadoEm = new Date().toISOString();
      const novoRef = await db.collection(col).add(data);
      if(col === "negociacoes") await sincronizarPreReservaNegociacao(novoRef.id, { ...data, eventoId:"" });
      if(col === "eventos" && formState._negociacaoId){
        try{
          const negAtual = state.negociacoes.find(n=>n.id===formState._negociacaoId);
          const historicoNeg = negAtual && Array.isArray(negAtual.historicoStatus) ? [...negAtual.historicoStatus] : [];
          if(!negAtual || (negAtual.status||"negociacao")!=="fechado"){
            historicoNeg.push({ status:"fechado", data: new Date().toISOString() });
          }
          await db.collection("negociacoes").doc(formState._negociacaoId).update({ eventoId: novoRef.id, status: "fechado", historicoStatus: historicoNeg });
          const negAtualizada = state.negociacoes.find(n=>n.id===formState._negociacaoId);
          if(negAtualizada) await sincronizarPreReservaNegociacao(formState._negociacaoId, { ...negAtualizada, status:"fechado", eventoId: novoRef.id });
        }
        catch(err){ console.error("[negociacoes] erro ao vincular evento:", err); }
      }
      toast(`${schema.singular} criado.`);
      if(col === "leads" && temIA()) analisarLeadComIA(novoRef.id);
    }
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}

async function deleteDoc(col, id){

  await db.collection(col).doc(id).delete();

}

function renderListaFeedbacks(){

function renderCardFeedback(fb){
  const isOpen = feedbacksExpandidos.has(fb.id);
  const evento = fb.eventoId ? state.eventos.find(e=>e.id===fb.eventoId) : null;
  const nomeExibido = nomeExibidoFeedback(fb);
  const precisaVincular = !fb.clienteId;
  const clientesOrdenados = [...state.clientes].filter(c=>!c.hibernado).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));

  const perguntasHtml = FEEDBACK_ITENS.map(item=>{
    const r = fb.respostas?.[item.key];
    if(!r || (r.tipo==="texto" && !r.valor)) return "";
    const conteudo = r.tipo==="audio"
      ? `<audio controls src="${r.url}" style="width:100%; height:36px; margin-top:4px;"></audio>
         ${temIA() ? `<button class="ghost sm" style="margin-top:6px;" onclick="event.stopPropagation();transcreverAudioFeedback('${fb.id}','${item.key}')">✦ Transcrever com IA</button>
         <div id="transcricao-${fb.id}-${item.key}" style="font-size:13px; margin-top:6px; color:var(--muted);"></div>` : ""}`
      : `<div style="font-size:13px; margin-top:4px;">${escapeHtml(r.valor)}</div>`;
    return `<div style="margin-bottom:12px;"><div style="font-size:12px; color:var(--muted-2);">${item.texto}</div>${conteudo}</div>`;
  }).join("");

  return `
    <div class="card" style="padding:0; margin-bottom:10px; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; cursor:pointer; flex-wrap:wrap;"
           onclick="toggleFeedbackExpandido('${fb.id}')">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-family:'Fraunces',serif; font-size:16px;">${isOpen?"▾":"▸"} ${escapeHtml(nomeExibido)}</span>
          ${!fb.revisado ? `<span class="badge" style="border-color:var(--amber); color:var(--amber-text); font-size:10px;">Novo</span>` : ""}
        </div>
        <span style="font-size:12px; color:var(--muted-2);">${formatarDataHora(fb.criadoEm)}</span>
      </div>
      ${isOpen ? `
        <div style="padding:0 18px 16px; border-top:1px solid var(--border-solid); padding-top:14px;">
          ${evento ? `<div style="font-size:12px; color:var(--muted-2); margin-bottom:12px;">${capitalize((evento.tipo||"").replace("_"," "))} · ${formatDate(evento.data)}</div>` : ""}
          ${perguntasHtml || `<div style="font-size:13px;color:var(--muted-2);">Sem respostas preenchidas.</div>`}
          ${precisaVincular ? `
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
              <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:6px;">Vincular a um cliente cadastrado</label>
              <div style="display:flex; gap:8px;">
                <select id="vincular-fb-${fb.id}" style="flex:1;">
                  <option value="">— selecione —</option>
                  ${clientesOrdenados.map(c=>`<option value="${c.id}">${c.nome}</option>`).join("")}
                </select>
                <button class="sm" onclick="event.stopPropagation();vincularFeedbackCliente('${fb.id}')">Vincular</button>
              </div>
            </div>
          ` : ""}
          <div class="row-actions" style="margin-top:10px;">
            ${!fb.revisado ? `<button class="sm ghost" onclick="event.stopPropagation();marcarFeedbackRevisado('${fb.id}')">Marcar como lido</button>` : ""}
            <button class="sm danger" onclick="event.stopPropagation();excluirFeedback('${fb.id}')">Excluir</button>
          </div>
        </div>
      ` : ""}
    </div>
  `;
}
async function vincularFeedbackCliente(feedbackId){
  const select = document.getElementById(`vincular-fb-${feedbackId}`);
  const clienteId = select?.value;
  if(!clienteId){ toast("Selecione um cliente."); return; }
  try{ await db.collection("feedbacks").doc(feedbackId).update({ clienteId }); toast("Feedback vinculado ao cliente."); }
  catch(err){ console.error(err); toast("Erro ao vincular."); }
}
async function marcarFeedbackRevisado(feedbackId){
  try{ await db.collection("feedbacks").doc(feedbackId).update({ revisado: true }); }
  catch(err){ console.error(err); toast("Erro ao atualizar."); }
}
async function excluirFeedback(feedbackId){
  if(!confirm("Excluir este feedback? Essa ação não pode ser desfeita.")) return;
  try{ await db.collection("feedbacks").doc(feedbackId).delete(); toast("Feedback excluído."); }
  catch(err){ console.error(err); toast("Erro ao excluir."); }
}
async function transcreverAudioFeedback(fbId, key){
  const fb = state.feedbacks.find(f=>f.id===fbId);
  const r = fb?.respostas?.[key];
  if(!r || r.tipo!=="audio") return;
  if(!temIA()){ toast("Configure a chave Gemini em Configurações."); return; }
  const box = document.getElementById(`transcricao-${fbId}-${key}`);
  if(box) box.textContent = "Transcrevendo...";
  const [meta, base64] = (r.url||"").split(",");
  const mimeType = meta?.match(/data:(.*);base64/)?.[1] || "audio/webm";
  const resultado = await callGeminiAudio(base64, mimeType, "Transcreva este áudio em português. Retorne apenas o texto transcrito, sem comentários.");
  if(box) box.textContent = resultado.texto || mensagemErroIA(resultado, "transcrever o áudio");
}

/* ---------- Formulário público (sem login) ---------- */
let feedbackParams = null;
let feedbackMensagemAgradecimento = "";
let feedbackRespostaState = {};
let feedbackMediaRecorder = null;
let feedbackRecChunks = [];
let feedbackRecTimer = null;
let feedbackRecSegundos = 0;
// os áudios vão embutidos (base64) dentro do próprio documento do Firestore — sem Storage, sem cartão.
// mas cada documento do Firestore tem limite de 1MB, então mantemos uma margem de segurança.
const FEEDBACK_LIMITE_BYTES = 900000; // ~900KB de folga sob o limite de 1MB por documento

function blobParaDataURL(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function estimarTamanhoTotalFeedback(){
  let total = 0;
  for(const item of FEEDBACK_ITENS){
    const st = feedbackRespostaState[item.key];
    if(!st) continue;
    if(st.modo==="audio" && st.blob) total += st.blob.size * 1.37; // overhead aproximado da codificação base64
    if(st.modo==="texto" && st.valor) total += st.valor.length;
  }
  return total;
}
function formatarMMSS(seg){
  const m = Math.floor(seg/60), s = seg%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function renderFeedbackPergunta(item){
  const st = feedbackRespostaState[item.key] || (feedbackRespostaState[item.key] = {modo:"texto"});
  const modo = st.modo || "texto";
  const isLivre = item.key === "livre";
  return `
    <div class="card" style="margin-bottom:16px;">
      ${isLivre
        ? `<div style="font-weight:600; margin-bottom:2px;">${item.texto}</div><div style="font-size:12px; color:var(--muted-2); margin-bottom:12px;">Opcional — um recado, elogio, ou qualquer coisa que não perguntamos acima.</div>`
        : `<div style="font-size:15px; margin-bottom:14px; line-height:1.5;">${item.texto}</div>`}
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button type="button" class="${modo==="texto"?"secondary":"ghost"} sm" style="flex:1;" onclick="toggleModoFeedback('${item.key}','texto')"><i class="ti ti-pencil"></i> Escrever</button>
        <button type="button" class="${modo==="audio"?"secondary":"ghost"} sm" style="flex:1;" onclick="toggleModoFeedback('${item.key}','audio')"><i class="ti ti-microphone"></i> Gravar áudio</button>
      </div>
      ${modo==="texto"
        ? `<textarea id="fb-texto-${item.key}" placeholder="Escreva sua resposta aqui..." oninput="feedbackRespostaState['${item.key}'].valor=this.value">${escapeHtml(st.valor||"")}</textarea>`
        : renderFeedbackAudioArea(item.key, st)}
    </div>
  `;
}
function renderFeedbackAudioArea(key, st){
  if(st.gravando){
    return `<div style="display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border-solid); border-radius:8px; padding:12px 14px;">
      <div style="width:10px; height:10px; border-radius:50%; background:var(--danger); flex-shrink:0;"></div>
      <div style="flex:1; font-size:13px; color:var(--muted);">Gravando...</div>
      <div id="fb-timer-${key}" style="font-size:13px; color:var(--muted);">0:00 / 2:00</div>
      <button type="button" class="sm danger" onclick="pararGravacaoFeedback('${key}')">Parar</button>
    </div>`;
  }
  if(st.url){
    return `<div style="display:flex; align-items:center; gap:10px;">
      <audio controls src="${st.url}" style="flex:1; height:36px;"></audio>
    </div>
    <button type="button" class="ghost sm" style="margin-top:8px;" onclick="regravarFeedback('${key}')">↺ Regravar</button>`;
  }
  return `<button type="button" class="secondary sm" onclick="iniciarGravacaoFeedback('${key}')"><i class="ti ti-microphone"></i> Começar a gravar</button>`;
}
function rerenderFeedbackPergunta(key){
  const item = FEEDBACK_ITENS.find(i=>i.key===key);
  const el = document.getElementById(`fb-card-${key}`);
  if(el && item) el.outerHTML = `<div id="fb-card-${key}">${renderFeedbackPergunta(item)}</div>`;
}
function toggleModoFeedback(key, modo){
  feedbackRespostaState[key] = feedbackRespostaState[key] || {};
  feedbackRespostaState[key].modo = modo;
  rerenderFeedbackPergunta(key);
}
async function iniciarGravacaoFeedback(key){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    feedbackRecChunks = [];
    let opcoes = { audioBitsPerSecond: 24000 }; // qualidade de voz, arquivo bem mais leve
    try{ feedbackMediaRecorder = new MediaRecorder(stream, opcoes); }
    catch(e){ feedbackMediaRecorder = new MediaRecorder(stream); } // navegador não aceitou as opções — usa o padrão
    feedbackMediaRecorder.ondataavailable = e=>{ if(e.data.size>0) feedbackRecChunks.push(e.data); };
    feedbackMediaRecorder.onstop = ()=>{
      const blob = new Blob(feedbackRecChunks, {type: feedbackMediaRecorder.mimeType || "audio/webm"});
      stream.getTracks().forEach(t=>t.stop());
      const st = feedbackRespostaState[key];
      st.gravando = false;
      st.blob = blob;
      st.duracaoSeg = feedbackRecSegundos;
      st.url = URL.createObjectURL(blob);
      rerenderFeedbackPergunta(key);
      if(estimarTamanhoTotalFeedback() > FEEDBACK_LIMITE_BYTES){
        toast("Suas respostas estão ficando grandes. Regrave essa mais curta ou troque alguma para texto antes de enviar.", 6000);
      }
    };
    feedbackMediaRecorder.start();
    feedbackRecSegundos = 0;
    const st = feedbackRespostaState[key] || (feedbackRespostaState[key] = {modo:"audio"});
    st.gravando = true;
    rerenderFeedbackPergunta(key);
    feedbackRecTimer = setInterval(()=>{
      feedbackRecSegundos++;
      const el = document.getElementById(`fb-timer-${key}`);
      if(el) el.textContent = `${formatarMMSS(feedbackRecSegundos)} / 2:00`;
      if(feedbackRecSegundos>=120) pararGravacaoFeedback(key);
    },1000);
  }catch(err){
    console.error("[feedback] erro ao acessar microfone:", err);
    toast("Não foi possível acessar o microfone. Verifique a permissão do navegador.");
  }
}
function pararGravacaoFeedback(key){
  clearInterval(feedbackRecTimer);
  if(feedbackMediaRecorder && feedbackMediaRecorder.state!=="inactive") feedbackMediaRecorder.stop();
}
function regravarFeedback(key){
  const st = feedbackRespostaState[key];
  if(st){ st.blob=null; st.url=null; }
  rerenderFeedbackPergunta(key);
}

function iniciarFeedbackPublico(){
  feedbackParams = new URLSearchParams(location.search);
  const nomeCtx = feedbackParams.get("nome") ? decodeURIComponent(feedbackParams.get("nome")) : "";
  const dataCtx = feedbackParams.get("data") || "";
  const tipoCtx = feedbackParams.get("tipo") || "";
  const clienteId = feedbackParams.get("c") || "";
  const eventoId = feedbackParams.get("e") || "";

  const contextoEl = document.getElementById("fb-contexto");
  const partes = [tipoCtx ? capitalize(tipoCtx.replace("_"," ")) : "", nomeCtx, dataCtx ? formatDate(dataCtx) : ""].filter(Boolean);
  contextoEl.innerHTML = (partes.length ? escapeHtml(partes.join(" · ")) : "Sua opinião ajuda demais o trabalho do Yuri!")
    + `<br><span style="font-size:12px; color:var(--muted-2);">🎙️ Nos áudios, prefira respostas de até 1 minuto.</span>`;

  const nomeWrap = document.getElementById("fb-nome-wrap");
  if(!clienteId && !eventoId){
    nomeWrap.innerHTML = `<div class="field"><label>Seu nome</label><input id="fb-seu-nome" type="text" placeholder="Como podemos te identificar?"></div>`;
  }

  document.getElementById("fb-perguntas").innerHTML = FEEDBACK_PERGUNTAS.map(item=>`<div id="fb-card-${item.key}">${renderFeedbackPergunta(item)}</div>`).join("");
  document.getElementById("fb-livre-wrap").innerHTML = `<div id="fb-card-livre">${renderFeedbackPergunta(FEEDBACK_ITENS.find(i=>i.key==="livre"))}</div>`;

  // busca a mensagem de agradecimento configurada — a página pública não passa pelo login,
  // então essa é uma leitura avulsa (precisa que a regra do Firestore permita leitura pública deste documento)
  db.collection("config").doc("settings").get()
    .then(doc=>{ feedbackMensagemAgradecimento = doc.exists ? (doc.data().mensagemAgradecimentoFeedback||"") : ""; })
    .catch(err=> console.warn("[feedback] não foi possível carregar a mensagem de agradecimento:", err));
}

async function enviarFeedbackPublico(){
  const clienteId = feedbackParams.get("c") || "";
  const eventoId = feedbackParams.get("e") || "";
  let nomeInformado = "";
  if(!clienteId && !eventoId){
    nomeInformado = document.getElementById("fb-seu-nome")?.value.trim() || "";
    if(!nomeInformado){ toast("Informe seu nome antes de enviar."); return; }
  }

  if(estimarTamanhoTotalFeedback() > FEEDBACK_LIMITE_BYTES){
    toast("Suas respostas em áudio estão grandes demais pra enviar. Regrave alguma mais curta ou troque para texto.", 6000);
    return;
  }

  const btn = document.getElementById("btn-enviar-feedback");
  if(btn){ btn.disabled = true; btn.textContent = "Enviando..."; }

  try{
    const respostas = {};
    for(const item of FEEDBACK_ITENS){
      const st = feedbackRespostaState[item.key] || {modo:"texto"};
      if(st.modo==="audio" && st.blob){
        const dataUrl = await blobParaDataURL(st.blob);
        respostas[item.key] = { tipo:"audio", url: dataUrl, duracaoSeg: st.duracaoSeg||0 };
      } else {
        const el = document.getElementById(`fb-texto-${item.key}`);
        const valor = el ? el.value.trim() : (st.valor||"").trim();
        respostas[item.key] = { tipo:"texto", valor };
      }
    }
    await db.collection("feedbacks").add({
      eventoId, clienteId, nomeInformado,
      contextoNome: feedbackParams.get("nome") ? decodeURIComponent(feedbackParams.get("nome")) : "",
      contextoData: feedbackParams.get("data") || "",
      respostas,
      criadoEm: new Date().toISOString(),
      revisado: false
    });
    const nomeCtx = feedbackParams.get("nome") ? decodeURIComponent(feedbackParams.get("nome")) : "";
    const nomeParaMensagem = nomeCtx || nomeInformado || "";
    const mensagemFinal = feedbackMensagemAgradecimento
      ? feedbackMensagemAgradecimento.replaceAll("{nome}", nomeParaMensagem)
      : `Obrigado${nomeParaMensagem?", "+nomeParaMensagem:""}! Sua resposta foi enviada com sucesso.`;

    const wrap = document.getElementById("fb-content-wrap");
    const telaSucessoHtml = `
      <div style="text-align:center; padding:70px 24px 40px; min-height:320px; display:flex; align-items:center; justify-content:center;">
        <div class="serif" style="font-size:20px; line-height:1.8; font-weight:500; white-space:pre-wrap;">${escapeHtml(mensagemFinal)}</div>
      </div>
    `;
    if(wrap){
      wrap.classList.add("fb-hidden");
      setTimeout(()=>{
        wrap.innerHTML = telaSucessoHtml;
        wrap.classList.remove("fb-hidden");
      }, 350);
    } else {
      document.getElementById("feedback-screen").innerHTML = `<div style="max-width:520px; margin:0 auto;">${telaSucessoHtml}</div>`;
    }
  }catch(err){
    console.error("[feedback] erro ao enviar:", err);
    const msgErro = (err && err.code==="invalid-argument") || (err && /longer than/i.test(err.message||""))
      ? "As respostas ficaram grandes demais para enviar (áudios longos). Regrave alguma mais curta ou troque para texto."
      : "Erro ao enviar. Tente novamente.";
    toast(msgErro, 6000);
    if(btn){ btn.disabled=false; btn.textContent="Enviar feedback"; }
  }
}

if(MODO_FEEDBACK){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("feedback-screen").style.display = "block";
  iniciarFeedbackPublico();
}
</script>
