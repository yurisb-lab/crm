<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio · CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" id="theme-color-meta" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM Estúdio">
<script>
  // aplica o tema salvo antes da pintura, pra evitar flash
  document.documentElement.setAttribute("data-theme", localStorage.getItem("crm-theme") || "dark");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>
  :root, [data-theme="dark"]{
    --bg:#000000;
    --surface:#0c0c0c;
    --surface-2:#1a1a1a;
    --border:#ffffff22;
    --border-solid:#2b2b2b;
    --text:#ffffff;
    --muted:#a3a3a3;
    --muted-2:#6b6b6b;
    --amber:#ffffff;
    --amber-dim:#ffffff1f;
    --nav-icon-active:#f0b429;
    --terracotta:#ffffff;
    --green:#ffffff;
    --danger:#ffffff;
    --radius:10px;
    font-size:16px;
  }
  [data-theme="light"]{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f0f0f0;
    --border:#00000022;
    --border-solid:#d9d9d9;
    --text:#000000;
    --muted:#5a5a5a;
    --muted-2:#8f8f8f;
    --amber:#000000;
    --amber-dim:#0000000f;
    --nav-icon-active:#b45309;
    --terracotta:#000000;
    --green:#000000;
    --danger:#000000;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--amber-dim);}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 0%, #241f16 0%, #16140f 60%);
  }
  .login-card{
    width:min(360px,90vw); padding:40px 32px; background:var(--surface);
    border:1px solid var(--border-solid); border-radius:var(--radius);
    box-shadow:0 30px 60px -30px #000;
  }
  .login-card .eyebrow{ letter-spacing:.14em; text-transform:uppercase; font-size:11px; color:var(--amber); margin-bottom:6px; }
  .login-card h1{ font-size:28px; margin:0 0 24px; font-weight:500; }
  .login-card input{ width:100%; margin-bottom:12px; }
  .login-card button{ width:100%; margin-top:8px; }
  #login-error{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }

  input, select, textarea{
    background:var(--surface-2); border:1px solid var(--border-solid); color:var(--text);
    padding:10px 12px; border-radius:7px; font-size:14px; font-family:'Inter',sans-serif;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--amber); }
  textarea{ resize:vertical; min-height:64px; width:100%; }
  label{ font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  button{
    cursor:pointer; border:1px solid var(--border-solid); background:var(--surface-2);
    color:var(--text); padding:9px 16px; border-radius:7px; font-size:14px; font-weight:500;
    transition:.15s;
  }
  button:hover{ border-color:var(--amber); }
  button.primary{ background:var(--amber); color:var(--bg); border-color:var(--amber); font-weight:600; }
  button.primary:hover{ filter:brightness(0.92); }
  button.danger{ background:transparent; color:var(--text); border-color:var(--text); }
  button.danger:hover{ background:var(--text); color:var(--bg); }
  button.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
  button.ghost:hover{ color:var(--text); border-color:var(--border-solid); }
  button.sm{ padding:5px 10px; font-size:12px; }

  /* ---------- LAYOUT ---------- */
  #app{ display:none; min-height:100vh; }
  #app.active{ display:flex; }

  #sidebar{
    width:230px; flex:0 0 230px; background:var(--surface);
    border-right:1px solid var(--border-solid);
    display:flex; flex-direction:column; padding:22px 14px;
    position:relative;
  }
  /* film perforation signature */
  #sidebar::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
    background-image:repeating-linear-gradient(to bottom, var(--amber) 0px, var(--amber) 6px, transparent 6px, transparent 18px);
    opacity:.55;
  }

  nav button img.nav-icon{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .brand-logo{ width:48px; height:48px; object-fit:contain; margin-bottom:6px; }
  .brand{ padding:4px 10px 22px; }
  .brand .eyebrow{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); }
  .brand h1{ font-size:21px; margin:2px 0 0; font-weight:500; }
  nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  nav button{
    text-align:left; background:transparent; border:none; color:var(--muted);
    padding:9px 12px; border-radius:7px; font-size:14px; display:flex; align-items:center; gap:10px;
    width:100%;
  }
  nav button .dot{ width:6px; height:6px; border-radius:50%; background:var(--muted-2); flex:0 0 auto; }
  nav button:hover{ background:var(--surface-2); color:var(--text); }
  nav button:hover img.nav-icon{ opacity:1; }
  nav button img.nav-icon{ opacity:.75; transition:.15s; }
  nav button.active{ background:var(--amber-dim); color:var(--amber); }
  nav button.active .dot{ background:var(--amber); }
  nav button.active img.nav-icon{ opacity:1; filter:drop-shadow(0 0 3px var(--amber)); }
  nav button.active .nav-icon-wrap i{ color:var(--nav-icon-active); filter:drop-shadow(0 0 3px var(--nav-icon-active)); }
  nav button[data-page="clientes"]{ margin-top:6px; }
  .nav-child-wrap{ margin-left:14px; padding-left:10px; border-left:1.5px solid var(--border-solid); }
  .nav-child-wrap button{ font-size:13px; color:var(--muted-2); padding:7px 10px; }
  .nav-child-wrap button:hover{ color:var(--text); }
  .nav-child-wrap button.active{ color:var(--amber); background:var(--amber-dim); }
  .nav-child-wrap:last-of-type{ margin-bottom:4px; }
  .sidebar-footer{ font-size:12px; color:var(--muted-2); padding:10px 12px; }
  .sidebar-footer .footer-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0;
    border-radius:50%; flex:0 0 auto; font-size:15px;
  }
  .sidebar-footer button.ghost{ width:auto; margin-top:0; }
  .sidebar-backdrop{ display:none; }

  /* mobile topbar (hidden on desktop) */
  #mobile-topbar{ display:none; }

  #main{ flex:1; padding:32px 40px; overflow-y:auto; height:100vh; }
  .page-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .page-header .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:4px; }
  .page-header h2{ font-size:26px; margin:0; font-weight:500; }
  .page-actions{ display:flex; gap:10px; }

  .grid{ display:grid; gap:16px; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:1100px){ .grid-3,.grid-4{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid-3,.grid-4{ grid-template-columns:1fr; } }

  /* ============ MOBILE LAYOUT (<900px) ============ */
  @media (max-width:900px){
    #app.active{ display:block; }
    #mobile-topbar{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      position:sticky; top:0; z-index:30; background:var(--surface);
      border-bottom:1px solid var(--border-solid); padding:14px 16px;
    }
    #mobile-topbar .brand-mini{ font-family:'Fraunces',serif; font-size:17px; }
    #mobile-topbar button{ padding:7px 10px; }

    #sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50; width:78vw; max-width:280px;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:20px 0 40px -10px #0008;
    }
    #sidebar.open{ transform:translateX(0); }
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:#0c0a07b3; z-index:40;
    }
    .sidebar-backdrop.open{ display:block; }

    #main{ padding:18px 16px 60px; height:auto; }
    .page-header h2{ font-size:22px; }
    table{ font-size:13px; }
    thead th, tbody td{ padding:8px 6px; }
    .modal{ padding:20px; }
    .field-row{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--surface); border:1px solid var(--border-solid); border-radius:var(--radius);
    padding:18px 20px; box-shadow:0 10px 24px -18px rgba(0,0,0,.55);
  }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .stat-card .value{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; letter-spacing:-.01em; }
  .stat-card .sub{ font-size:12px; color:var(--muted-2); margin-top:4px; }
  .stat-card.stat-card-primary{ background:var(--surface-2); border-color:var(--border-solid); }
  .stat-card.stat-card-primary .value{ font-size:32px; }

  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 12px;
    font-weight:700; display:flex; align-items:center; gap:10px;
  }
  .section-title::after{ content:""; flex:1; height:1px; background:var(--border); }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  .card table{ min-width:320px; } /* garante scroll horizontal em vez de cortar */
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-2);
    padding:8px 10px; border-bottom:1px solid var(--border-solid);
  }
  tbody td{ padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover{ background:var(--surface-2); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }

  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; border:1px solid var(--border-solid); }
  .badge.lead{ background:transparent; color:var(--muted-2); border-style:dashed; }
  .badge.confirmado{ background:color-mix(in srgb, var(--text) 14%, transparent); color:var(--text); }
  .badge.realizado{ background:color-mix(in srgb, var(--text) 45%, transparent); color:var(--text); }
  .badge.entregue{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .badge.lead-contatado{ background:color-mix(in srgb, var(--text) 14%, transparent); color:var(--text); }
  .badge.lead-negociando{ background:color-mix(in srgb, var(--text) 32%, transparent); color:var(--text); }
  .badge.lead-convertido{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .badge.lead-perdido{ background:transparent; color:var(--muted-2); border-style:dashed; text-decoration:line-through; }
  .tag-chip{ display:inline-block; background:var(--surface-2); border:1px solid var(--border-solid); color:var(--muted); font-size:11px; padding:2px 8px; border-radius:20px; margin:2px 3px 0 0; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted-2); }
  .empty-state .serif{ font-size:18px; color:var(--muted); margin-bottom:6px; }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:#0c0a07cc; display:none; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal-backdrop.active{ display:flex; }
  .modal{
    width:min(560px,100%); max-height:88vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--border-solid); border-radius:var(--radius); padding:26px 28px;
  }
  .modal h3{ font-size:20px; margin:0 0 18px; font-weight:500; }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;
    margin-top:18px; border-top:1px solid var(--border); padding-top:16px;
  }
  @media(max-width:480px){
    .modal-actions{ flex-direction:column-reverse; }
    .modal-actions button{ width:100%; text-align:center; }
  }

  .view-row{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; flex-wrap:wrap; }
  .view-row:last-child{ border-bottom:none; }
  .view-label{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; flex:0 0 auto; padding-top:2px; min-width:80px; }
  .view-value{ text-align:right; max-width:100%; word-break:break-word; }
  .view-value a{ color:var(--text); text-decoration:underline; }
  @media(max-width:480px){
    .view-row{ flex-direction:column; gap:4px; }
    .view-value{ text-align:left; }
  }
  .view-link-card{
    display:block; text-align:left; width:100%; background:var(--surface-2); border:1px solid var(--border-solid);
    border-radius:8px; padding:10px 12px; margin-top:6px; cursor:pointer; font-size:13px;
  }
  .view-link-card:hover{ border-color:var(--text); }
  .view-section-title{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 0 8px; }
  .btn-row-responsive{ display:flex; gap:8px; flex-wrap:wrap; }
  @media(max-width:480px){
    .btn-row-responsive{ flex-direction:column; }
    .btn-row-responsive button{ width:100%; text-align:center; }
  }

  .chat-container{ display:flex; flex-direction:column; height:calc(100vh - 160px); min-height:400px; }
  .chat-container.empty{ height:auto; min-height:200px; }
  .chat-messages{ flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; gap:12px; }
  .chat-bubble{ max-width:85%; padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.6; }
  .chat-bubble.user{ align-self:flex-end; background:var(--text); color:var(--bg); border-bottom-right-radius:4px; }
  .chat-bubble.ai{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border-solid); border-bottom-left-radius:4px; }
  .chat-bubble.ai .ai-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
  .chat-bubble.thinking{ opacity:.6; }
  .chat-input-row{ display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-solid); }
  .chat-input-row textarea{ flex:1; min-height:48px; max-height:120px; font-size:14px; resize:none; }
  .chat-suggestions{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chat-suggestion{ font-size:12px; padding:6px 12px; border-radius:20px; cursor:pointer; background:var(--surface-2); border:1px solid var(--border-solid); color:var(--muted); }
  .chat-suggestion:hover{ border-color:var(--text); color:var(--text); }

  /* ---- CORES DE EVENTOS (calendário e badges) ---- */
  :root{ --cor-aniversario:#f97316; --cor-batizado:#06b6d4; --cor-casamento:#a855f7; --cor-ensaio:#3b82f6; --cor-outro:#6b7280; }
  .ev-chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
  .ev-chip.aniversario{ background:var(--cor-aniversario); }
  .ev-chip.batizado{ background:var(--cor-batizado); }
  .ev-chip.casamento_civil,.ev-chip.casamento_religioso{ background:var(--cor-casamento); }
  .ev-chip.ensaio{ background:var(--cor-ensaio); }
  .ev-chip.outro{ background:var(--cor-outro); }

  /* ---- CALENDÁRIO ---- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-nav h3{ font-family:'Fraunces',serif; font-size:20px; margin:0; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-header-day{ text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:6px 0; }
  .cal-day{
    min-height:72px; background:var(--surface-2); border-radius:6px; padding:6px;
    cursor:pointer; position:relative; transition:.15s;
  }
  .cal-day:hover{ background:var(--border-solid); }
  .cal-day.other-month{ opacity:.3; }
  .cal-day.today{ outline:2px solid var(--text); outline-offset:-2px; }
  .cal-day.blocked{ background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,var(--border-solid) 4px,var(--border-solid) 8px); }
  .cal-day.prereservado:not(.blocked){
    outline:2px dashed #eab308; outline-offset:-2px;
  }
  .pre-chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:11px; font-weight:600; background:#eab308; color:#000; }
  .cal-day-num{ font-size:12px; font-weight:600; margin-bottom:4px; }
  .cal-day-events{ display:flex; flex-direction:column; gap:2px; }
  .cal-ev{ font-size:10px; padding:1px 5px; border-radius:3px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-ev.aniversario{ background:var(--cor-aniversario); }
  .cal-ev.batizado{ background:var(--cor-batizado); }
  .cal-ev.casamento_civil,.cal-ev.casamento_religioso{ background:var(--cor-casamento); }
  .cal-ev.ensaio{ background:var(--cor-ensaio); }
  .cal-ev.outro{ background:var(--cor-outro); }
  .cal-legend{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; font-size:11px; }
  .cal-legend-item{ display:flex; align-items:center; gap:4px; }
  .cal-legend-dot{ width:10px; height:10px; border-radius:50%; }
  @media(max-width:900px){
    .cal-day{ min-height:44px; padding:3px; }
    .cal-day-num{ font-size:11px; }
    .cal-ev{ display:none; } /* no mobile mostra só o ponto */
    .cal-day.has-events::after{ content:'•'; position:absolute; bottom:3px; right:5px; font-size:14px; color:var(--amber); }
  }

  /* ---- AÇÕES RÁPIDAS ---- */
  .quick-actions{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; padding:12px; background:var(--surface-2); border-radius:8px; }
  .quick-actions button{ font-size:13px; padding:8px 12px; }

  .comentario-item{ padding:10px 0; border-bottom:1px solid var(--border); }
  .comentario-item:last-child{ border-bottom:none; }
  .comentario-data{ font-size:11px; color:var(--muted-2); margin-bottom:4px; }
  .comentario-texto{ font-size:13px; line-height:1.5; }
  .comentario-input-row{ display:flex; gap:8px; margin-top:10px; }
  .comentario-input-row textarea{ flex:1; min-height:48px; font-size:13px; }
  .ai-box{ background:var(--surface-2); border:1px solid var(--border-solid); border-radius:8px; padding:14px; margin-top:10px; font-size:13px; line-height:1.6; }
  .ai-box .ai-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }

  .meta-ring-wrap{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .meta-ring{ position:relative; width:100px; height:100px; flex-shrink:0; }
  .meta-ring svg{ transform:rotate(-90deg); }
  .meta-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .meta-ring-pct{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; line-height:1; }
  .meta-ring-sub{ font-size:10px; color:var(--muted); margin-top:2px; }
  .meta-info{ flex:1; min-width:120px; }
  .meta-info .meta-row{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px solid var(--border); }
  .meta-info .meta-row:last-child{ border-bottom:none; }
  .meta-info .meta-row b{ font-weight:600; }

  .nav-icon-wrap{
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:18px; line-height:1;
  }
  .nav-icon-wrap svg, .nav-icon-wrap i{ transition:opacity .15s; opacity:.8; }
  nav button:hover .nav-icon-wrap svg, nav button:hover .nav-icon-wrap i{ opacity:1; }
  nav button.active .nav-icon-wrap svg, nav button.active .nav-icon-wrap i{ opacity:1; }
  .nav-icon-wrap i{ font-size:18px; }
  #toast{
    position:fixed; bottom:24px; right:24px; background:var(--surface-2); border:1px solid var(--amber);
    color:var(--text); padding:12px 18px; border-radius:8px; font-size:13px; z-index:99; display:none;
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="eyebrow">Estúdio</div>
    <h1>Acessar o CRM</h1>
    <div class="field"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@email.com"></div>

function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("crm-theme", next);
  updateThemeIcon();
}
function updateThemeIcon(){
  const isDark = (document.documentElement.getAttribute("data-theme")||"dark") === "dark";
  document.querySelectorAll(".theme-toggle").forEach(b=> b.textContent = isDark ? "🌙" : "☀️");
  const meta = document.getElementById("theme-color-meta");
  if(meta) meta.setAttribute("content", isDark ? "#000000" : "#ffffff");
}
function openSidebarMobile(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-backdrop").classList.add("open");
}
function closeSidebarMobile(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-backdrop").classList.remove("open");
}

}

function toast(msg, duracao=2600){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.style.display = "none", duracao);
}

/* =========================================================

function doLogin(){
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const errorEl = document.getElementById("login-error");
  const btn = document.querySelector("#login-screen button.primary");
  errorEl.textContent = "";
  btn.disabled = true; btn.textContent = "Entrando...";
  console.log("[login] tentando autenticar:", email);
  auth.signInWithEmailAndPassword(email, pass)
    .then(cred=>{
      console.log("[login] sucesso:", cred.user.email);
    })
    .catch(err=>{
      console.error("[login] erro:", err.code, err.message);
      errorEl.textContent = `Erro: ${err.code || err.message}`;
    })
    .finally(()=>{
      btn.disabled = false; btn.textContent = "Entrar";
    });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").classList.add("active");
    document.getElementById("user-email").textContent = user.email;
    startListeners();
    buildNav();
    renderPage("dashboard");
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").classList.remove("active");
    listeners.forEach(unsub=>unsub());
  }
});

/* =========================================================
   FIRESTORE LIVE LISTENERS
   ========================================================= */
function startListeners(){
  ["leads","clientes","criancas","casamentos","eventos","produtos","pagamentos","recibos","bloqueios","negociacoes","prereservas"].forEach(col=>{
    const unsub = db.collection(col).onSnapshot(
      snap=>{
        state[col] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        invalidarCrmContextCache();
        renderPage(state.currentPage);
      },
      err=>{
        console.error(`[firestore] erro na coleção "${col}":`, err.code, err.message);
        toast(`Erro ao acessar "${col}": ${err.code}`);
      }
    );
    listeners.push(unsub);
  });

  const unsubConfig = db.collection("config").doc("settings").onSnapshot(
    doc=>{
      state.config = doc.exists ? doc.data() : {};
      // re-renderiza qualquer página que use dados de config
      const paginasConfig = ["configuracoes","dashboard","pagamentos","relatorios"];
      if(paginasConfig.includes(state.currentPage)) renderPage(state.currentPage);
    },
    err=>{
      console.error("[firestore] erro em \"config\":", err.code, err.message);
      toast(`Erro ao acessar configurações: ${err.code}`);
    }
  );
  listeners.push(unsubConfig);
}

/* =========================================================
   HELPERS
   ========================================================= */
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
const STATUS_LABELS = {
  confirmado:"Confirmado", realizado:"Realizado", entregue:"Entregue"
};
function statusLabel(s){ return STATUS_LABELS[s] || capitalize(s); }

const NEGOCIACAO_STATUS_LABELS = {
  negociacao:"Em negociação", fechado:"Fechado", perdido:"Perdido"
};
function negociacaoStatusLabel(s){ return NEGOCIACAO_STATUS_LABELS[s] || capitalize(s||"negociacao"); }

/* ---------- Status do relacionamento (calculado, não é campo salvo) ----------
   Lead: nunca teve evento concluído (realizado/entregue).
   Cliente Recorrente: 2+ eventos concluídos.
   Cliente Ativo: exatamente 1 evento concluído, há até 24 meses.
   Cliente Inativo: exatamente 1 evento concluído, há mais de 24 meses.
   Isso é independente do status de negociação atual (que é temporário/pontual). */
const RELACIONAMENTO_LABELS = { lead:"Lead", ativo:"Cliente Ativo", inativo:"Cliente Inativo", recorrente:"Cliente Recorrente" };
const RELACIONAMENTO_CORES = { lead:"var(--muted-2)", ativo:"#22c55e", inativo:"#ef4444", recorrente:"#a855f7" };
function mesesDesde(dataStr){
  if(!dataStr) return Infinity;
  const inicio = new Date(dataStr+"T00:00:00");
  const hoje = new Date();
  return (hoje.getFullYear()-inicio.getFullYear())*12 + (hoje.getMonth()-inicio.getMonth());
}
function eventosConcluidosCliente(clienteId){
  return state.eventos
    .filter(e=>e.clienteId===clienteId && ["realizado","entregue"].includes(e.status||""))
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""));
}
function statusRelacionamentoCliente(clienteId){
  const concluidos = eventosConcluidosCliente(clienteId);
  if(concluidos.length===0) return "lead";
  if(concluidos.length>=2) return "recorrente";
  return mesesDesde(concluidos[0].data) <= 24 ? "ativo" : "inativo";
}
function badgeRelacionamento(clienteId){
  const s = statusRelacionamentoCliente(clienteId);
  return `<span class="badge" style="border-color:${RELACIONAMENTO_CORES[s]};color:${RELACIONAMENTO_CORES[s]}">${RELACIONAMENTO_LABELS[s]}</span>`;
}
function negociacaoAtualCliente(clienteId){
  const abertas = state.negociacoes
    .filter(n=>n.clienteId===clienteId && !["fechado","perdido"].includes(n.status||"negociacao"))
    .sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  return abertas[0] || null;
}
function money(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatDate(v){
  if(!v) return "—";
  const [y,m,d] = v.split("-");
  return d ? `${d}/${m}/${y}` : v;
}
function nomeRef(col, id){
  const item = state[col]?.find(i=>i.id===id);
  if(!item) return "—";
  if(col==="clientes" && item.nomeConjuge) return `${item.nome} & ${item.nomeConjuge}`;
  if(col==="casamentos") return item.conjuge ? `${item.nomeCasal} & ${item.conjuge}` : item.nomeCasal;
  return item.nome;
}
function labelEvento(id){
  const ev = state.eventos.find(e=>e.id===id);
  if(!ev) return "—";
  return `${capitalize((ev.tipo||"").replace("_"," "))} · ${formatDate(ev.data)} · ${nomeRef("clientes",ev.clienteId)}`;
}
function idadeAtual(dataNasc){
  if(!dataNasc) return "—";
  const hoje = new Date(); const nasc = new Date(dataNasc+"T00:00:00");
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAniversario = (hoje.getMonth()<nasc.getMonth()) || (hoje.getMonth()===nasc.getMonth() && hoje.getDate()<nasc.getDate());
  if(aindaNaoFezAniversario) idade--;
  return idade;
}
function idadeNaData(dataNasc, dataRef){
  if(!dataNasc || !dataRef) return "—";
  const ref = new Date(dataRef+"T00:00:00"); const nasc = new Date(dataNasc+"T00:00:00");
  let idade = ref.getFullYear() - nasc.getFullYear();
  const aindaNao = (ref.getMonth()<nasc.getMonth()) || (ref.getMonth()===nasc.getMonth() && ref.getDate()<nasc.getDate());
  if(aindaNao) idade--;
  return idade;
}
function tempoDesde(dataStr){
  if(!dataStr) return "—";
  const inicio = new Date(dataStr+"T00:00:00");
  const hoje = new Date();
  let anos = hoje.getFullYear() - inicio.getFullYear();
  let meses = hoje.getMonth() - inicio.getMonth();
  if(hoje.getDate() < inicio.getDate()) meses--;
  if(meses < 0){ anos--; meses += 12; }
  if(anos<=0 && meses<=0) return "menos de 1 mês";
  const partes = [];
  if(anos>0) partes.push(`${anos} ano${anos>1?"s":""}`);
  if(meses>0) partes.push(`${meses} ${meses>1?"meses":"mês"}`);
  return partes.join(" e ");
}
function diasParaAniversario(dataNasc){
  if(!dataNasc) return "—";
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const nasc = new Date(dataNasc+"T00:00:00");
  let prox = new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate());
  if(prox < hoje) prox = new Date(hoje.getFullYear()+1, nasc.getMonth(), nasc.getDate());
  return Math.round((prox - hoje) / 86400000);
}
function isMesmoMes(dataStr){
  if(!dataStr) return false;
  const hoje = new Date(); const d = new Date(dataStr+"T00:00:00");
  return hoje.getFullYear()===d.getFullYear() && hoje.getMonth()===d.getMonth();
}
function totalPago(eventoId){
  return state.pagamentos.filter(p=>p.eventoId===eventoId).reduce((s,p)=>s+(Number(p.valor)||0),0);
}
function totalPagoProduto(produtoId){
  return state.pagamentos.filter(p=>p.produtoId===produtoId).reduce((s,p)=>s+(Number(p.valor)||0),0);
}

/* ---------- Ordenação de colunas (tabelas de cadastro: clientes, aniversariantes, casamentos...) ---------- */
function compararValores(a, b){
  if(typeof a === "number" && typeof b === "number") return a - b;
  return String(a ?? "").localeCompare(String(b ?? ""), "pt-BR", {numeric:true});
}
const collectionSort = {};
function toggleOrdenacaoColuna(col, key){
  const schema = SCHEMAS[col];
  const atual = collectionSort[col] || { key: schema.columns[0].key, dir: 1 };
  if(atual.key === key) atual.dir *= -1;
  else { atual.key = key; atual.dir = 1; }
  collectionSort[col] = atual;
  renderCollectionList(col);
}

/* ---------- EVENTOS: visão em pilha por ano + filtro por tipo/tag ---------- */
let eventosFiltroTipo = "";
let eventosFiltroTag = "";
let expandedYears = null; // inicializado com o ano mais recente aberto

function renderEventosPage(main){

  main.innerHTML = `

      <div class="page-actions">
        <input type="text" id="filtro-tag-evento" placeholder="Buscar cliente, aniversariante, tag, endereço..." value="${eventosFiltroTag}"
          oninput="eventosFiltroTag=this.value; renderEventosList();" style="width:220px;">
        <select id="filtro-tipo-evento" onchange="eventosFiltroTipo=this.value; renderEventosList();" style="width:auto;">
          <option value="">Todos os tipos</option>
          ${todosOsTipos.map(t=>`<option value="${t}" ${eventosFiltroTipo===t?"selected":""}>${capitalize(t.replace("_"," "))}</option>`).join("")}
        </select>
        ${temIA() ? `<button class="ghost" onclick="criarEventoPorFoto()">📸 Criar por foto (IA)</button>` : ""}
        <button class="ghost" onclick="triggerLoteFotosUpload()">📸 Criar em lote (fotos)</button>
        <button class="primary" onclick="openForm('eventos')">+ Novo Evento</button>
      </div>
    </div>
    <div id="eventos-list-container"></div>
  `;
  renderEventosList();
}

function renderEventosList(){
  const container = document.getElementById("eventos-list-container");
  if(!container) return;
  const schema = SCHEMAS.eventos;

  let itens = [...state.eventos];
  if(eventosFiltroTipo) itens = itens.filter(e=>e.tipo===eventosFiltroTipo);
  if(eventosFiltroTag.trim()){
    const termo = eventosFiltroTag.trim().toLowerCase();
    itens = itens.filter(e=>{
      // tags
      if((e.tags||[]).some(t=>t.toLowerCase().includes(termo))) return true;
      // nome do cliente
      const cli = state.clientes.find(c=>c.id===e.clienteId);
      if(cli && (cli.nome||"").toLowerCase().includes(termo)) return true;
      if(cli && (cli.nomeConjuge||"").toLowerCase().includes(termo)) return true;
      // nome da criança vinculada
      const crianca = e.criancaId ? state.criancas.find(c=>c.id===e.criancaId) : null;
      if(crianca && (crianca.nome||"").toLowerCase().includes(termo)) return true;
      // nome do evento
      if((e.nomeEvento||"").toLowerCase().includes(termo)) return true;
      // endereço
      if((e.endereco||"").toLowerCase().includes(termo)) return true;
      // tipo de evento
      if((e.tipo||"").replace("_"," ").includes(termo)) return true;
      // status
      if(statusLabel(e.status||"confirmado").toLowerCase().includes(termo)) return true;
      // descrição de "outro"
      if((e.outroDescricao||"").toLowerCase().includes(termo)) return true;
      return false;
    });
  }

  // agrupa por ano (a partir da data do evento; sem data vai pra "Sem data")
  const porAno = {};
  itens.forEach(ev=>{
    const ano = ev.data ? ev.data.slice(0,4) : "Sem data";
    if(!porAno[ano]) porAno[ano] = [];
    porAno[ano].push(ev);
  });
  const anos = Object.keys(porAno).sort((a,b)=> b.localeCompare(a));

  if(expandedYears === null){
    expandedYears = new Set(anos.length ? [anos[0]] : []);
  }

  container.innerHTML = anos.length ? anos.map(ano=>renderAnoStack(ano, porAno[ano], schema)).join("") : `
    <div class="card"><div class="empty-state"><div class="serif">Nada encontrado</div>Tente outro filtro ou cadastre um novo evento.</div></div>
  `;
}

function renderAnoStack(ano, eventosDoAno, schema){
  const isOpen = expandedYears.has(ano);
  const ordenados = [...eventosDoAno].sort((a,b)=> (b.data||"").localeCompare(a.data||""));
  const totalValor = eventosDoAno.reduce((s,e)=> s + (Number(e.valorContratado)||0), 0);

  return `
    <div class="card" style="padding:0; margin-bottom:14px; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer;" onclick="toggleAno('${ano}')">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-family:'Fraunces',serif; font-size:18px;">${isOpen?'▾':'▸'} ${ano}</span>
          <span style="font-size:12px; color:var(--muted);">${eventosDoAno.length} evento${eventosDoAno.length===1?'':'s'} · ${money(totalValor)}</span>
        </div>
        <span style="font-size:12px; color:var(--muted-2);">${isOpen?'recolher':'expandir'}</span>
      </div>
      ${isOpen ? `
        <div style="overflow-x:auto; border-top:1px solid var(--border-solid);">
          <table>
            <thead><tr>${schema.columns.map(c=>`<th>${c.label}</th>`).join("")}<th></th></tr></thead>
            <tbody>
              ${ordenados.map(item=>`
                <tr>
                  ${schema.columns.map(c=>`<td>${c.format ? c.format(item[c.key],item) : (item[c.key] ?? "—")}</td>`).join("")}
                  <td class="row-actions">
                    <button class="sm" onclick="openView('eventos','${item.id}')">Ver</button>
                    <button class="sm" onclick="openForm('eventos','${item.id}')">Editar</button>
                    <button class="sm danger" onclick="deleteDoc('eventos','${item.id}')">Excluir</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      ` : ""}
    </div>
  `;
}

function toggleAno(ano){
  if(expandedYears.has(ano)) expandedYears.delete(ano);
  else expandedYears.add(ano);
  renderEventosList();
}

function renderPage(page){
  state.currentPage = page;
  setActiveNav(page);
  closeSidebarMobile();
  const main = document.getElementById("main");
  if(page==="dashboard") return renderDashboard(main);
  if(page==="eventos") return renderEventosPage(main);
  if(page==="agenda") return renderAgenda(main);
  if(page==="leads") return renderLeadsPage(main);
  if(page==="negociacoes") return renderNegociacoesPage(main);
  if(page==="produtos") return renderProdutosPage(main);
  if(page==="relatorios") return renderRelatorios(main);
  if(page==="conversar") return renderConversar(main);
  if(page==="configuracoes") return renderConfiguracoes(main);
  return renderCollectionPage(main, page);
}

  if(geminiEl && geminiEl.value!=="") configDraft.geminiKey = geminiEl.value.trim();

  const msgAnivEl = document.getElementById("msg-aniversario");
  if(msgAnivEl) configDraft.mensagemAniversario = msgAnivEl.value;

  const msgCasEl = document.getElementById("msg-casamento");
  if(msgCasEl) configDraft.mensagemCasamento = msgCasEl.value;

  if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
  try{
    // aguarda a confirmação real do servidor antes de avisar que salvou —
    // evita que um refresh prematuro descarte uma gravação ainda em andamento
    await db.collection("config").doc("settings").set(configDraft, {merge:true});
    toast("Configurações salvas. Pode atualizar a página com segurança.");
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Salvar"; }
  }
}
function proximaDataAniversario(dataNasc){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const nasc = new Date(dataNasc+"T00:00:00");
  let prox = new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate());
  if(prox < hoje) prox = new Date(hoje.getFullYear()+1, nasc.getMonth(), nasc.getDate());
  return prox;
}
function montarMensagemAniversario(criancaId){
  const c = state.criancas.find(x=>x.id===criancaId);
  if(!c) return null;
  const template = state.config.mensagemAniversario || "";
  if(!template) return { erro: "Cadastre a mensagem em Configurações primeiro." };
  const responsavelId = c.clientePaiId || c.clienteMaeId;
  const cliente = responsavelId ? state.clientes.find(x=>x.id===responsavelId) : null;
  const idade = idadeAtual(c.dataNascimento) + 1;
  const dataFormatada = proximaDataAniversario(c.dataNascimento).toLocaleDateString('pt-BR');
  const texto = template
    .replaceAll("{nome}", c.nome||"")
    .replaceAll("{idade}", String(idade))
    .replaceAll("{data}", dataFormatada)
    .replaceAll("{responsavel}", cliente ? cliente.nome : "");
  return { texto, cliente };
}
function enviarMensagemAniversario(criancaId){
  const resultado = montarMensagemAniversario(criancaId);
  if(!resultado) return;
  if(resultado.erro){ toast(resultado.erro); return; }
  abrirModalEnvioMensagem(resultado.texto, resultado.cliente, `Aniversário de ${state.criancas.find(c=>c.id===criancaId)?.nome||""}`);
}
function montarMensagemCasamento(casamentoId){
  const c = state.casamentos.find(x=>x.id===casamentoId);
  if(!c) return null;
  const template = state.config.mensagemCasamento || "";
  if(!template) return { erro: "Cadastre a mensagem de casamento em Configurações primeiro." };
  const cliente = c.clienteId ? state.clientes.find(x=>x.id===c.clienteId) : null;
  const anos = idadeAtual(c.dataCasamento) + 1;
  const dataFormatada = proximaDataAniversario(c.dataCasamento).toLocaleDateString('pt-BR');
  const texto = template
    .replaceAll("{nomeCasal}", c.nomeCasal ? (c.conjuge ? `${c.nomeCasal} & ${c.conjuge}` : c.nomeCasal) : "")
    .replaceAll("{anos}", String(anos))
    .replaceAll("{data}", dataFormatada);
  return { texto, cliente };
}
function enviarMensagemCasamento(casamentoId){
  const resultado = montarMensagemCasamento(casamentoId);
  if(!resultado) return;
  if(resultado.erro){ toast(resultado.erro); return; }
  const c = state.casamentos.find(x=>x.id===casamentoId);
  abrirModalEnvioMensagem(resultado.texto, resultado.cliente, `Bodas de ${c?.nomeCasal||""}`);
}

let chatHistory = [];

// ---- cache do contexto enviado à IA no chat "Conversar" ----
// evita remontar o texto (clientes, eventos, leads etc.) a cada pergunta;
// só reconstrói quando algum dado relevante muda no Firestore.
let _crmContextCache = null;
let _crmContextDirty = true;
function invalidarCrmContextCache(){ _crmContextDirty = true; }
function getCrmContext(){
  if(_crmContextDirty || !_crmContextCache){
    _crmContextCache = buildCrmContext();
    _crmContextDirty = false;
  }
  return _crmContextCache;
}

function buildCrmContext(){
  const hoje = new Date().toISOString().slice(0,10);
  // limita o histórico de eventos considerado pela IA aos últimos 5 anos,
  // pra manter o contexto mais enxuto e a resposta mais rápida
  const anoLimiteContexto = new Date().getFullYear() - 5;
  const dataLimiteContexto = `${anoLimiteContexto}-01-01`;

  // Resumo financeiro
  const totalContratado = state.eventos.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const totalRecebido = state.pagamentos.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const aReceber = state.eventos.reduce((s,e)=>s+Math.max((Number(e.valorContratado)||0)-totalPago(e.id),0),0);
  const anoAtual = new Date().getFullYear();
  const recebidoAno = state.pagamentos.filter(p=>(p.data||"").startsWith(String(anoAtual))).reduce((s,p)=>s+(Number(p.valor)||0),0);

  // Clientes — completo: todos os comentários, filhos vinculados, bodas próximas, histórico de eventos
  const clientesCtx = state.clientes.map(c=>{
    const evs = state.eventos.filter(e=>e.clienteId===c.id).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    const ultEv = evs[0];
    const proxEv = evs.filter(e=>e.data>=hoje).sort((a,b)=>(a.data||"").localeCompare(b.data||""))[0];

    // filhos vinculados com idade e próximo aniversário
    const filhos = state.criancas.filter(cr=>cr.clientePaiId===c.id||cr.clienteMaeId===c.id);
    const filhosStr = filhos.map(cr=>{
      const dias = diasParaAniversario(cr.dataNascimento);
      const idadeProx = idadeAtual(cr.dataNascimento)+1;
      return `${cr.nome} (faz ${idadeProx} anos em ${dias} dias)`;
    }).join(", ");

    // casamento vinculado
    const casamento = state.casamentos.find(cs=>cs.clienteId===c.id);
    const casamentoStr = casamento ? `casados há ${idadeAtual(casamento.dataCasamento)} anos, próximas bodas em ${diasParaAniversario(casamento.dataCasamento)} dias` : "";

    // todos os comentários (sem limite)
    const comentarios = (c.comentarios||[]).sort((a,b)=>(a.criadoEm||"").localeCompare(b.criadoEm||"")).map(x=>`[${formatarDataHora(x.criadoEm)}] ${x.texto}`).join(" | ");

    // histórico resumido de eventos (últimos 5 anos, no máximo 8 mais recentes)
    const historicoEvs = evs.filter(e=>(e.data||"")>=dataLimiteContexto).slice(0,8).map(e=>`${capitalize((e.tipo||"").replace("_"," "))} ${formatDate(e.data)} (${statusLabel(e.status||"confirmado")})`).join(", ");

    const partes = [
      `${c.nome}${c.nomeConjuge?" & "+c.nomeConjuge:""}`,
      `origem:${c.origem||"?"}`,
      `cidade:${c.cidade||"?"}`,
      `${evs.length} evento(s)`,
      ultEv ? `último:${capitalize((ultEv.tipo||"").replace("_"," "))} ${formatDate(ultEv.data)} (${tempoDesde(ultEv.data)} atrás)` : "sem eventos",
      proxEv ? `próximo:${capitalize((proxEv.tipo||"").replace("_"," "))} ${formatDate(proxEv.data)}` : "",
      filhosStr ? `filhos:[${filhosStr}]` : "",
      casamentoStr ? `casamento:[${casamentoStr}]` : "",
      historicoEvs ? `histórico:[${historicoEvs}]` : "",
      comentarios ? `notas:[${comentarios}]` : "",
      c.observacoes ? `obs:[${c.observacoes}]` : "",
    ].filter(Boolean);
    return partes.join(" | ");
  }).join("\n");

  // Eventos — incluindo data de entrega e bloqueio (limitado aos últimos 5 anos)
  const eventosCtx = state.eventos.filter(e=>(e.data||"")>=dataLimiteContexto).map(e=>{
    const saldo = (Number(e.valorContratado)||0)-totalPago(e.id);
    const crianca = e.criancaId ? state.criancas.find(c=>c.id===e.criancaId) : null;
    return [
      formatDate(e.data),
      capitalize((e.tipo||"").replace("_"," "))+(e.outroDescricao?" ("+e.outroDescricao+")":""),
      `cliente:${nomeRef("clientes",e.clienteId)}`,
      crianca ? `criança:${crianca.nome}` : "",
      `valor:${money(e.valorContratado)}`,
      saldo>0 ? `saldo:${money(saldo)}` : "pago",
      `status:${statusLabel(e.status||"confirmado")}`,
      e.dataEntregaPrevista ? `entrega:${formatDate(e.dataEntregaPrevista)}` : "",
      e.bloqueado ? "BLOQUEADO" : "",
      e.fotoLida ? "DATA-VERIFICADA" : "",
    ].filter(Boolean).join(" | ");
  }).sort((a,b)=>b.localeCompare(a)).join("\n");

  // Leads — todos os comentários
  const leadsCtx = state.leads.map(l=>{
    const lbl = {negociando:"Negociando",convertido:"Convertido",perdido:"Perdido"};
    const comentarios = (l.comentarios||[]).sort((a,b)=>(a.criadoEm||"").localeCompare(b.criadoEm||"")).map(x=>`[${formatarDataHora(x.criadoEm)}] ${x.texto}`).join(" | ");
    const diasSemContato = (()=>{
      const ults = (l.comentarios||[]).map(c=>c.criadoEm||"").sort().reverse()[0];
      const ref = ults ? new Date(ults) : new Date(l.criadoEm||new Date());
      return Math.floor((new Date()-ref)/86400000);
    })();
    return [
      l.nome,
      `status:${lbl[l.status||"negociando"]}`,
      `interesse:${capitalize((l.interesseTipo||"?").replace("_"," "))}`,
      `origem:${l.origem||"?"}`,
      `sem contato há ${diasSemContato} dias`,
      comentarios ? `notas:[${comentarios}]` : "",
    ].filter(Boolean).join(" | ");
  }).join("\n");

  // Crianças — com filhos de quem + dias para aniversário
  const criancasCtx = state.criancas.map(c=>{
    const resp = nomeRef("clientes",c.clientePaiId||c.clienteMaeId||"");
    const prox = diasParaAniversario(c.dataNascimento);
    const idadeProx = idadeAtual(c.dataNascimento)+1;
    const obsStr = c.observacoes ? ` | obs:${c.observacoes}` : "";
    return `${c.nome} | nasc:${formatDate(c.dataNascimento)}${c.nascimentoAproximado?" (estimada)":""} | faz ${idadeProx} anos em ${prox} dias | responsável:${resp}${obsStr}`;
  }).join("\n");

  // Casamentos — com dias para bodas
  const casamentosCtx = state.casamentos.map(c=>{
    const anos = idadeAtual(c.dataCasamento);
    const prox = diasParaAniversario(c.dataCasamento);
    const cli = state.clientes.find(x=>x.id===c.clienteId);
    return `${c.nomeCasal}${c.conjuge?" & "+c.conjuge:""} | casados em:${formatDate(c.dataCasamento)} | ${anos} anos | próximas bodas em ${prox} dias | cliente:${cli?.nome||"?"}`;
  }).join("\n");

  // Negociações em aberto (status atual, separado do status de relacionamento do cliente)
  const negociacoesCtx = state.negociacoes.filter(n=>!["fechado","perdido"].includes(n.status||"negociacao")).map(n=>{
    return `${nomeRef("clientes",n.clienteId)} | interesse:${capitalize((n.tipoInteresse||"?").replace("_"," "))} | status:${negociacaoStatusLabel(n.status)}${n.valorProposto?` | valor proposto:${money(n.valorProposto)}`:""}`;
  }).join("\n");

  // Alertas ativos
  const alertas = calcularAlertas().map(a=>a.texto.replace(/<[^>]+>/g,"")).join("\n");

  return `Você é um assistente especializado do fotógrafo Yuri Silva (Yuri Silva Fotografias, Pacatuba/CE, Brasil). Responda perguntas sobre o negócio dele usando os dados abaixo. Seja direto, prático e informal. Cite nomes, valores e datas específicos. Se a informação não estiver nos dados, diga claramente.

DATA DE HOJE: ${hoje}

=== RESUMO FINANCEIRO ===
Total contratado (geral): ${money(totalContratado)}
Total recebido (geral): ${money(totalRecebido)}
Recebido em ${anoAtual}: ${money(recebidoAno)}
A receber: ${money(aReceber)}
Eventos: ${state.eventos.length} | Clientes: ${state.clientes.length} | Leads: ${state.leads.length}

=== ALERTAS ATIVOS ===
${alertas||"Nenhum alerta no momento."}

=== NEGOCIAÇÕES EM ABERTO (${state.negociacoes.filter(n=>!["fechado","perdido"].includes(n.status||"negociacao")).length}) ===
(status da negociação atual — diferente do status de relacionamento do cliente, que é Lead/Ativo/Inativo/Recorrente e é calculado a partir dos eventos concluídos)
${negociacoesCtx||"Nenhuma negociação em aberto no momento."}

=== CLIENTES (${state.clientes.length}) ===
(inclui histórico de eventos, filhos com próximos aniversários, casamentos e todas as anotações)
${clientesCtx||"Nenhum cliente cadastrado."}

=== EVENTOS (últimos 5 anos, a partir de ${dataLimiteContexto}; total histórico: ${state.eventos.length}) ===
${eventosCtx||"Nenhum evento cadastrado no período."}

=== LEADS (${state.leads.length}) ===
${leadsCtx||"Nenhum lead cadastrado."}

=== ANIVERSARIANTES (${state.criancas.length}) ===
${criancasCtx||"Nenhuma criança cadastrada."}

=== CASAMENTOS (${state.casamentos.length}) ===
${casamentosCtx||"Nenhum casamento cadastrado."}`;
}

/* =========================================================
   ENTRADA DE DADOS VIA IA — v1 (clientes + eventos)
   O chat "Conversar" também interpreta a mensagem em busca de
   informações estruturadas (dados de cliente/evento, preferências),
   agrupa tudo o que se refere ao mesmo cliente/evento numa única
   confirmação, e só grava no Firestore depois de clique explícito.
   Pagamentos NUNCA são tratados por aqui — só pelo formulário normal.
   ========================================================= */
const CAMPOS_IA_CLIENTES = ["nome","telefone","cidade","origem","indicadoPor","nomeConjuge"];
const CAMPOS_IA_EVENTOS = ["tipo","data","horario","endereco","valorContratado","valorTabela","status","nomeEvento","tags","dataEntregaPrevista","dataEntregaReal"];

let iaGruposPendentes = [];
let _iaGrupoIdSeq = 1;

function normalizarChaveEntidade(colecao, nomeMencionado){
  return `${colecao}::${normalizarTexto(nomeMencionado||"")}`;
}

function buscarCandidatosCliente(nome){
  return state.clientes
    .map(c=>({
      id: c.id,
      nome: c.nomeConjuge ? `${c.nome} & ${c.nomeConjuge}` : c.nome,
      score: Math.max(similaridadeNome(c.nome, nome), c.nomeConjuge ? similaridadeNome(c.nomeConjuge, nome) : 0)
    }))
    .filter(c=>c.score>=0.5)
    .sort((a,b)=>b.score-a.score)
    .slice(0,6);
}

function eventosDoClienteParaSelect(clienteId){
  return state.eventos
    .filter(e=>e.clienteId===clienteId)
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""))
    .map(e=>({ id:e.id, label: `${capitalize((e.tipo||"outro").replace("_"," "))} · ${formatDate(e.data)} · ${statusLabel(e.status||"confirmado")}` }));
}

function labelCampoIA(colecao, campo){
  const f = SCHEMAS[colecao]?.fields?.find(x=>x.key===campo);
  return f ? f.label : capitalize(campo);
}
function tipoCampoIA(colecao, campo){
  return SCHEMAS[colecao]?.fields?.find(x=>x.key===campo)?.type || "text";
}
function converterValorCampoIA(colecao, campo, valor){
  const tipo = tipoCampoIA(colecao, campo);
  if(tipo==="tags") return Array.isArray(valor) ? valor : String(valor||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(tipo==="number") return Number(valor)||0;
  if(tipo==="checkbox") return !!valor;
  return valor;
}

// agrupa as ações "cruas" que vieram do JSON da IA por entidade-alvo,
// pra apresentar UMA confirmação por cliente/evento mesmo que a mensagem
// tenha citado várias informações diferentes sobre ele
function processarAcoesDetectadas(acoesBrutas){
  if(!Array.isArray(acoesBrutas) || !acoesBrutas.length) return;
  const gruposDoLote = {};

  acoesBrutas.forEach(a=>{
    if(!a || (a.colecao!=="clientes" && a.colecao!=="eventos")) return; // v1: só clientes e eventos
    const nomeAlvo = a.colecao==="eventos" ? (a.clienteMencionado || a.nomeMencionado) : a.nomeMencionado;
    if(!nomeAlvo) return;
    const operacao = a.operacao==="criar" ? "criar" : "atualizar";
    const chave = normalizarChaveEntidade(a.colecao, nomeAlvo) + "::" + operacao;

    if(!gruposDoLote[chave]){
      const grupo = {
        id: "iaGrupo" + (_iaGrupoIdSeq++),
        colecao: a.colecao,
        operacao,
        nomeMencionado: nomeAlvo,
        itens: [],
        entidadeId: "",
        candidatos: buscarCandidatosCliente(nomeAlvo),
        eventoId: "",
        eventosDoCliente: []
      };
      // pré-seleciona o cliente só quando o melhor candidato é claramente o melhor
      if(grupo.candidatos.length){
        const [top, segundo] = grupo.candidatos;
        if(top.score>=0.85 && (!segundo || top.score-segundo.score>0.1)) grupo.entidadeId = top.id;
      }
      if(grupo.colecao==="eventos" && grupo.operacao==="atualizar" && grupo.entidadeId){
        grupo.eventosDoCliente = eventosDoClienteParaSelect(grupo.entidadeId);
        if(grupo.eventosDoCliente.length===1) grupo.eventoId = grupo.eventosDoCliente[0].id;
      }
      gruposDoLote[chave] = grupo;
    }

    const grupo = gruposDoLote[chave];
    const tipoItem = a.tipo==="comentario" ? "comentario" : "campo";
    let campo = tipoItem==="campo" ? a.campo : null;
    if(tipoItem==="campo"){
      const listaPermitida = a.colecao==="clientes" ? CAMPOS_IA_CLIENTES : CAMPOS_IA_EVENTOS;
      if(!listaPermitida.includes(campo)) return; // ignora campo fora do que o CRM sabe editar
    }
    grupo.itens.push({ id: grupo.id+"_"+grupo.itens.length, tipo:tipoItem, campo, valorNovo: a.valorNovo ?? "", resumoHumano: a.resumoHumano||"" });
  });

  const novosGrupos = Object.values(gruposDoLote).filter(g=>g.itens.length);
  iaGruposPendentes = [...iaGruposPendentes, ...novosGrupos];
}

function renderGruposPendentesIA(){
  if(!iaGruposPendentes.length) return "";
  return `<div style="margin:14px 0;">${iaGruposPendentes.map(renderGrupoIA).join("")}</div>`;
}

function renderGrupoIA(grupo){
  const isCliente = grupo.colecao==="clientes";
  const resumos = grupo.itens.map(i=>i.resumoHumano).filter(Boolean);

  const selectCliente = `
    <div class="field">
      <label>${isCliente ? "Cliente" : "Cliente do evento"}</label>

        <option value="__new__" ${grupo.entidadeId==="__new__"?"selected":""}>+ Cadastrar novo cliente: "${escapeHtml(grupo.nomeMencionado)}"</option>
        ${grupo.candidatos.map(c=>`<option value="${c.id}" ${grupo.entidadeId===c.id?"selected":""}>${escapeHtml(c.nome)} (${Math.round(c.score*100)}% parecido)</option>`).join("")}
      </select>
    </div>
  `;

  const podeEscolherEvento = !isCliente && grupo.operacao==="atualizar" && grupo.entidadeId && grupo.entidadeId!=="__new__";
  const selectEvento = podeEscolherEvento ? `
    <div class="field">
      <label>Qual evento</label>
      ${grupo.eventosDoCliente.length ? `
        <select onchange="onGrupoIASelecionarEvento('${grupo.id}', this.value)">
          <option value="">— selecione o evento —</option>
          ${grupo.eventosDoCliente.map(e=>`<option value="${e.id}" ${grupo.eventoId===e.id?"selected":""}>${e.label}</option>`).join("")}
        </select>` : `<div style="font-size:12px;color:var(--muted-2);">Este cliente não tem eventos cadastrados.</div>`}
    </div>
  ` : "";

  const itensHtml = grupo.itens.map(item=>{
    if(item.tipo==="comentario"){
      return `<div class="field"><label>Observação / preferência</label>
        <textarea oninput="onItemIAValorChange('${grupo.id}','${item.id}', this.value)">${escapeHtml(String(item.valorNovo))}</textarea></div>`;
    }
    const tipoCampo = tipoCampoIA(grupo.colecao, item.campo);
    const label = labelCampoIA(grupo.colecao, item.campo);
    if(tipoCampo==="select"){
      const f = SCHEMAS[grupo.colecao].fields.find(x=>x.key===item.campo);
      return `<div class="field"><label>${label}</label>
        <select onchange="onItemIAValorChange('${grupo.id}','${item.id}', this.value)">
          <option value="">—</option>
          ${f.options.map(o=>`<option value="${o}" ${item.valorNovo===o?"selected":""}>${item.campo==="status"?statusLabel(o):capitalize(o.replace("_"," "))}</option>`).join("")}
        </select></div>`;
    }
    const inputType = tipoCampo==="number" ? "number" : tipoCampo==="date" ? "date" : tipoCampo==="time" ? "time" : "text";
    const valorExibicao = Array.isArray(item.valorNovo) ? item.valorNovo.join(", ") : item.valorNovo;
    return `<div class="field"><label>${label}</label>
      <input type="${inputType}" value="${valorExibicao??""}" oninput="onItemIAValorChange('${grupo.id}','${item.id}', this.value)"></div>`;
  }).join("");

  const bloqueado = !grupo.entidadeId || (!isCliente && grupo.operacao==="atualizar" && grupo.entidadeId!=="__new__" && !grupo.eventoId);

  return `

function encontrarGrupoIA(id){ return iaGruposPendentes.find(g=>g.id===id); }
function rerenderAcoesPendentesIA(){

}
function onGrupoIASelecionarCliente(grupoId, clienteId){
  const grupo = encontrarGrupoIA(grupoId);
  if(!grupo) return;
  grupo.entidadeId = clienteId;
  if(grupo.colecao==="eventos" && grupo.operacao==="atualizar" && clienteId && clienteId!=="__new__"){
    grupo.eventosDoCliente = eventosDoClienteParaSelect(clienteId);
    grupo.eventoId = grupo.eventosDoCliente.length===1 ? grupo.eventosDoCliente[0].id : "";
  }
  rerenderAcoesPendentesIA();
}
function onGrupoIASelecionarEvento(grupoId, eventoId){
  const grupo = encontrarGrupoIA(grupoId);
  if(grupo){ grupo.eventoId = eventoId; rerenderAcoesPendentesIA(); }
}
function onItemIAValorChange(grupoId, itemId, novoValor){
  const grupo = encontrarGrupoIA(grupoId);
  const item = grupo?.itens.find(i=>i.id===itemId);
  if(item) item.valorNovo = novoValor;
}
function cancelarGrupoIA(grupoId){
  iaGruposPendentes = iaGruposPendentes.filter(g=>g.id!==grupoId);
  rerenderAcoesPendentesIA();
}

async function confirmarGrupoIA(grupoId){
  const grupo = encontrarGrupoIA(grupoId);
  if(!grupo) return;
  if(!grupo.entidadeId){ toast("Selecione o cliente correto primeiro."); return; }
  if(grupo.colecao==="eventos" && grupo.operacao==="atualizar" && !grupo.eventoId){ toast("Selecione o evento primeiro."); return; }
  try{
    const ok = grupo.colecao==="clientes" ? await confirmarGrupoClienteIA(grupo) : await confirmarGrupoEventoIA(grupo);
    if(ok===false) return; // um toast específico já foi mostrado explicando o motivo
    iaGruposPendentes = iaGruposPendentes.filter(g=>g.id!==grupoId);
    rerenderAcoesPendentesIA();
    toast("Informação salva no CRM.");
  }catch(err){
    console.error(err);
    toast("Erro ao salvar. Veja o console.");
  }
}

async function confirmarGrupoClienteIA(grupo){
  const camposItens = grupo.itens.filter(i=>i.tipo==="campo");
  const comentarioItens = grupo.itens.filter(i=>i.tipo==="comentario");
  const dadosCampos = {};
  camposItens.forEach(i=> dadosCampos[i.campo] = converterValorCampoIA("clientes", i.campo, i.valorNovo));

  let clienteId = grupo.entidadeId;
  if(clienteId==="__new__"){
    const novo = { nome: grupo.nomeMencionado, ...dadosCampos, criadoEm: new Date().toISOString() };
    const ref = await db.collection("clientes").add(novo);
    clienteId = ref.id;
  } else if(Object.keys(dadosCampos).length){
    await db.collection("clientes").doc(clienteId).update(dadosCampos);
  }
  if(comentarioItens.length){
    const cliente = state.clientes.find(c=>c.id===clienteId);
    const novosComentarios = [...(cliente?.comentarios||[]), ...comentarioItens.map(i=>({ texto:i.valorNovo, criadoEm:new Date().toISOString() }))];
    await db.collection("clientes").doc(clienteId).update({ comentarios: novosComentarios });
  }
}

async function confirmarGrupoEventoIA(grupo){
  const camposItens = grupo.itens.filter(i=>i.tipo==="campo");
  const comentarioItens = grupo.itens.filter(i=>i.tipo==="comentario"); // regra: comentário sempre vai pro cliente, nunca pro evento

  let clienteId = grupo.entidadeId;
  if(clienteId==="__new__"){
    const ref = await db.collection("clientes").add({ nome: grupo.nomeMencionado, criadoEm: new Date().toISOString() });
    clienteId = ref.id;
  }

  if(comentarioItens.length){
    const cliente = state.clientes.find(c=>c.id===clienteId);
    const novosComentarios = [...(cliente?.comentarios||[]), ...comentarioItens.map(i=>({ texto:i.valorNovo, criadoEm:new Date().toISOString() }))];
    await db.collection("clientes").doc(clienteId).update({ comentarios: novosComentarios });
  }

  if(grupo.operacao==="criar"){
    const dados = { clienteId, status:"confirmado", criadoEm: new Date().toISOString() };
    camposItens.forEach(i=> dados[i.campo] = converterValorCampoIA("eventos", i.campo, i.valorNovo));
    if(!dados.tipo){ toast("Identifique o tipo do evento antes de confirmar (edite manualmente pelo formulário normal)."); return false; }
    if(!dados.data){ toast("Identifique a data do evento antes de confirmar (edite manualmente pelo formulário normal)."); return false; }
    await db.collection("eventos").add(dados);
  } else {
    const dados = {};
    camposItens.forEach(i=> dados[i.campo] = converterValorCampoIA("eventos", i.campo, i.valorNovo));
    if(Object.keys(dados).length) await db.collection("eventos").doc(grupo.eventoId).update(dados);
  }
}

async function enviarMensagemChat(){
  const input = document.getElementById("chat-input");
  const texto = input ? input.value.trim() : "";
  if(!texto) return;
  if(input) input.value = "";

  chatHistory.push({ role:"user", content:texto });

  const msgs = document.getElementById("chat-messages");
  if(msgs){
    msgs.innerHTML = renderChatHistory() + `<div class="chat-bubble ai thinking"><div class="ai-label">CRM Assistant</div>Pensando...</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }

  const contexto = getCrmContext();
  // envia as últimas 15 perguntas (30 mensagens) pra IA ter o contexto completo da conversa salva
  const historico = chatHistory.slice(-30).map(m=>`${m.role==="user"?"Yuri":"Assistente"}: ${m.content}`).join("\n");
  const prompt = `${contexto}

=== CONVERSA ===
${historico}

Além de responder à última mensagem de Yuri, identifique se ela contém informações novas que deveriam ser salvas no CRM (dados de cliente, dados de evento, preferências/observações, mudanças de data/valor/status/endereço, etc). NUNCA identifique ações sobre pagamentos — pagamentos são sempre lançados manualmente no sistema, nunca pela IA.

Responda APENAS um JSON válido, sem markdown, sem texto fora do JSON, exatamente neste formato:
{
  "resposta": "sua resposta em texto normal para a última mensagem de Yuri",
  "acoes": [
    {
      "colecao": "clientes ou eventos",
      "operacao": "criar ou atualizar",
      "nomeMencionado": "nome do cliente mencionado (obrigatório quando colecao=clientes)",
      "clienteMencionado": "nome do cliente responsável (obrigatório quando colecao=eventos, mesmo pra atualização de evento)",
      "tipo": "campo ou comentario",
      "campo": "obrigatório se tipo=campo. clientes: nome|telefone|cidade|origem|indicadoPor|nomeConjuge. eventos: tipo|data|horario|endereco|valorContratado|valorTabela|status|nomeEvento|tags|dataEntregaPrevista|dataEntregaReal",
      "valorNovo": "valor sugerido (datas em AAAA-MM-DD, valores monetários apenas número, sem R$)",
      "resumoHumano": "frase curta em português explicando a ação, pra Yuri confirmar"
    }
  ]
}
Regras importantes:
- Se a mensagem for só uma pergunta ou não tiver informação nova a salvar, retorne "acoes": [].
- Preferências, observações, elogios ou reclamações sobre alguém são sempre tipo:"comentario" na colecao "clientes" (nunca em "eventos").
- Se a mensagem tiver várias informações distintas, retorne uma ação para cada uma — todas aparecerão juntas numa única confirmação por cliente/evento.
- Nunca invente dados que não estejam explícitos na mensagem.`;

  const resultado = await callGemini(prompt, 0, GEMINI_MODEL_CHAT);

  let respostaTexto;
  if(resultado.texto){
    try{
      const limpo = resultado.texto.replace(/```json|```/g,"").trim();
      const dados = JSON.parse(limpo);
      respostaTexto = dados.resposta || "Certo.";
      processarAcoesDetectadas(dados.acoes);
    }catch(err){
      console.error("[chat-ia] resposta não veio em JSON válido, mostrando texto cru:", err, resultado.texto);
      respostaTexto = resultado.texto;
    }
  } else {
    respostaTexto = `Erro: ${resultado.erro || "não foi possível processar."}`;
  }
  chatHistory.push({ role:"ai", content:respostaTexto });

  if(msgs){
    msgs.innerHTML = renderChatHistory();
    msgs.scrollTop = msgs.scrollHeight;
  }
  rerenderAcoesPendentesIA();
  const btn = document.querySelector(".chat-input-row button");
  if(btn) btn.disabled = false;

  salvarChatHistoricoRemoto();
}

function renderAgendaLista(){
  const hoje = new Date().toISOString().slice(0,10);

  // só eventos futuros (incluindo hoje)
  const porMes = {};
  state.eventos.filter(e=>e.data && e.data>=hoje).forEach(e=>{
    const chave = e.data.slice(0,7);
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"evento", item:e});
  });

  // bloqueios futuros (incluindo hoje)
  state.bloqueios.filter(b=>b.data && b.data>=hoje).forEach(b=>{
    const chave = b.data.slice(0,7);
    if(!porMes[chave]) porMes[chave] = [];
    porMes[chave].push({tipo:"bloqueio", item:b});
  });

  const mesesOrdenados = Object.keys(porMes).sort();
  if(!mesesOrdenados.length) return `<div class="card"><div class="empty-state">Nenhum evento ou bloqueio futuro cadastrado.</div></div>`;

  return mesesOrdenados.map(chave=>{
    const [ano, mes] = chave.split("-");
    const titulo = `${MESES[Number(mes)-1]} ${ano}`;
    const isOpen = agendaListaExpandida.has(chave);
    const itens = porMes[chave].sort((a,b)=>{
      const da = (a.item.data||"")+(a.item.horario||"");
      const db2 = (b.item.data||"")+(b.item.horario||"");
      return da.localeCompare(db2);
    });
    const evs = itens.filter(i=>i.tipo==="evento");
    const bloqs = itens.filter(i=>i.tipo==="bloqueio");
    const totalValor = evs.reduce((s,{item:e})=>s+(Number(e.valorContratado)||0),0);
    const resumo = `${evs.length} evento${evs.length===1?"":"s"}${bloqs.length?` · ${bloqs.length} bloqueio${bloqs.length===1?"":"s"}`:""}${totalValor?` · ${money(totalValor)}`:""}`;

    return `
      <div class="card" style="padding:0; margin-bottom:10px; overflow:hidden;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:13px 18px; cursor:pointer;"
             onclick="toggleAgendaMes('${chave}')">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-family:'Fraunces',serif; font-size:17px;">${isOpen?"▾":"▸"} ${titulo}</span>
            <span style="font-size:12px; color:var(--muted);">${resumo}</span>
          </div>
          <span style="font-size:12px; color:var(--muted-2);">${isOpen?"recolher":"expandir"}</span>
        </div>
        ${isOpen ? `
          <div style="border-top:1px solid var(--border-solid);">
            ${itens.map(({tipo, item})=>{
              if(tipo==="bloqueio") return `
                <div style="display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:repeating-linear-gradient(90deg,var(--surface-2) 0px,var(--surface-2) 6px,transparent 6px,transparent 12px);">
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:13px; font-weight:600; color:var(--muted);">🚫 Data bloqueada · ${formatDate(item.data)}</div>
                    ${item.motivo?`<div style="font-size:12px;color:var(--muted-2);">${item.motivo}</div>`:""}
                  </div>
                  <div class="row-actions">
                    <button class="sm" onclick="abrirBloquearDataEditar('${item.id}','${item.data}','${(item.motivo||"").replace(/'/g,"\\'")}')">Editar</button>
                    <button class="sm danger" onclick="desbloquearData('${item.id}')">Remover</button>
                  </div>
                </div>`;
              const e = item;
              const saldo = (Number(e.valorContratado)||0) - totalPago(e.id);
              return `
                <div style="display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;">
                  <div style="width:6px; height:36px; border-radius:3px; background:${corHexTipo(e.tipo)}; flex-shrink:0;"></div>
                  <div style="flex:1; min-width:0; cursor:pointer;" onclick="openView('eventos','${e.id}')">
                    <div style="font-weight:600; font-size:14px;">${e.nomeEvento||nomeRef("clientes",e.clienteId)}</div>
                    <div style="font-size:12px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;">
                      <span>${formatDate(e.data)}${e.horario?" · "+e.horario:""}</span>
                      <span class="ev-chip ${e.tipo||'outro'}" style="font-size:10px;">${capitalize((e.tipo||"outro").replace("_"," "))}</span>
                      <span class="badge ${e.status||'confirmado'}" style="font-size:10px;">${statusLabel(e.status||"confirmado")}</span>
                    </div>

                  </div>

            }).join("")}

      </div>
    `;
  }).join("");
}

const agendaListaExpandida = new Set();
// abre automaticamente o mês atual e o próximo
(()=>{
  const hoje = new Date();
  agendaListaExpandida.add(`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`);
  const prox = new Date(hoje.getFullYear(), hoje.getMonth()+1, 1);
  agendaListaExpandida.add(`${prox.getFullYear()}-${String(prox.getMonth()+1).padStart(2,"0")}`);
})();
function toggleAgendaMes(chave){
  if(agendaListaExpandida.has(chave)) agendaListaExpandida.delete(chave);
  else agendaListaExpandida.add(chave);
  renderPage("agenda");
}

function navCal(dir){
  calMes += dir;
  if(calMes>11){calMes=0;calAno++;}
  if(calMes<0){calMes=11;calAno--;}
  renderPage("agenda");
}
function renderGridCal(){
  const primeiroDia = new Date(calAno, calMes, 1).getDay();
  const ultimoDia = new Date(calAno, calMes+1, 0).getDate();
  const hoje = new Date().toISOString().slice(0,10);
  let cells = [];
  for(let i=0;i<primeiroDia;i++){
    const d = new Date(calAno, calMes, i-primeiroDia+1);
    cells.push(renderDiaCal(d,true));
  }
  for(let d=1;d<=ultimoDia;d++) cells.push(renderDiaCal(new Date(calAno,calMes,d),false));
  while(cells.length%7!==0) cells.push(renderDiaCal(new Date(calAno,calMes+1,cells.length-primeiroDia-ultimoDia+1),true));
  return cells.join("");
}
function isoFromDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function renderDiaCal(data, outromes){
  const iso = isoFromDate(data);
  const hoje = new Date().toISOString().slice(0,10);
  const evsDia = state.eventos.filter(e=>e.data===iso);
  const bloqDia = state.bloqueios.find(b=>b.data===iso);
  const preDia = state.prereservas.filter(p=>p.data===iso);
  const classes = ["cal-day", outromes?"other-month":"", iso===hoje?"today":"", bloqDia?"blocked":"", evsDia.length?"has-events":"", preDia.length?"prereservado":""].filter(Boolean).join(" ");
  return `<div class="${classes}" onclick="abrirDiaCal('${iso}')">
    <div class="cal-day-num">${data.getDate()}</div>
    <div class="cal-day-events">

      ${preDia.length && !evsDia.length ? `<div class="cal-ev" style="background:#eab308;color:#000;">🕓 ${preDia.length} interessado${preDia.length>1?"s":""}</div>` : ""}

function corClasseTipo(e){
  return e.tipo||"outro";
}
function corHexTipo(tipo){ return {aniversario:"#f97316",batizado:"#06b6d4",casamento_civil:"#a855f7",casamento_religioso:"#a855f7",ensaio:"#3b82f6"}[tipo]||"#6b7280"; }
function nomeEventoCurto(e){
  if(e.nomeEvento) return e.nomeEvento.split(" ").slice(0,3).join(" ");
  const c = state.clientes.find(x=>x.id===e.clienteId);
  return c ? c.nome.split(" ")[0] : capitalize((e.tipo||"outro").replace("_"," "));
}
function calcDisponibilidade(iso){
  const bloq = state.bloqueios.find(b=>b.data===iso);
  if(bloq) return {label:"Bloqueada 🚫", cor:"#6b7280"};
  const evs = state.eventos.filter(e=>e.data===iso);
  if(!evs.length) return {label:"Livre ✓", cor:"#22c55e"};
  return {label:"Ocupada ●", cor:"#ef4444"};
}

function modalBloqueioHtml(titulo, dataVal, motivoVal, horarioVal, apenasHorarioVal, btnFn){
  return `
    <h3>${titulo}</h3>
    <div class="field"><label>Data</label><input id="bloq-data" type="date" value="${dataVal||""}"></div>
    <div class="field"><label>Motivo (opcional)</label><input id="bloq-motivo" type="text" value="${motivoVal||""}" placeholder="Ex: Férias, Igreja, Compromisso pessoal"></div>
    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="bloq-apenas-horario" ${apenasHorarioVal?"checked":""} onchange="document.getElementById('bloq-horario-wrap').style.display=this.checked?'block':'none'" style="width:18px;height:18px;">
      <label for="bloq-apenas-horario" style="margin:0;">Bloquear apenas um horário específico</label>
    </div>
    <div id="bloq-horario-wrap" style="display:${apenasHorarioVal?"block":"none"};">
      <div class="field-row">
        <div class="field"><label>Início</label><input id="bloq-hora-inicio" type="time" value="${horarioVal?.inicio||""}"></div>
        <div class="field"><label>Fim</label><input id="bloq-hora-fim" type="time" value="${horarioVal?.fim||""}"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="ghost" onclick="${btnFn}; setTimeout(()=>exportarBloqueioGCal(),400)">💾 Salvar + Google Agenda</button>
      <button class="primary" onclick="${btnFn}">Salvar</button>
    </div>
  `;
}
function exportarBloqueioGCal(){
  const data = document.getElementById("bloq-data")?.value;
  const motivo = document.getElementById("bloq-motivo")?.value||"Bloqueio";
  const apenasHorario = document.getElementById("bloq-apenas-horario")?.checked;
  const horaInicio = document.getElementById("bloq-hora-inicio")?.value;
  const horaFim = document.getElementById("bloq-hora-fim")?.value;
  if(!data) return;
  const dataBase = data.replace(/-/g,"");
  let datas;
  if(apenasHorario && horaInicio && horaFim){
    datas = dataBase+"T"+horaInicio.replace(":","")+"00/"+dataBase+"T"+horaFim.replace(":","")+"00";
  } else {
    datas = dataBase+"/"+dataBase;
  }
  const params = new URLSearchParams({ action:"TEMPLATE", text:motivo, dates:datas, details:"Bloqueado no CRM Yuri Silva Fotografias" });
  window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, "_blank");
}

    <h3>Dar baixa — ${p.produtoNome||"Produto"} · ${nomeRef("clientes",p.clienteId)}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Saldo pendente: ${money(saldo)}</div>

        </select>
      </div>

        <select onchange="formState.tipo=this.value" style="width:100%">

        </select>

  `;

async function confirmarBaixaRapidaProduto(){
  const p = state.produtos.find(x=>x.id===formState._baixaProdutoId);
  if(!p) return;
  const valor = Number(formState.valor);
  if(!valor || valor<=0){ toast("Informe um valor válido."); return; }
  try{
    await db.collection("pagamentos").add({
      produtoId: p.id, clienteId: p.clienteId||"", valor,
      data: formState.data, forma: formState.forma, tipo: formState.tipo,
      criadoEm: new Date().toISOString()
    });
    toast("Pagamento registrado.");
    closeModal();
  }catch(err){
    console.error(err);
    toast("Erro ao registrar o pagamento.");
  }
}

function renderRelatorios(main){
  const anoAtual = new Date().getFullYear();
  const anoStr = String(anoAtual);
  const todosOsTipos = ["aniversario","batizado","casamento_civil","casamento_religioso","ensaio","outro"];

  // ---------- Resumo do ano corrente ----------
  const eventosAno = state.eventos.filter(e=>(e.data||"").startsWith(anoStr));
  const pagamentosAno = state.pagamentos.filter(p=>(p.data||"").startsWith(anoStr));
  const recebidoAno = pagamentosAno.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const contratadoAno = eventosAno.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const pendenteAno = eventosAno.reduce((s,e)=>s+Math.max((Number(e.valorContratado)||0)-totalPago(e.id),0),0);
  const clientesNovosAno = state.clientes.filter(c=>(c.criadoEm||"").startsWith(anoStr)).length;
  const eventosEntreguesAno = eventosAno.filter(e=>e.status==="entregue").length;
  const eventosFechadosAno = eventosAno.filter(e=>(e.status||"confirmado")!=="perdido").length;
  const ticketMedioAno = eventosFechadosAno ? contratadoAno / eventosFechadosAno : 0;
  const tipoMaisComumAno = (()=>{
    const count = {};
    eventosAno.forEach(e=>{ count[e.tipo||"outro"]=(count[e.tipo||"outro"]||0)+1; });
    const top = Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
    return top ? capitalize(top[0].replace("_"," ")) : "—";
  })();
  const porTipo = todosOsTipos.map(t=>{
    const todosDoTipo = state.eventos.filter(e=>e.tipo===t);
    const comValor = todosDoTipo.filter(e=>Number(e.valorContratado)>0);
    const soma = comValor.reduce((s,e)=>s+Number(e.valorContratado),0);
    return { tipo:t, total: todosDoTipo.length, comValor: comValor.length, media: comValor.length ? soma/comValor.length : 0, soma };
  }).filter(x=>x.total>0);

  const origens = ["instagram","indicacao","google","igreja","outro"];
  const totalClientes = state.clientes.length;
  const semOrigem = state.clientes.filter(c=>!c.origem).length;
  const porOrigem = origens.map(o=>{
    const n = state.clientes.filter(c=>c.origem===o).length;
    return { origem:o, n, pct: totalClientes ? Math.round(n/totalClientes*100) : 0 };
  }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);

  const totalContratado = state.eventos.reduce((s,e)=>s+(Number(e.valorContratado)||0),0);
  const totalRecebido = state.pagamentos.reduce((s,p)=>s+(Number(p.valor)||0),0);

  // ---------- Descontos ----------
  const eventosComDesconto = state.eventos
    .map(e=>({ e, desconto: (Number(e.valorTabela)||0) - (Number(e.valorContratado)||0) }))
    .filter(x=> x.desconto>0 && Number(x.e.valorTabela)>0);
  const totalDescontoDado = eventosComDesconto.reduce((s,x)=>s+x.desconto,0);
  const descontoPorTipo = todosOsTipos.map(t=>{
    const doTipo = eventosComDesconto.filter(x=>x.e.tipo===t);
    const soma = doTipo.reduce((s,x)=>s+x.desconto,0);
    return { tipo:t, n: doTipo.length, soma, media: doTipo.length ? soma/doTipo.length : 0 };
  }).filter(x=>x.n>0);

  // ---------- Taxa de retorno de clientes ----------
  const eventosPorCliente = {};
  state.eventos.forEach(e=>{ if(e.clienteId) (eventosPorCliente[e.clienteId] = eventosPorCliente[e.clienteId]||[]).push(e); });
  const clientesComEvento = Object.keys(eventosPorCliente);
  const clientesRecorrentes = clientesComEvento.filter(id=>eventosPorCliente[id].length>1);
  const taxaRetorno = clientesComEvento.length ? (clientesRecorrentes.length/clientesComEvento.length*100) : 0;
  const mediaEventosPorCliente = clientesComEvento.length ? (state.eventos.filter(e=>e.clienteId).length/clientesComEvento.length) : 0;
  const clientesVip = clientesRecorrentes
    .map(id=>({
      id, nome:nomeRef("clientes",id), n:eventosPorCliente[id].length,
      valorTotal: eventosPorCliente[id].reduce((s,e)=>s+(Number(e.valorContratado)||0),0)
    }))
    .sort((a,b)=>b.valorTotal-a.valorTotal).slice(0,10);

  // padrões de recorrência (tipo A -> tipo B em sequência cronológica)
  const padroes = {};
  clientesRecorrentes.forEach(id=>{
    const seq = [...eventosPorCliente[id]].sort((a,b)=>(a.data||"").localeCompare(b.data||""));
    for(let i=0;i<seq.length-1;i++){
      const chave = `${capitalize((seq[i].tipo||"").replace("_"," "))} → ${capitalize((seq[i+1].tipo||"").replace("_"," "))}`;
      padroes[chave] = (padroes[chave]||0)+1;
