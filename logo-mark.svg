  <!--
    Marca do logo: a câmera com o "S" de Silva, recortada do logo original
    (brand/logo-yuri.svg) — são os dois traçados daquele arquivo, sem
    redesenho, só com a viewBox fechada em volta deles. Existe separada do
    logo inteiro porque o nome por extenso não se lê num favicon de 16px.

    É o mesmo arquivo que o painel de galerias usa, para o CRM e as galerias
    aparecerem com o mesmo ícone na tela inicial do celular.

    Usada em dois lugares: favicon (link rel=icon) e ícones do app instalado
    (icon-*.png e apple-touch-icon.png, gerados a partir daqui). O
    preenchimento é preto no tema claro e quase branco no escuro: um favicon
    SVG responde ao prefers-color-scheme, então o ícone não some na aba
    quando o sistema está no escuro.
  -->
  <style>
    .marca{fill:#111111;}
    @media (prefers-color-scheme: dark){ .marca{fill:#F2F4F5;} }
  </style>
